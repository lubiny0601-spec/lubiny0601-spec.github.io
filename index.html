生物中的沉默生物合成通路，可能编码未发现的天然产物。", "u": "https://www.genengnews.com/topics/bioprocessing/microbial-dark-matter-could-revive-antibiotics/", "d": "2026-10-29", "tr": ["管线上新"], "th": ["抗菌药物", "耐药与院感"], "src": "GEN Genetic Engineering & Biotechnology News", "sel": false, "sc": 12.0, "rs": null}, {"t": "米内网统计第13批集采候选品种，53个药竞争企业达7家以上", "s": "随着第12批集采中选结果多地公布执行时间，米内网按治疗领域统计了尚未纳入集采且竞争企业数（原研+过评）在7家及以上的药品，共涉及呼吸系统化药15个、抗肿瘤和免疫调节剂16个、高血压化药10个、皮肤病化药10个等品类。文章提示部分品种因专利期、产品属性或市场规模可能不会被纳入，最终以官方信息为准。", "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653668532&idx=3&sn=846e623fa17a180914068fd8530735c2&chksm=bc740064201af89f64d85a653a66382ed6c06310258371edfa18bc8fa7693ce2afd15c919167&scene=126&sessionid=1793202325#rd", "d": "2026-10-28", "tr": ["市场准入"], "th": ["抗菌药物"], "src": "赛柏蓝", "sel": true, "sc": 47.0, "rs": "梳理了尚未纳入集采且竞争企业达7家以上的品种分布，可用来预判第13批集采的候选范围。"}, {"t": "6家医院124万份病历对比：AI感控预警系统使院感发生率降近三分之一", "s": "上海市徐汇区中心医院联合6家三级医院开展多中心对照研究，3家使用AI感染实时监测与预警系统、3家采用传统人工监测，两年共纳入124万份住院患者数据。结果显示，AI系统组医院感染发生率下降近三分之一，多耐药发生率明显下降，聚集性事件预警排查由约3天缩短至约1天。该系统与HIS、LIS对接，可提醒医生护士及时防控，二级和基层医院同样具备应用可能。", "u": "https://mp.weixin.qq.com/s?__biz=MzAxNDYzMDM4MA==&mid=2650200251&idx=1&sn=05acd6acac4bb40aee272f25c4a83b74&chksm=8248808896229f26dde03b3950cf7829aa571b89aae31814f172d82730caec1f8fbdc4ad6440&scene=126&sessionid=1793202279#rd", "d": "2026-10-28", "tr": ["循证指南"], "th": ["耐药与院感"], "src": "SIFIC 感染视界", "sel": false, "sc": 22.0, "rs": null}, {"t": "流感、新冠核酸均阴性仍不能排除病毒性肺炎：40岁女性高热黄痰、CRP 125.6 mg/L、双肺斑片影，mNGS检出人偏肺病毒", "s": "40岁女性高热咳嗽咳黄痰4天，甲型流感、乙型流感及新冠病毒核酸均阴性，CRP 125.6 mg/L、PCT 0.03 ng/mL，胸部CT示双肺多发斑片灶，经验性抗细菌治疗无好转。支气管肺泡灌洗液DNA+RNA mNGS检出大量人偏肺病毒核酸序列（28576条），最终诊断人偏肺病毒肺炎。人偏肺病毒感染尚无特异性抗病毒治疗，以支持治疗为主，检出病毒后仍需复评经验性抗菌用药的必要性。", "u": "https://mp.weixin.qq.com/s?__biz=MzU3NjA5MTM2OQ==&mid=2247604092&idx=1&sn=663f1b08a9d28d4cb1a3ec67bd28eddb&chksm=fcaa2c983770a402ef2b632f7b104aeb6b7f618ad91988d78a7a1dcb72c4ee44d54e3e133924&scene=126&sessionid=1793627912#rd", "d": "2026-10-28", "tr": ["循证指南"], "th": ["感染/疫苗", "耐药与院感"], "src": "呼吸界", "sel": false, "sc": 22.0, "rs": null}, {"t": "安徽拟规定未挂网药品医保不予结算，2027年起执行", "s": "安徽省医保局10月28日发布《关于明确药品挂网与医保结算联动有关事项的通知（征求意见稿）》，拟自2027年1月1日起对定点医疗机构采购的未挂网药品费用原则上不予医保结算，撤网药品给1个月过渡期，意见征集截止11月10日。", "u": "https://mp.weixin.qq.com/s?__biz=MjM5NDEwMDQ2Mg==&mid=2658699395&idx=1&sn=e73eaf0e5c9063d11153b2f78c85a1fa&chksm=bc85d57267dcd99b7283433eea43e35f7e771505b0cea413385596b390dadb5adaaae4c70a75&scene=126&sessionid=1793627945#rd", "d": "2026-10-28", "tr": ["市场准入"], "th": [], "src": "医药云端工作室", "sel": true, "sc": 72.0, "rs": "安徽拟将挂网与医保结算绑定，文中对比江苏、河北的执行节奏与覆盖范围差异，可看清各省准入收紧的推进路径。"}, {"t": "【山东】人工晶体集采降价惠及低保白内障患者，青岛西海岸新区赵女士双眼手术后自付600元", "s": "青岛西海岸新区低保群众赵女士在医用耗材集采与医保报销政策支持下完成双眼白内障手术，个人仅自付600元。人工晶体集采后由近4000元降至900元左右，叠加基本医保支付与低保人群倾斜政策，整体花费大幅下降。术后赵女士视力恢复明显，可自主进食、扶墙慢行，家庭照护负担明显减轻。", "u": "http://www.nhsa.gov.cn/art/2026/9/29/art_14_22386.html", "d": "2026-10-28", "tr": ["市场准入"], "th": [], "src": "国家医保局", "sel": false, "sc": 12.0, "rs": null}, {"t": "海正药业｜浙江海正药业股份有限公司关于签署专利技术平台及产品授权合作协议的公告", "s": "", "u": "https://static.cninfo.com.cn/finalpage/2026-10-28/1225632117.PDF", "d": "2026-10-28", "tr": ["企业竞争"], "th": [], "src": "海正药业·公司公告", "sel": false, "sc": 45.0, "rs": null}, {"t": "大感控·大家谈 第05期丨俞云松：看清耐药菌传播轨迹，把诊断、治疗与防控连起来", "s": "浙江大学医学院附属邵逸夫医院俞云松教授在“大感控·大家谈”第05期访谈中提出，感染诊疗与感控应作为整体推进，并以碳青霉烯耐药肺炎克雷伯菌基因组分析、家庭环境MRSA溯源等案例说明如何将传播证据转化为防控行动。他强调分子流行病学与大数据分析结合可梳理院内传播线索，感染病学科、院感科、微生物科、临床药师及临床科室需协同，同时肯定护理人员在消毒与操作规程落实中的作用。", "u": "https://mp.weixin.qq.com/s?__biz=MzAxNDYzMDM4MA==&mid=2650200246&idx=1&sn=a675d41ea40a0b82cb9820d2961507c5&chksm=8277dea3d6012d52d4b6b830f725e2d6fa5db39785245bd7faa9c412e428fe92e5359273f92f&scene=126&sessionid=1793108467#rd", "d": "2026-10-27", "tr": ["专家会议"], "th": ["耐药与院感"], "src": "SIFIC 感染视界", "sel": false, "sc": 22.0, "rs": null}, {"t": "全国首个省级医保病理云集采征求意见：重庆设15元/人次限价、5年采购周期", "s": "重庆市医保局就全国首个省级医保病理云（数字切片）服务集采公开征求意见，设置15元/人次最高投标限价，采购周期5年。评标总分100分中价格仅占10分、技术占60分、商务占30分，报价低于限价80%须提交成本合理性证明，否则否决投标。履约期每12个月考核一次，不达标企业有3个月整改窗口，整改期满仍不达标即终止资格。", "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653668223&idx=4&sn=97bc26b7fbef67b557db2d8f5546bdc7&chksm=bc79a82ee17b4c3fd25ddbc3cb8aa4c5d82e651a5f9e85436d31e61986f3dd9e491af4f7f4d4&scene=126&sessionid=1793107872#rd", "d": "2026-10-26", "tr": ["市场准入"], "th": [], "src": "手动推送（公众号）", "sel": false, "sc": 12.0, "rs": null}, {"t": "第12批国家集采落地推进，江西11月16日、辽宁11月26日起执行", "s": "第12批国家组织药品集采进入落地准备期，江西明确自11月16日零时起执行、采购周期至2029年12月31日，辽宁自11月26日起执行，上海等地陆续安排挂网申报与配送企业选定。", "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653668171&idx=1&sn=42309b8e4cf426b9e15f827b4647a86a&chksm=bc913a4843a3132d523f2655117ff6c22f5813c1478360f3ea341b0fa6660c32ee54fb92189d&scene=126&sessionid=1793151937#rd", "d": "2026-10-25", "tr": ["市场准入"], "th": [], "src": "赛柏蓝", "sel": true, "sc": 68.0, "rs": "梳理第12批国采在各省的挂网、配送与考核安排，可对照本省执行节奏和价格联动要求。"}, {"t": "第12批国家集采落地推进，江西、辽宁明确执行时间，10地发文安排挂网", "s": "第12批国家组织药品集采进入落地准备期，江西明确自11月16日起执行、采购周期至2029年12月31日，辽宁自11月26日起执行，上海等地陆续安排挂网申报、配送企业选定和协议签订，安徽、甘肃、湖北、天津、宁夏、西藏、河北7地也公布相关安排。", "u": "https://mp.weixin.qq.com/s/1vlOViJVERKw5q_FdM2-bA", "d": "2026-10-25", "tr": ["市场准入"], "th": [], "src": "手动推送（公众号）", "sel": true, "sc": 72.0, "rs": "梳理第12批国采在各省的挂网、配送与考核安排，可对照本省执行节奏和价格联动要求。"}, {"t": "华北制药注射用哌拉西林钠他唑巴坦钠/氯化钠注射液获药品注册证书，为国内首家获批", "s": "华北制药收到NMPA核准签发的注射用哌拉西林钠他唑巴坦钠/氯化钠注射液《药品注册证书》，为国内首家获批企业，该双室制剂国内此前无上市销售产品。规格为粉体室4.5g（哌拉西林钠4.0g与他唑巴坦钠0.5g）加液体室100ml：0.9g氯化钠，注册分类化学药品4类，批准文号国药准字H20266333，有效期至2031年10月19日，累计研发投入2,637.25万元。", "u": "https://static.cninfo.com.cn/finalpage/2026-10-24/1225619994.PDF", "d": "2026-10-24", "tr": ["管线上新"], "th": ["抗菌药物"], "src": "华北制药·公司公告", "sel": true, "sc": 60.0, "rs": "国内首个哌拉西林钠他唑巴坦钠双室制剂获批，公告同时给出同类粉针剂年销售额与销量，可据此判断这一剂型的市场空间。"}, {"t": "颅内手术感染危险因素研究：传统\"三大管\"未入列，预测模型效能0.745丨SIFIC2026·壁报交流", "s": "郑州人民医院刘琛基于2020年至2025年颅内手术患者数据发现，术前存在感染、引流管天数、术后腰椎穿刺是术后感染的独立危险因素，而呼吸机、中心静脉置管、泌尿道置管\"三大管\"未入列。研究显示引流管留置7至14天风险占比最高，预测模型效能为0.745。湘雅医院李春辉点评建议开展多中心大样本研究以提升预测效能。", "u": "https://mp.weixin.qq.com/s?__biz=MzAxNDYzMDM4MA==&mid=2650200215&idx=1&sn=acde445fb46f85f9d101850f4dc1fb81&chksm=824c3b29d5be48071ad8cd3d3cbe5d52258f08e49ef68ca14ac561bb34c6c9e63e76cad2f3fc&scene=126&sessionid=1793108467#rd", "d": "2026-10-23", "tr": ["循证指南"], "th": ["耐药与院感"], "src": "SIFIC 感染视界", "sel": false, "sc": 22.0, "rs": null}, {"t": "静脉输液核心院感操作要点：从核对医嘱到穿刺前二次核对", "s": "静脉输液是临床最常见操作，但越熟悉越易放松警惕。核对医嘱、手卫生、药瓶消毒、抽吸药液、皮肤消毒、穿刺前二次核对等环节环环相扣，构成院感防控的关键流程。", "u": "https://mp.weixin.qq.com/s?__biz=MzAxNDYzMDM4MA==&mid=2650200206&idx=1&sn=84e777e76e321775f172072d85ef674d&chksm=82514d4c9e34e298c6fa061510980103b32371319a4610a0209965e8f4faebf0f4854405e057&scene=126&sessionid=1793108467#rd", "d": "2026-10-22", "tr": ["循证指南"], "th": ["耐药与院感"], "src": "SIFIC 感染视界", "sel": false, "sc": 12.0, "rs": null}, {"t": "直播预告丨感控文化怎么建设？从“要我感控”到“我要感控”的落地路径（第三季11期）", "s": "感控S计划第三季第11期直播于10月22日19点开播，讲者立足本院多年感控文化建设实践，围绕务实、严谨、融合、创新四个维度介绍感控文化建设举措。内容涵盖四维文化建设思路解读、院内落地实践做法展示及文化推进难点剖析，并结合真实案例复盘，推动感控理念从“要我感控”向“我要感控”转变。", "u": "https://mp.weixin.qq.com/s?__biz=MzAxNDYzMDM4MA==&mid=2650200193&idx=1&sn=898c006e2ece006f6a4dfdb079175ae2&chksm=82a2ad51a6b598e44aa9f4bb813edc124d154022df7cf21a1e4540907db44f1e0bcff9a88729&scene=126&sessionid=1793108467#rd", "d": "2026-10-22", "tr": [], "th": ["耐药与院感"], "src": "SIFIC 感染视界", "sel": false, "sc": 8.0, "rs": null}, {"t": "国家卫生健康委医院管理研究所11月12-13日线上召开2026年医院感染和消毒供应标准化、规范化培训班（消毒供应专题）", "s": "国家卫生健康委医院管理研究所定于11月12-13日以线上直播形式召开2026年医院感染和消毒供应标准化、规范化培训班（消毒供应专题），11月14-23日可回放观看。培训面向消毒供应专业人员，旨在加强国家政策和行业标准学习、提升专业能力。", "u": "https://mp.weixin.qq.com/s?__biz=MzAxNDYzMDM4MA==&mid=2650200188&idx=2&sn=495c09304feb6c0bf81be7bafd7fbe9e&chksm=823b51a9fd5f175bd332d430d355a6cc3e129d19ce22857ef73aa619418a9ff07ac255db3789&scene=126&sessionid=1793108467#rd", "d": "2026-10-21", "tr": ["循证指南"], "th": ["耐药与院感"], "src": "SIFIC 感染视界", "sel": false, "sc": 10.0, "rs": null}, {"t": "复旦大学附属中山医院主办“感控专业人员核心能力提升培训班”11月4日~6日在上海召开", "s": "由复旦大学附属中山医院主办的国家级继续医学教育项目《感控专业人员核心能力提升培训班》定于2026年11月4日~6日在上海举行，面向全国各级各类医疗机构的医院感染管理专兼职人员、临床医务人员、微生物检验人员及相关职能部门管理者招生。培训班日程表已公布，最终日程以现场公布为准。", "u": "https://mp.weixin.qq.com/s?__biz=MzAxNDYzMDM4MA==&mid=2650200188&idx=1&sn=327167fa290b02c69692313509520301&chksm=82aacd82e54720d8a25dff658384168841140e7d0cb63d78957b1c31da39af1a3b558574d9c6&scene=126&sessionid=1793108467#rd", "d": "2026-10-21", "tr": [], "th": ["耐药与院感"], "src": "SIFIC 感染视界", "sel": false, "sc": 10.0, "rs": null}, {"t": "皮内、皮下、肌内注射感控要点：消毒范围与皮试禁用碘伏", "s": "皮内、皮下、肌内注射消毒均需从中心点向外螺旋擦拭，范围至少5厘米。皮下和肌内注射可用碘伏消毒，拔针后轻压针眼；皮内注射（皮试）只能用75%酒精，拔针不可按压，否则影响皮试结果判断。规范操作以减少院感风险。", "u": "https://mp.weixin.qq.com/s?__biz=MzAxNDYzMDM4MA==&mid=2650200169&idx=1&sn=6a6846aaef0d6c54e12990d6457aaff3&chksm=820b3bad58dca95f6d1e944c60d9b758c2ddf388db73bc756f17b578b6aaea1ac5447943b9a4&scene=126&sessionid=1793202279#rd", "d": "2026-10-21", "tr": ["循证指南"], "th": ["耐药与院感"], "src": "SIFIC 感染视界", "sel": false, "sc": 8.0, "rs": null}, {"t": "广东省药品交易中心开展“四同”药品挂网价格确认，逾期未确认将撤销挂网", "s": "广东省药品交易中心发布通知，对省内挂网价格高于全国最低挂网价格的“四同”（同通用名、同厂牌、同剂型、同规格）药品开展价格确认，确认时间为即日起至2026年10月23日17:30，企业需通过广东省招采子系统操作。确认价格的药品省内三平台统一调整；拒绝确认且申诉未获采纳、以及逾期未操作的药品将被撤销挂网，后续需按挂网申报流程重新申请。企业在外省新的更低挂网价格执行30日内，须通过子系统提交调价申请。", "u": "https://www.gdmede.com.cn/announcement/announcement/detail?id=2112810505734197248", "d": "2026-10-21", "tr": ["市场准入"], "th": [], "src": "广东省药品交易中心·通知公告", "sel": true, "sc": 60.0, "rs": "广东对挂网价高于全国最低价的同通用名同厂牌药品启动价格确认，未确认或申诉未采纳将被撤网，涉及企业在粤三平台的价格与准入。"}, {"t": "上海发布第12批国家集采中选药品执行准备工作提示", "s": "上海市医药集中招标采购事务管理所发布第12批国家组织药品集中带量采购执行准备工作提示，中选药品挂网时间为2026年10月21日至11月4日，中选企业须通过招采子系统在“第十二批全国药品集中采购（GY-YD2026-1）”通道申报。", "u": "https://www.smpaa.cn/xxgk/gggs/2026/10/19/25379.shtml", "d": "2026-10-19", "tr": ["市场准入"], "th": [], "src": "上海阳光医药采购网（国家集采）", "sel": true, "sc": 62.0, "rs": "上海就第12批国家集采中选药品发布执行准备安排，涉及挂网时间窗、配送企业选定与质量检测要求。"}, {"t": "天津医药采购中心开展第12批国家集采中选药品信息维护工作", "s": "天津医药采购中心发布通知，开展第12批国家组织药品集中带量采购中选药品信息维护工作。通知未披露涉及品种、维护口径与截止时间等具体内容。", "u": "https://www.tjmpc.cn/website/home/infoPage?NEWSID=b0723a1a6d37482cbd2d6f64fa41fca0", "d": "2026-10-15", "tr": ["市场准入"], "th": [], "src": "天津医药采购中心·通知公告（京津冀联盟）", "sel": true, "sc": 67.0, "rs": null}, {"t": "江苏省公共资源交易中心关于公布部分挂网药品申报企业信息变更的通知（苏易药发〔2026〕430号）", "s": "", "u": "http://ybj.jiangsu.gov.cn/art/2026/10/15/art_85746_11847190.html", "d": "2026-10-15", "tr": ["市场准入"], "th": [], "src": "江苏医保局·阳光采购服务网", "sel": false, "sc": 15.0, "rs": null}, {"t": "省公共资源交易中心关于公布部分药品挂网产品信息变更的通知（苏易药发〔2026〕425号）", "s": "", "u": "http://ybj.jiangsu.gov.cn/art/2026/10/12/art_85746_11847175.html", "d": "2026-10-12", "tr": ["市场准入"], "th": [], "src": "江苏医保局·阳光采购服务网", "sel": false, "sc": 26.0, "rs": null}, {"t": "广东联盟药品集采公布第九批新增中选产品，当年协议采购量默认为0", "s": "广东省药品交易中心公布广东联盟药品集中带量采购新增中选产品信息（九），依据《广东联盟双氯芬酸等药品接续采购文件（GDYJYPDL202501）》和《广东联盟常见病慢性病药品接续采购文件（GDYJYPDL202502）》，经企业申请、审核、公示等程序产生。通知明确，新增中选产品当年度协议采购量默认为0，具体产品见附件公布表。", "u": "https://www.gdmede.com.cn/announcement/announcement/detail?id=2109576848571633664", "d": "2026-10-12", "tr": ["市场准入"], "th": [], "src": "广东省药品交易中心·通知公告", "sel": true, "sc": 50.0, "rs": "广东联盟双氯芬酸等药品与常见病慢性病药品接续采购公布第九批新增中选产品，新增产品当年协议采购量默认为0。"}, {"t": "广东公布阿莫西林和阿比特龙等药品集采增补中选产品（七）", "s": "广东省药品交易中心公布阿莫西林和阿比特龙等药品集采增补中选产品信息（第七批），经企业申请、审核、公示等程序产生。通知明确增补中选产品当年度约定采购量默认为0，依据为粤医保函〔2026〕83号及增补中选工作相关要求。", "u": "https://www.gdmede.com.cn/announcement/announcement/detail?id=2109576288552357888", "d": "2026-10-12", "tr": ["市场准入"], "th": ["抗菌药物"], "src": "广东省药品交易中心·通知公告", "sel": true, "sc": 58.0, "rs": "广东公布阿莫西林等集采增补中选产品，并明确增补产品当年度约定采购量为0，涉及集采执行与报量规则。"}, {"t": "哈药股份｜哈药集团股份有限公司关于公司董事兼高级管理人员被实施留置的公告", "s": "", "u": "https://static.cninfo.com.cn/finalpage/2026-10-12/1225600467.PDF", "d": "2026-10-12", "tr": ["企业竞争"], "th": [], "src": "哈药股份·公司公告", "sel": false, "sc": 41.0, "rs": null}, {"t": "北京医保局发文优化药品集采期内续约及期满接续工作", "s": "北京市医疗保障局发布通知，优化本市药品集采项目期内续约流程，设置续约窗口期，由医药采购平台自动将上一协议期约定采购量推送为下一协议期约定采购量，经医疗机构确认后生效。约定采购量因政策限制、诊疗资源调整、用药人群改变等发生较大变化时，医疗机构可在窗口期内申请调整。本年度内本市自行组织的集采项目期满接续将与新增带量采购项目统筹开展，过渡期间协议期顺延，采购供应政策与期内保持一致。", "u": "https://ybj.beijing.gov.cn/zczxs/2020_ycgga/202610/t20261010_4896649.html", "d": "2026-10-10", "tr": ["市场准入"], "th": [], "src": "北京医保局·药品通知公告", "sel": true, "sc": 60.0, "rs": "北京医保局明确集采续约窗口期与期满接续统筹安排，涉及医疗机构报量与协议签订流程。"}, {"t": "牛津大学团队用XFEL拍下青霉素合成\"分子电影\"，揭示IPNS催化β-内酰胺环形成新中间体", "s": "牛津大学联合Diamond Light Source等机构，用X射线自由电子激光（XFEL）实时观测异青霉素N合成酶（IPNS）催化线性肽底物生成β-内酰胺环的过程，捕捉到β-内酰胺环形成前的硫醛中间体和首个单环β-内酰胺中间体。研究发表于Nature Catalysis，揭示活性位点水分子在反应中的关键作用，为应对耐药菌上升、优化现有抗生素和设计新抗生素结构提供依据。", "u": "https://www.genengnews.com/topics/bioprocessing/molecular-movie-of-penicillin-synthesis-could-inform-future-antibiotic-development/", "d": "2026-10-10", "tr": ["循证指南"], "th": ["抗菌药物", "耐药与院感"], "src": "GEN Genetic Engineering & Biotechnology News", "sel": false, "sc": 12.0, "rs": null}, {"t": "东北制药｜关于聘任副总经理的公告", "s": "", "u": "https://static.cninfo.com.cn/finalpage/2026-10-10/1225599603.PDF", "d": "2026-10-10", "tr": ["企业竞争"], "th": [], "src": "东北制药·公司公告", "sel": false, "sc": 10.0, "rs": null}, {"t": "IDSA/ESCMID 发布金黄色葡萄球菌菌血症共识声明，以风险分层取代复杂与不复杂分类", "s": "IDSA 与 ESCMID 于 9 月发布金黄色葡萄球菌菌血症（SAB）指南项目首批共识声明，围绕风险分层、诊断评估与疗程回答 7 个临床问题，建议以风险分层框架取代传统的复杂与不复杂分类。", "u": "https://www.contagionlive.com/view/new-idsa-escmid-s-aureus-bacteremia-consensus-statements-a-risk-stratification-framework", "d": "2026-10-02", "tr": ["循证指南"], "th": ["抗菌药物", "耐药与院感"], "src": "Contagion Live·抗菌药物管理", "sel": true, "sc": 58.0, "rs": "指南组成员解释风险分层如何取代复杂与不复杂二分，并说明低风险患者两周疗程的适用条件。"}, {"t": "江苏省公共资源交易中心公布第三十五批药品阳光采购挂网产品", "s": "江苏省公共资源交易中心公布第三十五批药品阳光采购挂网产品，依据苏医保发〔2021〕64号及苏医保发〔2025〕41号文件要求，经公示程序后予以公布，具体品种见附件公布表。", "u": "http://ybj.jiangsu.gov.cn/art/2026/9/30/art_85744_11840107.html", "d": "2026-09-30", "tr": ["市场准入"], "th": [], "src": "江苏医保局·阳光采购服务网", "sel": false, "sc": 22.0, "rs": null}, {"t": "江苏牵头部分化学药品省际联盟集采启动产品信息维护，9月30日至10月15日申报", "s": "江苏牵头、全国各省及新疆生产建设兵团参与的“部分化学药品省际联盟（江苏）集中带量采购联盟”启动产品信息维护，企业须在2026年9月30日至10月15日17时通过江苏省药品和医用耗材招采管理系统填报企业资质、药品注册批件、产能、挂网价格及省级集采中选价格等信息。", "u": "http://ybj.jiangsu.gov.cn/art/2026/9/30/art_85505_11837069.html", "d": "2026-09-30", "tr": ["市场准入"], "th": [], "src": "江苏医保局·阳光采购服务网", "sel": true, "sc": 72.0, "rs": "江苏牵头的省际联盟化学药品集采启动产品信息维护，企业可据此判断参与报量与报价的时间窗口。"}, {"t": "鲁抗医药｜鲁抗医药关于获得药品注册证书的公告", "s": "", "u": "https://static.cninfo.com.cn/finalpage/2026-09-30/1225586925.PDF", "d": "2026-09-30", "tr": ["管线上新"], "th": ["抗菌药物"], "src": "鲁抗医药·公司公告", "sel": false, "sc": 44.0, "rs": null}, {"t": "鲁抗医药｜鲁抗医药关于部分高级管理人员调整的公告", "s": "", "u": "https://static.cninfo.com.cn/finalpage/2026-09-30/1225586913.PDF", "d": "2026-09-30", "tr": ["企业竞争"], "th": ["抗菌药物"], "src": "鲁抗医药·公司公告", "sel": false, "sc": 12.0, "rs": null}, {"t": "IDSA/ESCMID 发布金黄色葡萄球菌菌血症共识声明：聚焦随访血培养", "s": "IDSA 与 ESCMID 于 9 月 9 日发布金黄色葡萄球菌菌血症（SAB）最新共识声明第一部分，共含 7 条共识，覆盖风险分层、诊断评估及成人与儿童管理。其中共识声明 2 专门针对随访血培养问题给出建议。SAB 是血流感染的首要死因，常伴深部感染灶与转移灶，致残率较高。", "u": "https://www.contagionlive.com/view/idsa-escmid-statement-on-staphylococcus-aureus-follow-up-blood-cultures", "d": "2026-09-29", "tr": ["循证指南"], "th": ["抗菌药物", "耐药与院感"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 42.0, "rs": null}, {"t": "上海医药注射用硫酸艾沙康唑获批准生产", "s": "上海医药集团股份有限公司公告，注射用硫酸艾沙康唑获得批准生产。该品种为抗真菌药物，公告未披露获批适应症、规格及获批时间等具体信息。", "u": "https://static.cninfo.com.cn/finalpage/2026-09-29/1225584063.PDF", "d": "2026-09-29", "tr": ["管线上新"], "th": ["抗真菌"], "src": "上海医药·公司公告", "sel": true, "sc": 62.0, "rs": null}, {"t": "环境管理：抗菌药物在气候变化中的作用", "s": "广泛使用抗菌药物会破坏调节地球生物地球化学循环的微生物群落，加剧抗菌药物耐药性并助推气候变化。一项研究估算，一个疗程的抗生素通过影响土壤微生物环境，可释放9.84吨土壤储存的CO2，相当于一辆汽车绕地球行驶1.5倍；避免使用抗生素可移除目前大气中超过7%的CO2。微生物通过生物膜、持留菌、芽孢及可移动遗传元件等防御系统应对抗菌药物压力，耐药基因可在微生物组内外快速传播。", "u": "https://www.contagionlive.com/view/enivronmental-stewardship-the-role-of-antimicrobials-in-climate-change", "d": "2026-09-26", "tr": ["循证指南"], "th": ["抗菌药物", "耐药与院感"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 15.0, "rs": null}, {"t": "PETERPEN试验：哌拉西林-他唑巴坦治疗ESBL血流感染早期结局不劣于美罗培南，碳青霉烯类仍为标准治疗", "s": "PETERPEN试验新数据显示，在部分ESBL血流感染患者中，哌拉西林-他唑巴坦的早期临床结局不劣于美罗培南，但在最终死亡率结果获得并充分分析前，碳青霉烯类仍是标准治疗。此前MERINO RCT（NCT02176122）显示，哌拉西林-他唑巴坦组30天全因死亡率12.3%（23/187），美罗培南组3.7%（7/191），未达到非劣效性。", "u": "https://www.contagionlive.com/view/carbapenem-sparing-therapy-for-esbl-bacteremia-new-trials-old-questions", "d": "2026-09-25", "tr": ["循证指南"], "th": ["抗菌药物", "耐药与院感"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 38.0, "rs": null}, {"t": "江苏省公共资源交易中心公布药品阳光采购挂网产品（第三十四批）", "s": "江苏省公共资源交易中心公布第三十四批药品阳光采购挂网产品，依据苏医保发〔2021〕64号及苏医保发〔2025〕41号文件要求，经公示程序后予以公布。相关医疗机构与药品生产企业可查阅附件《药品阳光采购挂网产品公布表（第三十四批）》。", "u": "http://ybj.jiangsu.gov.cn/art/2026/9/24/art_85744_11837292.html", "d": "2026-09-24", "tr": ["市场准入"], "th": [], "src": "江苏医保局·阳光采购服务网", "sel": false, "sc": 22.0, "rs": null}, {"t": "骨科感染清创联合植入抗生素后，短期全身抗生素不劣于标准疗程", "s": "一项475例患者的多中心开放标签非劣效试验显示，骨科感染患者清创并植入抗生素后，接受短期（≤7天）全身抗生素治疗在12个月治疗失败率上不劣于标准疗程（≥4周），失败率分别为11.1%和14.1%，达到预设10%差异的非劣效标准。", "u": "https://www.contagionlive.com/view/implanted-antibiotic-reduced-systemic-regimen-for-orthopedic-infection", "d": "2026-09-23", "tr": ["循证指南"], "th": ["抗菌药物"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 26.0, "rs": null}, {"t": "江苏省公共资源交易中心公示部分挂网药品申报企业信息变更", "s": "江苏省公共资源交易中心对挂网药品申报企业信息变更申请予以公示，公示期为2026年9月20日至9月22日17:00。相关药品生产企业如有异议，须在公示期内通过招采子系统提交申诉及证明材料。", "u": "http://ybj.jiangsu.gov.cn/art/2026/9/20/art_85743_11837242.html", "d": "2026-09-20", "tr": ["市场准入"], "th": [], "src": "江苏医保局·阳光采购服务网", "sel": false, "sc": 18.0, "rs": null}, {"t": "本周传染病要闻 Top 5：宾州青少年麻疹死亡、CDC 狂犬病暴露咨询增 17%、头孢曲松安全性与头孢吡肟死亡风险再评估", "s": "宾夕法尼亚州一名 18 岁居民死于麻疹并发症急性播散性脑脊髓炎（ADEM），成为该州数周内第四例麻疹死亡。CDC 报告今年夏季狂犬病暴露相关咨询电话增加 17%，并发布健康警示。一项多医院回顾性综述评估了州卫生部门警示后头孢曲松的严重不良事件信号，一项系统综述与贝叶斯 meta 分析则提示头孢吡肟相对其他 β-内酰胺类抗生素可能小幅增加死亡风险。", "u": "https://www.contagionlive.com/view/this-week-s-top-5-infectious-disease-news-stories-september-12-september-18-2026", "d": "2026-09-19", "tr": ["循证指南"], "th": ["抗菌药物", "耐药与院感"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 22.0, "rs": null}, {"t": "江苏省公共资源交易中心公布药品阳光采购挂网产品（苏易药发〔2026〕394号）", "s": "江苏省公共资源交易中心公布药品阳光采购挂网产品，涉及2026年8月1日至8月31日期间按规定程序公示的拟挂网药品。此次公布依据江苏省医保局药品阳光采购实施意见及挂网政策相关通知执行，具体产品清单见附件。", "u": "http://ybj.jiangsu.gov.cn/art/2026/9/18/art_85744_11832141.html", "d": "2026-09-18", "tr": ["市场准入"], "th": [], "src": "江苏医保局·阳光采购服务网", "sel": false, "sc": 30.0, "rs": null}, {"t": "头孢曲松安全性：多医院回顾性研究显示严重不良事件率与其他静脉头孢菌素相当", "s": "一项多医院回顾性研究显示，头孢曲松严重不良事件发生率为0.047%，与其他4种静脉头孢菌素的0.041%相近且差异无统计学意义，不支持因近期卫生部门安全警报而避免使用头孢曲松。研究在2022年10月至2025年6月间共识别211例事件，其中头孢曲松组90例；临床医生仅将3例心脏骤停直接归因于头孢曲松，且均发生于合并多种基础疾病的患者。", "u": "https://www.contagionlive.com/view/ceftriaxone-safety-separating-signal-from-risk", "d": "2026-09-17", "tr": ["循证指南"], "th": ["抗菌药物"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 40.0, "rs": null}, {"t": "江苏省公共资源交易中心公布药品阳光采购挂网产品（第三十三批）", "s": "江苏省公共资源交易中心公布第三十三批药品阳光采购挂网产品，依据苏医保发〔2021〕64号及苏医保发〔2025〕41号文件要求，经规定程序公示后予以公布。具体挂网产品清单见附件《药品阳光采购挂网产品公布表（第三十三批）》。", "u": "http://ybj.jiangsu.gov.cn/art/2026/9/16/art_85744_11832136.html", "d": "2026-09-16", "tr": ["市场准入"], "th": [], "src": "江苏医保局·阳光采购服务网", "sel": false, "sc": 22.0, "rs": null}, {"t": "东北制药｜关于变更董事会秘书的公告", "s": "", "u": "https://static.cninfo.com.cn/finalpage/2026-09-16/1225566479.PDF", "d": "2026-09-16", "tr": ["企业竞争"], "th": [], "src": "东北制药·公司公告", "sel": false, "sc": 8.0, "rs": null}, {"t": "播客：gyrA 基因分型指导淋病治疗，让环丙沙星重回临床", "s": "环丙沙星因耐药率在2000年代初达到5%而被弃用，如今gyrA基因第91位密码子单点突变检测以98%敏感性和98%特异性预测耐药，可指导该药重新用于淋病。美国约60%淋病奈瑟菌株仍对环丙沙星敏感，3项临床研究中各解剖部位（含咽部）治愈率达100%或超过98%。3款gyrA检测产品的510(k)大型试验即将结束，FDA clearance预计2027年初落地，报销是另一障碍。", "u": "https://www.contagionlive.com/view/pathogen-diagnosis-gyra-genotyping-revive-ciprofloxacin", "d": "2026-09-15", "tr": ["专家会议"], "th": ["抗菌药物", "耐药与院感"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 22.0, "rs": null}, {"t": "库克县225例回顾性研究：1个月1HP方案（异烟肼+利福喷丁）治疗潜伏性结核完成率与标准方案相当", "s": "库克县卫生局3家诊所225例潜伏性结核感染患者的回顾性研究显示，1个月1HP方案（异烟肼300 mg每日+利福喷丁300-600 mg）完成治疗率64%，与其他标准方案72%相当（P=0.460）。1HP组不良事件发生率41%，其他方案25%（P=0.107），仅1例因不良事件停药。研究者认为该短程方案耐受性良好，或可成为可行的更短替代方案。", "u": "https://www.contagionlive.com/view/treatment-of-latent-tuberculosis-in-a-trice", "d": "2026-09-12", "tr": ["循证指南"], "th": ["感染/疫苗", "抗菌药物"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 22.0, "rs": null}, {"t": "健康元｜健康元药业集团股份有限公司关于公司变更董事长暨调整董事会专门委员会成员的公告", "s": "", "u": "https://static.cninfo.com.cn/finalpage/2026-09-12/1225561198.PDF", "d": "2026-09-12", "tr": ["企业竞争"], "th": [], "src": "健康元·公司公告", "sel": false, "sc": 15.0, "rs": null}, {"t": "上海医药｜上海医药集团股份有限公司关于盐酸林可霉素注射液通过仿制药一致性评价的公告", "s": "", "u": "https://static.cninfo.com.cn/finalpage/2026-09-11/1225558489.PDF", "d": "2026-09-11", "tr": ["管线上新"], "th": ["抗菌药物"], "src": "上海医药·公司公告", "sel": false, "sc": 38.0, "rs": null}, {"t": "罗欣药业｜关于聘任董事会秘书的公告", "s": "", "u": "https://static.cninfo.com.cn/finalpage/2026-09-08/1225551399.PDF", "d": "2026-09-08", "tr": ["企业竞争"], "th": [], "src": "罗欣药业·公司公告", "sel": false, "sc": 8.0, "rs": null}, {"t": "铋剂+阿莫西林-伏诺拉生三联 vs 双联 vs 克拉霉素三联：幽门螺杆菌一线治疗三臂随机试验", "s": "一项三臂多中心随机试验显示，在阿莫西林-伏诺拉生（AV）双联基础上加用铋剂（BAV）治疗幽门螺杆菌，ITT根除率达93.8%，显著优于AV单用（83.9%）和克拉霉素三联（CAR，83.1%）。", "u": "https://www.contagionlive.com/view/2-triples-and-a-dual-regimen-vie-for-first-line-against-h-pylori", "d": "2026-09-06", "tr": ["循证指南"], "th": ["感染/疫苗", "抗菌药物"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 38.0, "rs": null}, {"t": "主编评论：OMB拟议规则限制国际科研合作，无国界的感染病学科正被逐块围栏", "s": "感染病学主编Jason Gallagher撰文指出，OMB拟议的联邦拨款规则将研究资助限于国内研究者，国际合作需政治任命官员签字批准，直接威胁感染病监测网络。他举例称，辉瑞资助的ATLAS数据库已依据司法部《敏感数据批量规则》下架美国分离株，而JMI Laboratories的SENTRY项目仍可查看。该规则还将禁止用联邦拨款支付开放获取出版费用，除非获得机构批准。", "u": "https://www.contagionlive.com/view/drawing-borders-around-a-borderless-specialty", "d": "2026-09-04", "tr": ["循证指南"], "th": ["抗菌药物", "耐药与院感"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 20.0, "rs": null}, {"t": "超越获批：新型革兰阴性菌抗生素在治疗中的定位", "s": "FDA 批准本身并不决定新型革兰阴性菌抗生素在治疗中的位置，临床医生需自行判断其解决何种未满足需求、证据强度及未知之处。舒巴坦-度洛巴坦填补 CRAB 感染治疗需求，氨曲南-阿维巴坦为产 NDM 的 CRE 提供重要选择；头孢吡肟-恩美唑巴坦证据主要限于尿路感染，头孢吡肟-齐德巴坦证据仍限于体外数据和病例报告。文章强调新颖不等于必要，抗菌药物管理应基于耐药机制匹配治疗而非最新选项。", "u": "https://www.contagionlive.com/view/beyond-approval-finding-the-right-place-for-emerging-gram-negative-antibiotics", "d": "2026-09-02", "tr": ["循证指南"], "th": ["抗菌药物", "耐药与院感"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 32.0, "rs": null}, {"t": "创伤弧菌综述：临床表现与抗生素治疗", "s": "创伤弧菌等弧菌属细菌自然存在于沿海咸水与半咸水中，经口摄入或开放性伤口接触可引发胃肠、血流或伤口感染，美国每年约8万例弧菌病。约40%的弧菌病由副溶血弧菌引起，溶藻弧菌占20%。肝病等高危人群感染后可能危及生命，综述梳理了创伤弧菌的临床表现与推荐抗生素治疗方案。", "u": "https://www.contagionlive.com/view/a-review-of-vibrio-vulnificus-clinical-presentation-and-treatment", "d": "2026-09-01", "tr": ["循证指南"], "th": ["感染/疫苗", "抗菌药物"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 12.0, "rs": null}, {"t": "POET II 试验：感染性心内膜炎按疗效调整的短程抗生素治疗与更长生存相关但复发率更高", "s": "国际随机对照 POET II 试验显示，初始抗生素治疗 2–4 周后临床稳定的左心感染性心内膜炎患者，按疗效调整的短程继续抗生素方案较标准最长 6 周方案生存更久，6 个月内无抗生素治疗或无菌血症天数为 183 天 vs 169 天。短程组主要安全性复合终点（全因死亡、非计划心脏手术或症状性栓塞事件）非劣于标准组（21 例 vs 27 例），但复发更常见（5.1% vs 1.6%）。", "u": "https://www.contagionlive.com/view/patients-with-infective-endocarditis-survived-longer-with-shorter-period-of-antibiotic-treatment", "d": "2026-08-31", "tr": ["循证指南"], "th": ["抗菌药物", "感染/疫苗"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 38.0, "rs": null}, {"t": "第二届临床微生物学学术大会暨中国医药教育协会临床微生物学专业委员会2026年学术年会在杭州召开", "s": "第二届临床微生物学学术大会暨中国医药教育协会临床微生物学专业委员会2026年学术年会于8月21日—23日在杭州召开，来自全国25个省、自治区的300余名代表参会。会议设主论坛及多个分论坛，围绕细菌耐药防控、CRE精准诊疗、真菌感染、AI赋能耐药诊疗等主题交流，并发布ChiAST药敏试验专家系统、举行塞力医疗-华为AI战略合作签约。第三届年会将于2027年8月20日-22日在宁夏银川举办。", "u": "https://mp.weixin.qq.com/s?__biz=MzA5MTExNzgwMA==&mid=2651006086&idx=1&sn=bbaf154e071af81f976a7d3cf5ebb8c4&chksm=8a94ff31dba8e81aa35fc06c306af2fdea10b646cf5e595106fe699c0358f5b6ea65146126ec&scene=126&sessionid=1793624721#rd", "d": "2026-08-30", "tr": ["专家会议"], "th": ["耐药与院感"], "src": "CHINET 中国细菌耐药监测网", "sel": false, "sc": 18.0, "rs": null}, {"t": "阿奇霉素未减少学龄前儿童急诊喘息：PECARN AZ-SWED 试验结果", "s": "在美国8家儿科急诊开展的多中心随机试验中，阿奇霉素较安慰剂未改善18-59月龄学龄前儿童的喘息症状严重程度、急诊或住院时长及72小时内回访，无论上呼吸道是否检出致病菌。该试验在计划中期分析时因无效提前终止，共随机840例PRAM评分≥4的患儿。尽管阿奇霉素清除细菌的效果远优于安慰剂（58.7% vs 11.4%），研究者仍建议不将其用于急诊已出现呼吸窘迫的儿童。", "u": "https://www.contagionlive.com/view/azithromycin-in-er-did-not-reduce-wheezing-in-preschoolers", "d": "2026-08-30", "tr": ["循证指南"], "th": ["抗菌药物"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 22.0, "rs": null}, {"t": "北京医保局启动第12批国家集采约定采购量分配，  "sc": 31.0, "rs": null}, {"t": "第二届临床微生物学学术大会暨中国医药教育协会临床微生物学专业委员会2026年学术年会将于杭州召开", "s": "中国医药教育协会临床微生物学专业委员会定于2026年8月21日-23日在杭州召开第二届临床微生物学学术大会暨专委会2026年学术年会，由该协会与北京中卫医药卫生科技发展中心、北京整合医学学会联合主办。会议面向专委会全体委员及临床抗感染治疗、临床微生物、临床药师、院感控制与细菌真菌耐药监测研究人员，参会代表注册费700元/人、研究生300元/人。", "u": "https://mp.weixin.qq.com/s?__biz=MzA5MTExNzgwMA==&mid=2651005943&idx=1&sn=209d5602e24596bc67615e415ab32a59&chksm=8aaaa3ae62feb6bc1de82b19cb2cf64122706d8ed044a4bec1de73215f7f0f06fbcb33255fdd&scene=126&sessionid=1793624721#rd", "d": "2026-08-17", "tr": [], "th": ["耐药与院感"], "src": "CHINET 中国细菌耐药监测网", "sel": false, "sc": 8.0, "rs": null}, {"t": "达托霉素耐药屎肠球菌菌血症：肝移植患者复发后的处理策略", "s": "肝移植患者在接受高剂量达托霉素、腹腔冲洗和胆道支架置入后仍出现达托霉素耐药屎肠球菌（DREfm）菌血症复发，药敏显示对利奈唑胺、替加环素和依拉环素敏感。DREfm在血液恶性肿瘤或肝移植受者中的VREfm感染占比可达35%，既往达托霉素暴露与耐药风险升高达30倍相关。处理需确认临床意义并积极控制感染源，利奈唑胺是FDA唯一批准用于VREfm感染的药物。", "u": "https://www.contagionlive.com/view/when-daptomycin-fails-practical-approaches-to-resistant-enterococcus-faecium", "d": "2026-08-16", "tr": ["循证指南"], "th": ["抗菌药物", "耐药与院感"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 22.0, "rs": null}, {"t": "本周传染病要闻：碳青霉烯类综述、jalapeño 沙门菌召回扩大、Maviret 欧盟获批急性丙肝及儿童疫苗行政令争议", "s": "欧洲委员会已批准 glecaprevir/pibrentasvir（Maviret）用于急性丙型肝炎，使其成为欧盟唯一同时获批急性和慢性HCV的疗法；III期M20-350试验中8周方案在ITT人群的SVR12达96.2%，无病毒学失败或停药后复发。", "u": "https://www.contagionlive.com/view/this-week-s-top-5-infectious-disease-news-stories-august-8-august-14-2026", "d": "2026-08-15", "tr": ["市场准入"], "th": ["感染/疫苗", "抗菌药物", "耐药与院感"], "src": "Contagion Live·抗菌药物管理", "sel": false, "sc": 20.0, "rs": null}, {"t": "天津启动胰岛素集采协议期满接续与干扰素省际联盟集采到期续签执行工作", "s": "天津医药采购中心发布通知，就胰岛素集采协议期满接续、干扰素省际联盟集中带量采购两个项目的协议到期续签执行工作作出安排。", "u": "https://www.tjmpc.cn/website/home/infoPage?NEWSID=efb83c5f741c46ab90614039c0cf3d0c", "d": "2026-08-12", "tr": ["市场准入"], "th": [], "src": "天津医药采购中心·通知公告（京津冀联盟）", "sel": true, "sc": 62.0, "rs": null}, {"t": "静脉碳青霉烯类与口服替比培南匹伏酯综述", "s": "本文综述了美国上市的静脉碳青霉烯类单药（厄他培南、美罗培南、亚胺培南-西司他丁）及2026年6月获FDA批准的首个口服碳青霉烯替比培南匹伏酯。碳青霉烯类为广谱β-内酰胺类抗生素，通过结合青霉素结合蛋白抑制细菌细胞壁 会及投稿通道已开放。", "u": "https://mp.weixin.qq.com/s?__biz=MzA5MTExNzgwMA==&mid=2651005763&idx=1&sn=ba3de99d7412261c92d5f516fa661951&chksm=8a54c1e0d71647fd71bba07cf0a6f5d7a3eaa4fd67f05b31a626acea96926e37fcf126520567&scene=126&sessionid=1793627963#rd", "d": "2026-05-13", "tr": [], "th": ["耐药与院感"], "src": "CHINET 中国细菌耐药监测网", "sel": false, "sc": 8.0, "rs": null}, {"t": "北京取消哈尔滨力强药业洛索洛芬钠凝胶贴膏集采中选资格并撤网", "s": "北京市医药集中采购服务中心通知，哈尔滨力强药业生产的洛索洛芬钠凝胶贴膏因生产线严重缺陷、GMP符合性检查不合格，被取消第十一批国家集采中选资格，该产品已在平台撤网。按集采规则，其约定采购量由涉及医疗机构在该品种其他中选企业中自行选择供应企业。", "u": "https://ybj.beijing.gov.cn/zczxs/2020_ycgga/202605/t20260509_4642684.html", "d": "2026-05-09", "tr": ["市场准入"], "th": [], "src": "北京医保局·药品通知公告", "sel": true, "sc": 58.0, "rs": "北京医保局据此撤网并明确约定采购量的重新分配方式，涉及集采中选药品的供应衔接。"}, {"t": "悦康药业｜关于投资建设项目的公告", "s": "", "u": "https://static.cninfo.com.cn/finalpage/2026-05-08/1225282480.PDF", "d": "2026-05-08", "tr": ["企业竞争"], "th": [], "src": "悦康药业·公司公告", "sel": false, "sc": 12.0, "rs": null}, {"t": "北京医保局启动河南牵头34种药品省际联盟集采报量，本市参与9个品种", "s": "北京市医保局通知各医疗机构填报河南牵头34种药品省际联盟集采需求量，本市仅需对其中9个品种报量，填报时间为2026年4月9日至16日，通过34种药品省际联盟采购报量平台线上直报并上传承诺函。2025年历史采购量已导入系统供参考，医疗机构报量低于历史采购量80%时须作出说明，有历史采购量而不参与报量的机构将在落地执行监测中重点关注。", "u": "https://ybj.beijing.gov.cn/zczxs/2020_ycgga/202604/t20260409_4577905.html", "d": "2026-04-09", "tr": ["市场准入"], "th": [], "src": "北京医保局·药品通知公告", "sel": true, "sc": 62.0, "rs": "北京医保局明确河南牵头34种药品联盟集采的报量口径，涉及本市参与的9个品种与低于历史量80%需说明的规则。"}, {"t": "北京医保局部署国家集采第一至八批协议期满品种接续采购中选结果执行", "s": "北京市医保局发文部署国家组织药品集采第一至八批（不含胰岛素专项）协议期满品种接续采购中选结果执行，采购周期至2028年12月31日。3月27日0时招采子系统统一调整中选药品采购价格，3月31日0时起全面执行中选结果及医保支付标准，4月27日0时调整非中选药品信息与价格并暂停相关未过评产品。", "u": "https://ybj.beijing.gov.cn/zczxs/2020_ycgga/202603/t20260326_4566984.html", "d": "2026-03-26", "tr": ["市场准入"], "th": [], "src": "北京医保局·药品通知公告", "sel": true, "sc": 78.0, "rs": "北京明确第一至八批集采接续采购的执行时间表与考核口径，涉及抗菌药物使用限制等未完成约定采购量的处理方式。"}, {"t": "江苏医保局明确药品挂网与医保结算联动，未挂网药品费用原则上不予结算", "s": "江苏省医保局发布通知，明确药品挂网与医保结算联动：取消挂网包装数量要求，已在省医保药品目录数据库且属阳光挂网范围的药品须于2026年6月20日前完成挂网，自2026年7月1日起定点医疗机构采购的未 const TRACKS = ["市场准入", "企业竞争", "管线上新", "循证指南", "专家会议", "疫情监测"];
let cur = "全部";
let kw = "";

const el = (id) => document.getElementById(id);

function countOf(t){
  return t === "全部" ? DATA.length : DATA.filter(x => (x.tr || []).includes(t)).length;
}

function renderTabs(){
  const tabs = ["全部", ...TRACKS];
  el("tabs").innerHTML = tabs.map(t => {
    const n = countOf(t);
    return `<button class="tab" role="tab" aria-selected="${t === cur}" data-t="${t}" ${n === 0 ? "disabled style=opacity:.4" : ""}>${t}<span class="n">${n}</span></button>`;
  }).join("");
}

function render(){
  el("total").textContent = DATA.length;
  const q = kw.trim().toLowerCase();
  const rows = DATA.filter(x => {
    if (cur !== "全部" && !(x.tr || []).includes(cur)) return false;
    if (!q) return true;
    const hay = [x.t, x.s, x.src, ...(x.th || [])].filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  });
  if (!rows.length){
    el("list").innerHTML = `<li class="empty">没有匹配的内容</li>`;
    return;
  }
  el("list").innerHTML = rows.map((x, i) => {
    const tr = (x.tr || [])[0] || "";
    const meta = [
      tr ? `<span class="track">${tr}</span>` : "",
      x.src ? `<span>${x.src}</span>` : "",
      x.d ? `<span>${x.d}</span>` : "",
    ].filter(Boolean).join('<span class="dot">·</span>');
    const tags = (x.th || []).map(t => `<span class="tag">${t}</span>`).join("");
    const sum = x.s ? `<p class="sum">${x.s}</p>` : "";
    return `<li><article>
      <div class="meta">${meta}</div>
      <h3><a href="${x.u}" target="_blank" rel="noopener noreferrer">${x.t}</a></h3>
      ${sum}${tags ? `<div class="tags">${tags}</div>` : ""}
    </article></li>`;
  }).join("");
}

/** 精选：库里判过 selected 的那些，带 AI 评分和推荐理由——这是每天该先看的一段。 */
function renderPicks(){
  const picks = DATA.filter(x => x.sel);
  el("picks-n").textContent = picks.length;
  if (!picks.length){ el("picks").innerHTML = ""; return; }
  el("picks").innerHTML = "<ol>" + picks.slice(0, 15).map((x, i) => {
    const tr = (x.tr || [])[0] || "";
    const meta = [
      tr ? `<span class="track">${tr}</span>` : "",
      x.src ? `<span>${x.src}</span>` : "",
      x.d ? `<span>${x.d}</span>` : "",
    ].filter(Boolean).join('<span class="dot">·</span>');
    const sc = x.sc ? `<span class="score">AI ${Math.round(Number(x.sc))}</span>` : "";
    const sum = x.s ? `<p class="sum">${x.s}</p>` : "";
    const rs = x.rs ? `<p class="reason"><b>推荐理由</b>　${x.rs}</p>` : "";
    return `<li><article class="pick">
      <div class="meta"><span class="rank">${String(i + 1).padStart(2, "0")}</span>${meta}${sc}</div>
      <h3><a href="${x.u}" target="_blank" rel="noopener noreferrer">${x.t}</a></h3>
      ${sum}${rs}
    </article></li>`;
  }).join("") + "</ol>";
}

el("tabs").addEventListener("click", (e) => {
  const b = e.target.closest(".tab");
  if (!b || b.disabled) return;
  cur = b.dataset.t;
  renderTabs(); render();
});
el("q").addEventListener("input", (e) => { kw = e.target.value; render(); });

renderTabs(); renderPicks(); render();
</script>
