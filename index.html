<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fa">
<title>MedHOT — 医药政策与市场动态</title>
<style>
:root{
  --bg:#f5f7fa; --surface:#fff; --ink:#161d27; --ink-2:#3d4756; --ink-3:#6b7687; --ink-4:#98a1b0;
  --line:#e4e8ee; --line-soft:#eef1f5; --accent:#23527c; --accent-soft:#eaf0f6;
  --nav-w:208px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{
  font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
a{color:inherit;text-decoration:none}

/* ---------- 左侧导航（桌面） ---------- */
.side{
  position:fixed;left:0;top:0;bottom:0;width:var(--nav-w);
  background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:18px 12px;z-index:30;
}
.side .logo{font-size:15px;font-weight:700;letter-spacing:-.01em;padding:4px 10px 16px;color:var(--ink)}
.side .grp{font-size:10.5px;letter-spacing:.1em;color:var(--ink-4);padding:12px 10px 6px;font-weight:600}
.side a.navi{
  display:flex;align-items:center;gap:9px;height:38px;padding:0 10px;border-radius:9px;
  font-size:13.5px;color:var(--ink-2);
}
.side a.navi:hover{background:var(--bg)}
.side a.navi.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.side .dot-ico{width:7px;height:7px;border-radius:50%;background:var(--ink-4);flex:0 0 auto}
.side a.navi.on .dot-ico{background:var(--accent)}

/* ---------- 主区 ---------- */
.main{margin-left:var(--nav-w);padding:22px 28px 40px;max-width:920px}
.head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.head h1{font-size:19px;margin:0;letter-spacing:-.01em}
.search{position:relative;flex:1 1 220px;max-width:320px}
.search input{
  width:100%;height:36px;padding:0 12px 0 32px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);font-size:13.5px;color:var(--ink);
}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;stroke:var(--ink-4);fill:none;stroke-width:2}

/* 筛选条 */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--line-soft)}
.filters::-webkit-scrollbar{display:none}
.f{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);height:32px;padding:0 13px;border-radius:16px;font-size:12.5px;cursor:pointer;flex:0 0 auto}
.f.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.f .n{opacity:.5;font-size:11px;margin-left:4px}

/* 日期分组 */
.day{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.day .dt{font-size:14px;font-weight:600;color:var(--ink)}
.day .wd{font-size:12px;color:var(--ink-3)}
.day .ct{font-size:12px;color:var(--ink-4);margin-left:auto}

/* 条目 */
.item{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;
  padding:13px 15px 13px 84px;margin-bottom:9px;
}
.item .time{position:absolute;left:15px;top:15px;font-size:11.5px;color:var(--ink-4);font-variant-numeric:tabular-nums}
.item .meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-4);margin-bottom:5px}
.item .src{color:var(--ink-3)}
.item .cat{color:var(--accent);font-weight:600}
.item .pill{font-size:10.5px;padding:1px 6px;border-radius:7px;background:var(--bg);color:var(--ink-3);border:1px solid var(--line-soft)}
.item .score{margin-left:auto;font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:1px 7px}
.item h3{font-size:15px;line-height:1.5;margin:0 0 5px;font-weight:600;letter-spacing:-.005em}
.item h3 a:active{color:var(--accent)}
.item .sum{margin:0;font-size:13px;line-height:1.7;color:var(--ink-2)}
.item .reason{
  margin:9px 0 0;padding:8px 10px;border-radius:9px;background:var(--bg);
  font-size:12.5px;line-height:1.65;color:var(--ink-2);
}
.item .reason b{color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--ink-4);font-size:13.5px;padding:60px 0}

/* ---------- 手机 ---------- */
@media (max-width:760px){
  .side{display:none}
  .main{margin-left:0;padding:16px 14px 30px;max-width:none}
  .head h1{font-size:17px}
  .search{max-width:none;flex:1 1 100%}
  .item{padding:12px 13px 12px 13px}
  .item .time{position:static;display:none}
  .bottom{
    position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);
    border-top:1px solid var(--line);display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom a{flex:1;height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--ink-3)}
  .bottom a.on{color:var(--accent);font-weight:600}
  .bottom .ico{font-size:15px;line-height:1}
}
@media (min-width:761px){ .bottom{display:none} }

footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--ink-4);line-height:1.8}
</style>
</head>

缓解疼痛、抑制骨破坏并减少局部脓肿形成。上述效应依赖宿主STING/I型干扰素信号通路，涉及抑制伤害感受器激活、抑制破骨细胞分化而不影响成骨细胞活性、下调IL-1β减少中性粒细胞募集三重机制。减少脓肿生成还可提升万古霉素等常规抗生素在感染灶的抗菌效果。", "r": null, "u": "https://news.bioon.com/article/7b4896158904.html", "d": "2026-11-03", "hm": "08:00", "c": "research", "tg": ["论文/研究", "感染/疫苗", "抗菌药物", "耐药与院感", "抗感染", "循证指南", "对市场"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "Cancer Cell：高栋团队揭示胰腺癌对KRAS-G12D靶向治疗的内在耐药新机制", "s": "高栋团队在Cancer Cell发表研究，基于242例患者来源类器官（PDOs）与匹配肿瘤组织的多组学分析，发现胰腺癌对KRAS-G12D靶向治疗的内在耐药由持续MYC活性抑制干扰素信号驱动。激活IFN-β可恢复耐药模型敏感性，并与MRTX1133、HRS-4642、RMC-6236协同产生抗肿瘤效应。", "r": null, "u": "https://news.bioon.com/article/3dd59615064d.html", "d": "2026-11-03", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤", "小分子"], "src": "生物谷", "sc": 19.0, "sel": false, "fp": false, "ok": true}, {"t": "四川大学魏霞蔚团队发现SARS-CoV-2奥密克戎Spike 456位芳香性决定RBD疫苗功能性免疫原性", "s": "四川大学魏霞蔚等团队在 Signal Transduction and Targeted Therapy 发表研究，基于RBD-HR三聚体亚单位疫苗平台比较含F456的XBB.1.5与含L456的EG.5重组疫苗，发现两者总抗原特异性IgG水平相当，但L456疫苗诱导的中和抗体滴度明显更低。", "r": null, "u": "https://news.bioon.com/article/a8939616256d.html", "d": "2026-11-03", "hm": "08:00", "c": "research", "tg": ["论文/研究", "感染/疫苗", "抗体/双抗"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "复旦大学张朝/文波团队在Sci Adv发表癌症转座元件表达图谱并开发ATEC数据门户", "s": "复旦大学张朝和文波团队整合约10,000个样本和1000个癌细胞系多组学数据，构建了跨980个亚家族、95,512个个体转座元件（TEs）的表达图谱，并鉴定出264,252个TEs作为与炎症反应等致癌通路相关的推定顺式调控元件。研究还分析了肿瘤中TE表达改变与临床相关性及1000多种抗癌药物反应的关联，并开发了癌症转座子表达图谱（ATEC）数据门户供研究者探索TE表达模式与调控网络。", "r": null, "u": "https://news.bioon.com/article/a8da9616261f.html", "d": "2026-11-03", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤", "AI 制药"], "src": "生物谷", "sc": 10.0, "sel": false, "fp": false, "ok": true}, {"t": "福品颂、北京同仁堂、康恩贝、Sports Research、FANCL五款胶原蛋白肽横评：按每份添加量与份数折算性价比", "s": "五款胶原蛋白肽产品按“每份胶原蛋白肽添加量”统一口径横评，三款公开可核验单份添加量、两款未公开。福品颂PQQ胶原蛋白多肽植物饮品单份牛胶原蛋白肽5000mg、每盒10份，并公开检测报告编号K25F07471-01；北京同仁堂内廷上用胶原蛋白肽透明质酸钠维生素C粉是唯一可核验金额成本的一款，约129—159元每盒、约4.3—5.3元每袋，但未标注每袋添加量。", "r": null, "u": "https://news.bioon.com/article/1d339620e44a.html", "d": "2026-11-03", "hm": "08:00", "c": "opinion", "tg": ["观点/解读"], "src": "生物谷", "sc": 3.0, "sel": false, "fp": false, "ok": true}, {"t": "Cell：香港大学团队揭示神经伴侣蛋白重编程Orb2构象，改善老年果蝇记忆", "s": "香港大学Ruben Hervas团队在Cell发表研究，用冷冻电镜追踪果蝇整个成年期Orb2淀粉样结构，发现其随衰老从松散、具翻译活性的年轻构象转为稳定但翻译活性下降的失活构象，导致记忆衰退。调控记忆相关伴侣蛋白可使衰老Orb2恢复年轻状态并改善老年果蝇记忆，而在年轻果蝇中强制推向衰老样构象则提前出现记忆障碍。", "r": null, "u": "https://news.bioon.com/article/35e596155962.html", "d": "2026-11-03", "hm": "08:00", "c": "research", "tg": ["论文/研究", "神经/精神"], "src": "生物谷", "sc": 10.0, "sel": false, "fp": false, "ok": true}, {"t": "北京医保局发文执行第十二批国家集采中选结果，11月28日起全面落地", "s": "北京市医保局通知执行第十二批国家组织药品集采中选结果，2026年11月21日0时招采子系统统一调整中选药品采购价格，11月28日0时起全面执行中选结果及医保支付标准，采购周期至2029年12月31日。通知明确因抗菌药物使用限制等导致临床需求重大变化的，考核以使用比例代替使用数量；医疗机构反映中选药品供应问题并经核实公示后，采购其他中选企业药品可视作采购该中选药品并享受医保资金结余留用政策。", "r": "北京落地第十二批国家集采的执行细则，明确了价格调整、医保支付标准与考核口径的变化。", "u": "https://ybj.beijing.gov.cn/zczxs/2020_ycgga/202611/t20261103_4931207.html", "d": "2026-11-03", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "抗感染", "市场准入", "entity:nhsa"], "src": "北京医保局·药品通知公告", "sc": 85.0, "sel": true, "fp": true, "ok": true}, {"t": "圣母大学团队将胶质母细胞瘤类器官送上国际空间站，PNAS 发表微重力长期培养多组学数据", "s": "美国圣母大学团队将多组胶质母细胞瘤类器官送入国际空间站，在微重力密闭静态培养体系中培养 40 天后返回地球分析，成果发表于 PNAS。太空类器官在形态、转录组、分泌蛋白组和空间基因排布上更接近晚期高侵袭性胶质母细胞瘤，且该表型依赖单核细胞等先天髓系免疫细胞参与——肿瘤单独培养时侵袭相关转录特征反而下调，与单核细胞共培养则上调肿瘤进展及不良预后相关基因。", "r": null, "u": "https://news.bioon.com/article/85ab96161810.html", "d": "2026-11-03", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "《Science》研究揭示朗格汉斯细胞经COX-1/PGE2-EP4轴调控表皮干细胞维持皮肤屏障稳态", "s": "洛克菲勒大学Elaine Fuchs团队在《Science》发表研究，揭示朗格汉斯细胞通过高表达COX-1持续合成PGE2、作用于表皮干细胞EP4受体，抑制YAP活性以放慢增殖并启动分化，充当干细胞的“恒温器”。清除朗格汉斯细胞或敲除EP4会导致干细胞过度增殖、表皮异常增厚及屏障脆薄。朗格汉斯细胞COX-1水平随皮肤表面微生物数量与组成反馈调节，形成微生物-免疫-干细胞闭环。", "r": null, "u": "https://news.bioon.com/article/4005961560e4.html", "d": "2026-11-03", "hm": "08:00", "c": "research", "tg": ["论文/研究", "自免"], "src": "生物谷", "sc": 10.0, "sel": false, "fp": false, "ok": true}, {"t": "黄果会见世卫组织监管和预认证司代理司长希蒂·西洛，讨论疫苗WLA评估合作", "s": "国家药品监督管理局局长黄果11月2日在京会见世卫组织监管和预认证司代理司长希蒂·西洛及驻华代表马丁·泰勒，双方围绕世卫组织列名机构（WLA）评估、监管能力建设、人员交流等合作事项深入讨论。黄果表示中国国家药监局高度重视疫苗WLA评估工作，世卫组织愿共同推进评估，双方同意深化人员交流。会见后双方举行工作会议，就WLA评估及后续安排达成一致。", "r": null, "u": "https://www.cnpharm.com/c/2026-11-03/1109871.shtml", "d": "2026-11-03", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "NMPA", "感染/疫苗", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "Nat Cancer：阻断ANO6切断CAF向胰腺癌细胞输送胆固醇并削弱免疫抑制", "s": "福克斯蔡斯癌症中心研究发现，胰腺导管腺癌（PDAC）中癌相关成纤维细胞（CAF）经ANO6依赖的胞啃作用，把血液来源的胆固醇等膜脂转移给癌细胞，同时抑制细胞毒性T细胞。小鼠模型中，氯硝柳胺或氯法齐明抑制ANO6依赖活性后肿瘤重量显著降低，氯硝柳胺还减少胆固醇向癌细胞输送；阻断ANO6亦减少肿瘤浸润T细胞胆固醇蓄积、改善T细胞活性标志物。研究者将ANO6列为PDAC候选治疗靶点。", "r": null, "u": "https://news.bioon.com/article/016096161eac.html", "d": "2026-11-03", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤", "小分子"], "src": "生物谷", "sc": 16.0, "sel": false, "fp": false, "ok": true}, {"t": "全国省级药监微信公众号传播力分析（10月25日—10月31日）：湖北药监、江苏药品监管、广东药监居前", "s": "中国医药报社11月1日发布全国省级药监微信公众号传播力分析，\"湖北药监\"\"江苏药品监管\"\"广东药监\"等10个公众号传播力较强。高关注文章中，\"广东药监\"报道卡左双多巴缓释胶囊依托\"港澳药械通\"在广州某医院完成首次处方；国家药监局10月28日发布无菌医疗器械检查指导原则等4个检查指导原则，被多家省级公众号转载。", "r": null, "u": "https://www.cnpharm.com/c/2026-11-03/1109839.shtml", "d": "2026-11-03", "hm": "08:00", "c": "industry", "tg": ["行业趋势", "NMPA", "医疗器械/IVD", "中药", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 8.0, "sel": false, "fp": true, "ok": true}, {"t": "CDE将TollB-001片纳入“关爱计划-延伸”试点项目", "s": "CDE将北京拓领博泰生物科技有限公司的TollB-001片纳入“关爱计划-延伸”试点项目，拟开发适应症为系统性硬化症。该通知依据《罕见疾病创新药物研发鼓励试点计划（“关爱计划-延伸”）申报指南》发布，日期为11月3日。", "r": null, "u": "https://www.cnpharm.com/c/2026-11-03/1109881.shtml", "d": "2026-11-03", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "罕见病", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 20.0, "sel": false, "fp": true, "ok": true}, {"t": "Cell子刊：姜道华/吴笛/王晓辉解析苯丙胺类兴奋剂与山梗菜碱调控VMAT2的冷冻电镜结构", "s": "中国科学院物理研究所姜道华、吴笛及长春应用化学研究所王晓辉团队在Cell Reports发表研究，解析了人源VMAT2分别结合AMPH、METH、MDMA、MDA及山梗菜碱的冷冻电镜结构，分辨率2.87–2.99Å。", "r": null, "u": "https://news.bioon.com/article/27a99615623b.html", "d": "2026-11-03", "hm": "08:00", "c": "research", "tg": ["论文/研究", "神经/精神", "小分子"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "Nature：Tomas Mustelin团队提出红斑狼疮抗原新假说——中性粒细胞剪接残次品产生新抗原", "s": "华盛顿大学Tomas Mustelin团队在Nature发表研究，提出SLE自身抗原可能源于中性粒细胞mRNA异常剪接产生的新抗原。研究在5697个蛋白编码基因中检出6.5万多起替代剪接事件，其中356个基因、521起事件与健康人显著不同，并在患者MHC-I分子上鉴定出21条新序列衍生肽。这些新肽可刺激患者CD4+和CD8+ T细胞扩增并分泌IFN-γ，血清中亦检出针对新表位的IgG自身抗体。", "r": null, "u": "https://news.bioon.com/article/3cc4961588b7.html", "d": "2026-11-03", "hm": "08:00", "c": "research", "tg": ["论文/研究", "自免", "核酸药物"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "CDE公示将SR604注射液纳入\"关爱计划-延伸\"试点项目", "s": "CDE于11月3日公示拟将上海莱士血液制品股份有限公司的SR604注射液纳入\"关爱计划-延伸\"试点项目，公示期至2026年11月10日。该品种拟开发适应症为\"血小板无力症\"和\"血管性血友病的预防治疗\"。", "r": null, "u": "https://www.cnpharm.com/c/2026-11-03/1109883.shtml", "d": "2026-11-03", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "罕见病", "血液", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 30.0, "sel": false, "fp": true, "ok": true}, {"t": "华盛顿州一居民接触感染H5N1奶牛后死于禽流感，系美国一年来首例死亡", "s": "华盛顿州Yakima县一名有基础疾病的居民在接触感染H5N1的奶牛后死于禽流感并发症，于周日去世，为美国一年来首例此类死亡。CDC表示该患者感染H5N1，病毒基因序列分析未发现使其更易传播或致病更重的变化。当地已报告33个奶牛群H5N1检测阳性、3例与该奶牛场暴露相关的人感染；CDC称自2024年初以来美国报告逾70例人感染，尚无已知人际传播，公众风险低。", "r": null, "u": "https://www.statnews.com/2026/11/02/bird-flu-washington-state-resident-dies-infected-cattle-exposure/?utm_campaign=rss", "d": "2026-11-03", "hm": "04:44", "c": "industry", "tg": ["安全/质量", "感染/疫苗"], "src": "STAT", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "FDA 设定 uniQure 亨廷顿病基因疗法 ifezuntirgene inilparvovec 的 PDUFA 目标行动日期为 5 月 1 日", "s": "FDA 已受理 uniQure 亨廷顿病基因疗法 ifezuntirgene inilparvovec 的 BLA 并授予 Priority Review，设定 PDUFA 目标行动日期为 5 月 1 日。", "r": null, "u": "https://www.genengnews.com/topics/genome-editing/fda-sets-may-1-pdufa-action-date-for-uniqures-huntingtons-disease- : 30.0, "sel": false, "fp": false, "ok": true}, {"t": "嗜酸性粒细胞持续升高伴肺栓塞、肠壁增厚与血小板减少：一例特发性HES的多系统受累诊断与美泊利珠单抗、本瑞利珠单抗序贯治疗", "s": "一例46岁男性因腹泻、发热、腹痛起病，后出现左下肢肿胀与呼吸困难，外周血EOS达5.12×10⁹/L（峰值7.24×10⁹/L），CTPA示双肺多发PE、下肢超声示多发DVT，CT示双肺磨玻璃实变及结肠多节段肠壁增厚。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MzU3NjA5MTM2OQ==&mid=2247604342&idx=1&sn=ed1ec5d2acaa0db6215bee3045399e3c&chksm=fc6b62e720574bb1b4498c1eb0b42a05f5598a90076e31e95abb8401ae2c428016eb71f67649&scene=126&sessionid=1793627912#rd", "d": "2026-11-02", "hm": "19:00", "c": "clinical", "tg": ["临床进展", "罕见病", "血液", "呼吸", "抗体/双抗"], "src": "呼吸界", "sc": 18.0, "sel": false, "fp": false, "ok": true}, {"t": "吸着信必可、吃着顺尔宁能打疫苗吗？卢鑫医生：用药中恰恰是稳定期，无需停药", "s": "南京市江宁医院呼吸与危重症医学科卢鑫医生指出，哮喘患者接种疫苗看\"气道稳不稳\"而非\"药停没停\"，规律使用信必可、都保等吸入激素及顺尔宁（孟鲁司特钠）期间属稳定期，无需停药即可接种。仅急性发作期、全身用激素（如泼尼松每日20mg以上连用两周）、发热或急性感染、疫苗成分严重过敏者需暂缓，鼻喷减毒流感疫苗（LAIV）应慎用。流感灭活疫苗与23价肺炎球菌疫苗可同日分臂接种。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MzU3NjA5MTM2OQ==&mid=2247604342&idx=3&sn=64b242822c36837257c21f3260621426&chksm=fc11250c94a1a38a7018d627b7e879f3c8bd9cb051d60ca46783e1cf2a2414a313ec03e77029&scene=126&sessionid=1793627912#rd", "d": "2026-11-02", "hm": "19:00", "c": "opinion", "tg": ["观点/解读", "感染/疫苗", "呼吸"], "src": "呼吸界", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "石药集团普卢格列汀片联合达格列净片及盐酸二甲双胍缓释片治疗2型糖尿病III期临床试验取得积极顶线结果", "s": "石药集团公布普卢格列汀片联合达格列净片及盐酸二甲双胍缓释片治疗2型糖尿病的III期临床试验取得积极顶线结果。该联合方案针对2型糖尿病开展III期研究，具体终点数值尚未在公告中披露。", "r": null, "u": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/1102/2026110203378_c.pdf", "d": "2026-11-02", "hm": "18:48", "c": "clinical", "tg": ["临床进展", "代谢/减重", "石药集团", "entity:cspc"], "src": "石药集团·港交所公告", "sc": 40.0, "sel": false, "fp": true, "ok": true}, {"t": "石药集团SYS6052（重组带状疱疹病毒疫苗（CHO细胞））I/II期临床试验在中国正式启动", "s": "石药集团宣布SYS6052（重组带状疱疹病毒疫苗（CHO细胞））的I/II期临床试验在中国正式启动。该疫苗为重组带状疱疹疫苗，采用CHO细胞表达平台，此次启动的为I/II期临床研究。", "r": null, "u": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/1102/2026110203364_c.pdf", "d": "2026-11-02", "hm": "18:45", "c": "clinical", "tg": ["临床进展", "感染/疫苗", "石药集团", "entity:cspc"], "src": "石药集团·港交所公告", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "石药集团SYS6057（重组呼吸道合胞病毒疫苗（CHO细胞））I期临床试验在中国正式启动", "s": "石药集团宣布SYS6057（重组呼吸道合胞病毒疫苗（CHO细胞））的I期临床试验在中国正式启动。该疫苗为重组呼吸道合胞病毒疫苗，采用CHO细胞表达平台。", "r": null, "u": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/1102/2026110203350_c.pdf", "d": "2026-11-02", "hm": "18:43", "c": "clinical", "tg": ["临床进展", "感染/疫苗", "石药集团", "entity:cspc"], "src": "石药集团·港交所公告", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "2026流感宣传月｜胡必杰教授：以“大感控”理念推动“早防早治”，从医院防线延伸到家庭守护", "s": "复旦大学附属中山医院胡必杰教授在2026流感宣传月提出“早防早治，守护全家”，强调预防、诊断、治疗三个“早”。他指出玛巴洛沙韦单次口服即可完成疗程，2025年一项国际随机临床研究发现早期使用可降低流感病毒向家庭接触者传播的风险。医疗机构应落实早识别、快诊断、早治疗、严防控，家庭则需接种疫苗、及时就医并减少密切接触。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MzAxNDYzMDM4MA==&mid=2650200338&idx=1&sn=988090c1ddfe5b4486dabc51bbac34a8&chksm=8200cbd9ece811c1f9a9633a9cd082412955715e4c2a36b2bf9b01ead6fb929b98d4906a011e&scene=126&sessionid=1793624710#rd", "d": "2026-11-02", "hm": "18:30", "c": "opinion", "tg": ["观点/解读", "感染/疫苗"], "src": "SIFIC 感染视界", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "从孤岛到整合：2026年及以后有效的场景建模该怎么做", "s": "美国MFN定价政策推动下，17家大型药企中已有14家签署自愿协议，参与企业覆盖约89%的品牌药市场；同期欧盟新药上市数量据一方估算同比下降约35%。欧盟JCA与各国HTA机构提高比较证据要求，药企需在EMA审评同步阶段备好证据。Cencora高管建议打破部门孤岛，以整合式场景建模替代单线程模式。", "r": null, "u": "https://www.biopharmadive.com/spons/breaking-the-silos-what-effective-scenario-modeling-looks-like-in-2026-and/872840/", "d": "2026-11-02", "hm": "18:00", "c": "opinion", "tg": ["观点/解读", "行业趋势", "医保/集采"], "src": "BioPharma Dive", "sc": 18.0, "sel": false, "fp": false, "ok": true}, {"t": "福建医保药品单列门诊统筹支付管理办法施行，明确目录准入与调出规则", "s": "福建省医保局10月30日印发《福建省医保药品单列门诊统筹支付管理办法》（闽医保规〔2026〕3号），自2026年11月1日施行、有效期五年，替代原试行版本。药品纳入单列支付目录需同时满足四项条件：属于协议期内或已转常规目录的国谈药品、竞价药品；适合门诊治疗；适应症未被现有门诊特殊病种政策完全覆盖；疗程达12周及以上或年度治疗费用偏高。", "r": "福建新版单列门诊统筹办法给出四项准入硬条件与80%/60%报销比例，可与广东单独支付口径对照。", "u": "https://mp.weixin.qq.com/s?__biz=MjM5NDEwMDQ2Mg==&mid=2658699453&idx=1&sn=ab85bb7b69202a9b54f9b9bf5e7bd7e8&chksm=bcb1245cbe1b264572e30044905e868a585eb826c0b37f0f4c09a9b8666bb3fceb7939ae7f22&scene=126&sessionid=1793627945#rd", "d": "2026-11-02", "hm": "17:40", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "抗感染", "市场准入", "entity:nhsa"], "src": "医药云端工作室", "sc": 70.0, "sel": true, "fp": false, "ok": true}, {"t": "1880亿美元就位！礼来、强生等MNC将押注何处？", "s": "Leerink Partners研报显示，纳入统计的大型药企合计可动用并购资金达1880亿美元，强生以210亿美元现金储备居首，礼来今年已落地11笔并购、累计投入317亿美元。今年以来药企共完成28笔交易、总额970亿美元，高于2009–2025年年均19笔、690亿美元的水平。大额交易高度集中于炎症与免疫学、肿瘤学、罕见病和CNS赛道，Genmab是调研样本中唯一明确暂停并购的企业。", "r": null, "u": "https://www.drugtimes.cn/2026/11/02/1880yimeiyuanjiuweililaiqiangshengdengmncjiangyazhuhechu/", "d": "2026-11-02", "hm": "17:33", "c": "opinion", "tg": ["观点/解读", "行业趋势", "投融资", "肿瘤", "自免", "神经/精神", "罕见病", "GLP-1", "礼来"], "src": "药时代", "sc": 42.0, "sel": false, "fp": false, "ok": true}, {"t": "评论：癌症患者常被施压提前终止妊娠，她们不该如此", "s": "母胎医学医生Elyce Cardonick指出，孕期确诊癌症的患者常被建议终止妊娠或提前剖宫产，但化疗可在孕期安全进行、婴儿足月分娩。其创办的癌症与妊娠登记库已积累650例病例，纵向研究显示孕期化疗暴露儿童在18个月至3岁、6岁、9岁及12-15岁的发育测试表现与未暴露儿童相当，仅戴眼镜风险高3倍；而因避免母体癌症治疗而提前分娩的儿童表现更差。", "r": null, "u": "https://www.statnews.com/2026/11/02/pregnant-cancer-patients-abortion-early-labor-research/?utm_campaign=rss", "d": "2026-11-02", "hm": "17:30", "c": "opinion", "tg": ["观点/解读", "肿瘤"], "src": "STAT", "sc": 10.0, "sel": false, "fp": false, "ok": true}, {"t": "Kymera湿疹试验KT-621即将读出数据，挑战Dupixent的关键时刻", "s": "Kymera Therapeutics计划年底前公布其主打资产KT-621治疗湿疹的中期临床试验数据，Jefferies分析师称其为今年最具影响力的I&I读出之一。该药瞄准与Dupixent竞争的免疫学市场，分析师预测其2035年销售额可达近40亿美元，其中湿疹收入超30亿美元。结果还将影响其在慢性自发性荨麻疹和哮喘等更广泛免疫疾病上的布局。", "r": null, "u": "https://www.statnews.com/2026/11/02/kymera-therapeutics-trial-results-eczema-dupixent-rival/?utm_campaign=rss", "d": "2026-11-02", "hm": "17:30", "c": "clinical", "tg": ["临床进展", "自免", "赛诺菲", "再生元", "entity:sanofi", "entity:regeneron"], "src": "STAT", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "STAT 征集 MRT（线粒体替代技术/“三亲 IVF”）不孕治疗亲身经历者", "s": "STAT 正征集接受或实施 MRT（线粒体替代技术，俗称“三亲 IVF”）不孕治疗的亲历者，以了解相关诊所的运作方式。过去八个月，STAT 调查了该技术针对高龄女性的营销情况，尽管其有效性证据稀少。MRT 在美国属非法，但美国与欧洲女性可通过跨境医疗旅游前往海外诊所接受该治疗。", "r": null, "u": "https://www.statnews.com/2026/11/02/mrt-fertility-treatment-advanced-maternal-age-three-parent-ivf-reader-callout/?utm_campaign=rss", "d": "2026-11-02", "hm": "17:30", "c": null, "tg": ["其他"], "src": "STAT", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "女性远赴阿尔巴尼亚SAGA Clinic接受生殖\"登月\"试验，科学家称其被误导", "s": "一名荷兰女性Wendy于2月前往阿尔巴尼亚SAGA Clinic接受含乌克兰供卵者遗传物质的胚胎移植，该诊所自称\"FDA注册机构\"。科学家表示，寻求这类生殖\"登月\"试验的患者被误导。", "r": null, "u": "https://www.statnews.com/2026/11/02/three-parent-ivf-fertility-tourism-investigation-mrt-therapy/?utm_campaign=rss", "d": "2026-11-02", "hm": "17:30", "c": "industry", "tg": ["行业趋势", "其他", "FDA", "entity:fda"], "src": "STAT", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "Blue Shield of California 母公司 CEO 呼吁为美国医疗体系设定预算上限", "s": "Ascendiun（Blue Shield of California 母公司）总裁兼 CEO Paul Markovich 呼吁为美国医疗体系设定覆盖所有参与方的预算，将医疗成本增速控制在通胀率以内。", "r": null, "u": "https://www.statnews.com/2026/11/02/american-health-care-costs-broken-economics-solutions/?utm_campaign=rss", "d": "2026-11-02", "hm": "17:30", "c": "opinion", "tg": ["观点/解读", "医保/集采"], "src": "STAT", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "第12批国采江苏11月30日执行，16省已发文", "s": "江苏省医保局通知第12批国采将于11月30日24:00起全省统一执行，采购周期至2029年12月31日，11月8日前完成中选规格申报、11月20-24日网签合同、11月26日切换中选价格。", "r": "梳理第12批国采各省执行时点与江苏落地细则，中选企业可据此安排规格申报、备货与院内准入节奏。", "u": "https://mp.weixin.qq.com/s?__biz=MjM5NDEwMDQ2Mg==&mid=2658699446&idx=1&sn=e13e688f928045bf4d8d8168d8dca936&chksm=bc49fce15fcc5d20c9d5b99a73f6347085532de390ba5387d1fd8a0397832e1073b9f64a5052&scene=126&sessionid=1793627945#rd", "d": "2026-11-02", "hm": "15:52", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "抗感染", "市场准入", "entity:nhsa"], "src": "医药云端工作室", "sc": 67.0, "sel": true, "fp": false, "ok": true}, {"t": "\"豆包开药\"热搜之后，药企GEO第一道题：先看清AI在怎么说你", "s": "针对\"豆包开药\"热搜暴露的AI问药渗透诊室现象，赛柏蓝·百通AI服务平台推出医药行业第三方中立GEO监测平台，动态监测豆包、千问、DeepSeek等主流AI平台及小荷医生、蚂蚁阿福上的品牌可见度与可信度。平台部署1000+分布式采集节点模拟真实用户提问，输出可见度分析、竞品洞察、引用信源榜等六类结果，强调裁判员不下场以保证数据中立可信。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653669076&idx=1&sn=a3d1d9b5340e74e5008fddb17b96b20b&chksm=bcbb54ec0f317013a10f3e8343c6d772e42af4e227ae2bfdfd678f3c26fdb64db4608626aee1&scene=126&sessionid=1793627968#rd", "d": "2026-11-02", "hm": "15:00", "c": "opinion", "tg": ["观点/解读", "行业趋势"], "src": "赛柏蓝", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "艾诺森医药王欣：带金终结后，药企如何以真实世界研究构建硬核学术营销体系", "s": "艾诺森医药创始人、董事长王欣在第48届中国医药产业发展大会上提出，五一新规与代表管理办法施行后，药企传统人情客情营销难以为继，需以真实世界研究（RWS）为核心构建硬核营销体系。该体系以临床真实数据完成药品安全性、有效性、经济性综合评价，产出本土化循证依据，可用于学术推广、医保谈判与市场准入。落地须严禁篡改数据、杜绝假借科研名义利益输送，并推动从销售主导向医学主导的组织转型。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653669063&idx=1&sn=fdb35c0e130f1f40761bf245ae5cd088&chksm=bc918a51cd672482b3ab72b01fbf9abfa3327649539a950635d371773e25368fbcbd04d7c223&scene=126&sessionid=1793627968#rd", "d": "2026-11-02", "hm": "12:03", "c": "opinion", "tg": ["观点/解读", "市场/销售"], "src": "赛柏蓝", "sc": 20.0, "sel": false, "fp": false, "ok": true}, {"t": "2027药企医院合作策略：五大观察与两项建议", "s": "第48届中国医药产业发展大会上，药企市场总监提出院企合作正从对接专家个人转向服务医院组织、从费用通道转向真实项目合作。产学研、学会、基金会构成三大合规合作通道，均须先有真实项目再谈合作。药企应从提供产品升级为输出解决方案，立项前评估价值边界、明确落地路径并规划留痕与成果闭环。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653669043&idx=1&sn=b432b25ab0986c43b52135c667c4b4e3&chksm=bcc91b6116a3bdaeb093f70b1f78db2409dcf9ddf5dc52adb334fe236ee3559c9a44fc6c9820&scene=126&sessionid=1793627968#rd", "d": "2026-11-02", "hm": "11:46", "c": "opinion", "tg": ["观点/解读"], "src": "赛柏蓝", "sc": 20.0, "sel": false, "fp": false, "ok": true}, {"t": "礼来、阿斯利康等五家MNC公布2026年三季报，中国区表现分化", "s": "礼来、阿斯利康、默沙东、BMS、吉利德五家MNC公布2026年三季报，礼来Q3营收243.97亿美元、同比增长39%，市值首破1.3万亿美元。替尔泊肽降糖版与减重版前三季度合计437.68亿美元、占总营收65%，中国区Q3收入9.47亿美元、同比增69%，穆峰达2型糖尿病适应症2026年1月纳入国家医保后最低规格月治疗费降至324.1元。", "r": "五家MNC三季报横向对照，中国区被单列成三种状态，可看清医保准入与集采对同一批品种的不同作用。", "u": "https://mp.weixin.qq.com/s?__biz=MjM5NDEwMDQ2Mg==&mid=2658699442&idx=1&sn=5e7f9d783f3193569a335a7c08b485d1&chksm=bc64fe86fad8057f3a9a51546e6fb212350dcf5c65f74d34e1cfda5f8a9a1eee1c0ad741b05d&scene=126&sessionid=1793627945#rd", "d": "2026-11-02", "hm": "09:42", "c": "industry", "tg": ["市场/销售", "行业趋势", "代谢/减重", "肿瘤", "GLP-1", "礼来", "阿斯利康", "默沙东", "BMS", "entity:lilly", "entity:astrazeneca", "entity:msd", "entity:bms"], "src": "医药云端工作室", "sc": 62.0, "sel": true, "fp": false, "ok": true}, {"t": "新疆推行DRG/DIP半年清算机制，14个统筹地区完成2758家医疗机构清算", "s": "新疆医保局统筹部署全区DRG/DIP半年清算，截至目前14个统筹地区均已完成对2758家医疗机构的半年清算，累计支付166.23亿元。2026年1-6月全区8065.25万人次享受医保待遇，医保基金支出243.86亿元。半年累计评审病例4.4万余例，医保基金支付7.66亿元，并构建\"线上双盲评审+分级审核\"闭环管理体系。", "r": null, "u": "http://www.nhsa.gov.cn/art/2026/10/25/art_14_23226.html", "d": "2026-11-02", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "entity:nhsa"], "src": "国家医保局", "sc": 42.0, "sel": false, "fp": true, "ok": true}, {"t": "国家药监局公开征求《国家药品安全事件应急预案（征求意见稿）》意见", "s": "国家药监局组织起草《国家药品安全事件应急预案（征求意见稿）》，于11月2日起向社会公开征求意见，反馈截止2026年11月9日。该预案依据《药品管理法》及《国家突发事件总体应急预案》制定，旨在健全药品安全应急管理体系、提升药品安全事件应急处置能力，意见反馈表需发送至指定邮箱。", "r": null, "u": "https://www.cnpharm.com/c/2026-11-02/1109824.shtml", "d": "2026-11-02", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 42.0, "sel": false, "fp": true, "ok": true}, {"t": "Science：郭靖涛/王晓琰/张哲揭示人类泌尿生殖系统“共发育”空间图谱", "s": "中国科学院动物所郭靖涛、王晓琰与北京大学张哲共同通讯在 Science 发表研究，整合高分辨率空间转录组学与单细胞多组学，分析 Carnegie 第15至23期人类胚胎，揭示中肾和肾上腺原基来源信号促进性腺特化。研究还发现性腺支持细胞可能的中肾起源，并描绘三种转录上不同的类固醇生成谱系，在胆固醇来源、皮质醇合成和性激素产生方面存在差异。", "r": null, "u": "https://news.bioon.com/article/ad90961196cf.html", "d": "2026-11-02", "hm": "08:00", "c": "research", "tg": ["论文/研究"], "src": "生物谷", "sc": 10.0, "sel": false, "fp": false, "ok": true}, {"t": "复旦大学卢春来等团队发现UPP1在巨噬细胞和中性粒细胞中驱动肿瘤生长与免疫抑制", "s": "复旦大学卢春来、葛棣与西安交通大学李国平团队在Science Advances发表研究，通过泛癌单细胞转录组分析发现UPP1在肿瘤相关巨噬细胞（TAMs）和中性粒细胞（TANs）中高表达，其表达与多种癌症不良预后及免疫治疗反应减弱相关。", "r": null, "u": "https://news.bioon.com/article/308f96149914.html", "d": "2026-11-02", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤", "小分子"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "PNAS：香港大学曹凡团队发现自闭症脑功能连接存在两类年龄相关特征，稳定缺陷与发育迟滞被分开", "s": "香港大学曹凡团队在 PNAS 发表研究，基于大型多站点静息态 fMRI 横断面数据，在 5 至 64 岁人群中鉴定出两个 ASD 相关功能连接异常区域簇。簇1表现为跨年龄一致的低连接，主要涉及低阶感觉与感觉运动皮层，与 mGluR5 相关；簇2为儿童期低连接并随年龄减弱，主要涉及高阶联合皮层，与 GABAAα5 相关。", "r": null, "u": "https://news.bioon.com/article/307196150009.html", "d": "2026-11-02", "hm": "08:00", "c": "research", "tg": ["论文/研究", "神经/精神"], "src": "生物谷", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "Nat Commun：南方医科大学曾智等团队发现DDIT4经抑制PDC活性驱动血管平滑肌细胞表型转换，加重动脉粥样硬化与再狭窄", "s": "南方医科大学曾智、王晓武与广州医科大学邓伟豪团队在Nature Communications发表研究，发现DDIT4在去分化血管平滑肌细胞（VSMC）中表达上调，过表达DDIT4促进VSMC增殖与表型转换，AAV9介导Ddit4过表达加重小鼠动脉粥样硬化及血管损伤模型的新生内膜增生，而VSMC特异性敲除Ddit4可减轻病变。", "r": null, "u": "https://news.bioon.com/article/1e7696119274.html", "d": "2026-11-02", "hm": "08:00", "c": "research", "tg": ["论文/研究", "心血管", "小分子"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "黑龙江多措并举打通基层药品配备“最后一公里”", "s": "黑龙江省医保部门联合卫健、中医药管理等部门出台系列举措，将社区卫生服务中心常用口服药品指导目录扩充至600种，并要求常态化配备不少于300种。乡镇卫生院、村卫生室分别明确常态化配药300种以上、100种以上的刚性标准。依托全省一体化医保信息平台，已累计推送医保药品结算数据12次、4000余条，并完成650种基层常用药品的医保支付属性标注。", "r": null, "u": "http://www.nhsa.gov.cn/art/2026/10/24/art_14_23220.html", "d": "2026-11-02", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "entity:nhsa"], "src": "国家医保局", "sc": 38.0, "sel": false, "fp": true, "ok": true}, {"t": "华南理工大学边黎明/赵鹏超开发软骨结合型凝聚层润滑剂pZCOs，润滑+载药+干细胞递送一体化缓解骨关节炎", "s": "华南理工大学边黎明、赵鹏超团队开发聚两性离子凝聚层（pZCOs）作为仿生关节润滑剂，可强结合纤连蛋白、在软骨表面形成超低摩擦润滑层并渗入微缺陷，同时缓释双氯芬酸钠、保护MSCs并维持其旁分泌。", "r": null, "u": "https://news.bioon.com/article/ce4d96149e16.html", "d": "2026-11-02", "hm": "08:00", "c": "research", "tg": ["论文/研究", "小分子"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "PLOS Digital Health：普通摄像头+机器学习在养老机构实现药物相关步态异常常态化监测", "s": "一项双中心队列研究利用普通摄像头结合机器学习，在养老机构走廊无接触采集61名痴呆受试者的日常行走视频并输出步态严重程度评分，发现抗精神病药急性减量或停药与步态严重程度降低存在统计学关联，而抗抑郁药减量或停药未检测到同步改善信号。配对个体分析未观察到统一群体获益，受试者对药物调整的应答分化明显。该技术定位为预警筛查而非调药依据，用于标记步态明显波动者供临床评估。", "r": null, "u": "https://news.bioon.com/article/8f7d96030695.html", "d": "2026-11-02", "hm": "08:00", "c": "research", "tg": ["论文/研究", "神经/精神", "AI 制药"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "广东“医保钱包2.0”上线：职工医保个人账户实现跨省共济", "s": "“医保钱包2.0”于9月29日上线，广东作为首批省份实现职工医保个人账户从省内共济扩展至跨省共济。职工参保人可通过国家医保服务平台APP与省外参保近亲属绑定共济关系、设定共济额度，用于支付其就医购药个人负担费用或参保缴费，绑定次数和金额不限，剩余额度可返还个人账户。", "r": null, "u": "http://www.nhsa.gov.cn/art/2026/10/21/art_14_23178.html", "d": "2026-11-02", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "entity:nhsa"], "src": "国家医保局", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "Nat Cell Biol：METTL13 催化 eEF1A 甲基化选择性解码 mRNA，促进 KRAS 靶向药耐药", "s": "德克萨斯大学MD安德森癌症中心等机构研究发现，METTL13 催化 eEF1A 第55位赖氨酸二甲基化（eEF1AK55me2），可提高特定密码子解码效率、优先增加 KRAS 等促癌蛋白合成，从而促进肿瘤发生和靶向治疗耐药。", "r": null, "u": "https://news.bioon.com/article/eff89616153c.html", "d": "2026-11-02", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤", "小分子"], "src": "生物谷", "sc": 14.0, "sel": false, "fp": false, "ok": true}, {"t": "中国医科大学刘国军等开发手性病毒样纳米平台CVSN，突破血脑屏障递送抗生素治疗细菌性脑膜炎", "s": "中国医科大学刘国军等开发手性病毒模拟介孔二氧化硅纳米结构CVSN，经L-丙氨酸修饰后可高效穿透血脑屏障，将头孢哌酮、诺氟沙星、左氧氟沙星与亚胺培南等多种抗生素递送至脑实质与脑脊液。该体系靶向小胶质细胞与星形胶质细胞，提升抗生素生物利用度与脑内药物浓度，对13株临床分离肺炎链球菌表现出强效抗菌活性，可用于革兰氏阴性菌和阳性菌所致脑膜炎。", "r": null, "u": "https://news.bioon.com/article/9f97961194bb.html", "d": "2026-11-02", "hm": "08:00", "c": "research", "tg": ["论文/研究", "抗菌药物", "耐药与院感", "神经/精神", "抗感染", "管线上新", "对市场"], "src": "生物谷", "sc": 14.0, "sel": false, "fp": false, "ok": true}, {"t": "北京师范大学马燚娜团队在 Nat Neurosci 揭示杏仁核介导的“预测对方—决定自己”神经级联如何支撑相互合作", "s": "北京师范大学马燚娜团队在 Nature Neuroscience 发表研究，利用癫痫患者配对进行实时迭代囚徒困境博弈的同步颅内脑电图，发现相互合作期间杏仁核出现脑间表征对齐（IBRA），并预测逐试次结果。", "r": null, "u": "https://news.bioon.com/article/873f96119883.html", "d": "2026-11-02", "hm": "08:00", "c": "research", "tg": ["论文/研究", "神经/精神"], "src": "生物谷", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "福建厦门优化医保结算流程：基金拨付最短1个工作日，覆盖2000多家定点医药机构", "s": "福建厦门医保部门将基金拨付时限压缩至最短1个工作日，覆盖全市2000多家定点医药机构，并连续3年较全国平均水平提前两个月完成年度清算。即时结算实现门诊、住院、生育医疗、救助与药店购药费用\"日报日审日拨\"，大病保险结算由按月拨付升级为按日拨付，预计每年快拨付大病保险费用6亿元。今年2月完成2025年度医保清算，比往年提前超60天，全年拨付医保资金超110亿元。", "r": null, "u": "http://www.nhsa.gov.cn/art/2026/10/25/art_14_23224.html", "d": "2026-11-02", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "entity:nhsa"], "src": "国家医保局", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "杭州师范大学刘俊平/王丽辉发现端粒决定肝星状细胞活化，TELODIN减轻小鼠肝纤维化", "s": "杭州师范大学刘俊平、王丽辉团队在Hepatology发表研究，发现端粒功能障碍介导肝星状细胞（HSCs）转分化，HSC特异性过表达TERT或TPP1（Acd）可维持HSC静息并减轻CCl4及BDL小鼠肝纤维化。端粒酶激活剂TPP1稳定肽TELODIN腹腔给药通过减少端粒功能障碍、抑制HSC向肌成纤维细胞转分化，同样对抗纤维化发生。", "r": null, "u": "https://news.bioon.com/article/b3fb96120018.html", "d": "2026-11-02", "hm": "08:00", "c": "research", "tg": ["论文/研究", "小分子"], "src": "生物谷", "sc": 10.0, "sel": false, "fp": false, "ok": true}, {"t": "南方医科大学邱小忠等发现电导性心脏补片经TRPC3促进心脏修复", "s": "南方医科大学邱小忠、侯鸿浩、何玉童团队在Cell Stem Cell发表研究，发现电导率与天然心肌匹配（10⁻⁴–10⁻³ S/cm）的心脏补片可在心肌梗死后特异性促进WT1⁺心外膜来源细胞增殖并分化为内皮细胞，挽救心脏功能。", "r": null, "u": "https://news.bioon.com/article/ef17961185ad.html", "d": "2026-11-02", "hm": "08:00", "c": "research", "tg": ["论文/研究", "心血管", "细胞与基因治疗"], "src": "生物谷", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "哈药集团2026年三季报营收123.52亿元、净利润6亿元同比增82.66%", "s": "哈药集团2026年三季报显示，报告期内实现营收123.52亿元（+2.75%）、归母净利润约6亿元（+82.66%），业绩双增。保健品业务延续高增长，钙铁锌口服液、消食化积口服液、朴雪、盖中盖等经典品种叠加GNC品牌产品矩阵，成为线上渠道增长主力；商业板块批发与零售两端同步调整品种结构。", "r": "三季报净利同比增82.66%，原文拆解了保健品线上渠道与工商两端对增长的贡献。", "u": "https://www.menet.com.cn/info/202611/202611020925152515_151369.shtml", "d": "2026-11-02", "hm": "08:00", "c": "industry", "tg": ["公司动态", "市场/销售", "中药", "哈药股份", "抗感染", "企业竞争", "entity:hayao"], "src": "米内网·企业", "sc": 58.0, "sel": true, "fp": false, "ok": true}, {"t": "Immunity：上海交通大学贺兼理等揭示VEGF-B/VEGFR-1信号维持肠道Tfh细胞干性、限制Taurinivorans扩增以抵抗肥胖", "s": "上海交通大学贺兼理等发现，肠道Tfh细胞中的VEGFR-1信号通过VEGFR-1-AKT轴限制p53介导的衰老、维持Tfh细胞干性，从而保障IgA免疫监视 液“咳嗽多米诺”创意刷屏，药店如何承接流量", "s": "世界流感日，小葵花小儿肺热咳喘口服液在北京、成都、沈阳三城地铁与广州公交候车亭上线“咳嗽多米诺”创意海报，主张“传快乐，别传咳嗽”。该产品功能主治为清热解毒、宣肺化痰，用于热邪犯于肺卫所致的发热、咳嗽、痰黄或兼喘息，组方以麻杏石甘汤与白虎汤为基础化裁。据中康瓴西消费者洞察系统数据，其在儿童中药止咳领域连续多年位居前列，O2O渠道保持双位数增长。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653668987&idx=4&sn=28fc65d36705324dbea77a30d3cd0674&chksm=bcdc06c9cc645ea2a9e003232182e4190986b19dd287396c17324a3711c293b87d2ad504b48e&scene=126&sessionid=1793627968#rd", "d": "2026-11-01", "hm": "19:46", "c": "industry", "tg": ["公司动态", "市场/销售", "中药", "呼吸"], "src": "赛柏蓝", "sc": 18.0, "sel": false, "fp": false, "ok": true}, {"t": "超97%慢阻肺病患者不知情，从无症状到呼吸衰竭要经历哪4步？", "s": "王辰院士团队发表于《柳叶刀》的中国肺健康研究对全国超5万名成年人做规范肺功能检查，确诊慢阻肺病的患者中仅2.6%自述曾被医生诊断，97.4%对病情毫不知情。迟春花教授指出，忽视源于把咳痰气喘当成\"不是病\"、低估疾病严重性和\"忍\"字当头。慢阻肺病经肺动脉高压、肺心病等环节可进展至呼吸衰竭，但规范管理可长期稳定。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MzU3NjA5MTM2OQ==&mid=2247604328&idx=2&sn=4bf9aac59170fdf975e4f39e3c7b8563&chksm=fc101a40d68cf2800a3a53cabbb8f893bbf72133ed8bf4bc868bbcf36a334616c6f1227ee76c&scene=126&sessionid=1793627912#rd", "d": "2026-11-01", "hm": "19:17", "c": "opinion", "tg": ["观点/解读", "呼吸"], "src": "呼吸界", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "《NEJM》综述：革兰氏阴性菌抗菌药物耐药性的驱动因素、耐药机制与当前及新兴治疗格局", "s": "《新英格兰医学杂志》发表综述，系统梳理革兰氏阴性菌抗菌药物耐药的驱动因素、主要耐药机制及当前和新兴治疗格局，重点关注产ESBL肠杆菌目细菌、CRE、难治性耐药铜绿假单胞菌和碳青霉烯类耐药鲍曼不动杆菌复合群感染。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MzU3NjA5MTM2OQ==&mid=2247604328&idx=1&sn=e68f48ecb944febc49ba8d1730138b67&chksm=fc35a7aac077f42d022be156f2a37f733e52fda41983f449125102ff11741bd3299db136db1c&scene=126&sessionid=1793627912#rd", "d": "2026-11-01", "hm": "19:17", "c": "research", "tg": ["论文/研究", "抗菌药物", "耐药与院感", "抗感染", "循证指南", "对市场"], "src": "呼吸界", "sc": 36.0, "sel": false, "fp": false, "ok": true}, {"t": "2026流感宣传月丨胡必杰、王贵强、曾玫、林炳亮四位专家谈流感防控：从大感控理念到家庭科学防护", "s": "《感染在线》与《SIFIC感染视界》发起2026流感宣传月，邀请胡必杰、王贵强、曾玫、林炳亮四位教授分别从大感控理念、公共卫生治理、儿童规范用药及南方流感特征展开分享。胡必杰提出“大感控”理念并强调预防、诊断、治疗三个“早”；曾玫指出儿童抗病毒治疗需把握“黄金48小时”，玛巴洛沙韦干混悬剂已获批用于1岁及以上儿童。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MzAxNDYzMDM4MA==&mid=2650200307&idx=1&sn=37420230d31b0800b5c62d8212204474&chksm=825466060486ad76c3532db3e67612b119cb5064db88f0017377ca5a6ad0c77d10429b013c78&scene=126&sessionid=1793624710#rd", "d": "2026-11-01", "hm": "10:25", "c": "opinion", "tg": ["观点/解读", "感染/疫苗"], "src": "SIFIC 感染视界", "sc": 15.0, "sel": false, "fp": false, "ok": true}, {"t": "国家医保局公布2026年全民参保宣传短视频大赛结果名单", "s": "国家医疗保障局公布2026年全民参保宣传短视频大赛结果名单，共收到930件作品，120部入围，最终评出一等奖10名、二等奖20名、三等奖30名和优秀奖60名。大赛于2026年6月至8月举办，旨在巩固全民参保成果、普及医保知识。", "r": null, "u": "http://www.nhsa.gov.cn/art/2026/11/1/art_109_23271.html", "d": "2026-11-01", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "entity:nhsa"], "src": "国家医保局", "sc": 8.0, "sel": false, "fp": true, "ok": true}, {"t": "中期选举可能改变美国卫生政策的四大方式", "s": "STAT 采访二十余位政府与私营部门领袖、顾问、游说人士及工作人员，梳理中期选举影响美国医疗体系的几大途径。民主党掌控国会可能放缓政策制定并加强调查，共和党维持多数则可能加速其立法议程。", "r": null, "u": "https://www.statnews.com/2026/10/31/midterm-election-tipping-point-healthcare-policy/?utm_campaign=rss", "d": "2026-10-31", "hm": "19:00", "c": "opinion", "tg": ["观点/解读", "行业趋势"], "src": "STAT", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "制氧机用一年氧浓度掉到88%？卢鑫医生解析分子筛、滤芯与呼吸机联用误区", "s": "南京江宁医院呼吸与危重症医学科卢鑫医生指出，医用制氧机在额定流量下氧浓度须稳定在93%±3%（不低于90%），实测掉到88%已属无效氧疗。浓度下降应先排查滤芯堵塞、湿化瓶倒灌、环境潮湿及压缩机老化，最后才查分子筛；分子筛寿命一般1万–2万小时。制氧机与呼吸机可联用但须接口、流量、压力匹配，氧流量由医生按血气调整。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MzU3NjA5MTM2OQ==&mid=2247604322&idx=2&sn=876b8e6750696f7f54968af0c3dba04b&chksm=fc14620238399b1725b3f9c9b94a387dc76d19d6dba1f2907582600ab85935694da6de17c5f0&scene=126&sessionid=1793415832#rd", "d": "2026-10-31", "hm": "10:39", "c": "opinion", "tg": ["观点/解读", "医疗器械/IVD", "呼吸"], "src": "呼吸界", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "《柳叶刀·呼吸病学》发布中国慢阻肺病防治委员会特约报告，王辰院士任通讯作者", "s": "《柳叶刀·呼吸病学》在线发表中国慢阻肺病防治委员会特约报告，王辰院士任通讯作者，陈荣昌、肖丹教授为共同第一作者，51位中外专家共同完成。报告指出我国慢阻肺病患者近1亿，吸烟及室内外空气污染为主要环境危险因素，仍面临肺功能检查普及不足、早期诊断率低、基层药物可及性有限等挑战。报告提出构建涵盖健康促进、预防、诊断、控制、 ": "research", "tg": ["论文/研究", "肿瘤"], "src": "生物谷", "sc": 16.0, "sel": false, "fp": false, "ok": true}, {"t": "《Cell》：亨廷顿病神经元体细胞CAG扩增跨过约150个重复即触发基因表达崩溃", "s": "博德研究所Steven A. McCarroll团队在《Cell》发表研究，用单细胞核测序同时测定HTT基因CAG重复数与全基因组RNA表达，分析11名患者死后新皮层超12.5万个细胞核。研究发现皮层锥体神经元同样遵循\"体细胞扩增-阈值\"模型：CAG重复跨过约150个时基因表达急转直下，更远则进入\"去抑制危机\"并致死；该阈值是所有皮层锥体神经元共有，不同亚型易感性差异可达20倍。", "r": null, "u": "https://news.bioon.com/article/6f1096092624.html", "d": "2026-10-30", "hm": "08:00", "c": "research", "tg": ["论文/研究", "神经/精神", "罕见病"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "沈博/王玲合作揭示他汀在雌激素缺乏下促骨形成的细胞与分子机制", "s": "清华大学沈博与首都医科大学王玲团队在Nature Aging发表研究，揭示他汀类药物在雌激素缺乏微环境中通过限制小GTP酶RAC1异戊二烯化修饰、激活NF-κB信号，诱导LEPR⁺骨骼干/祖细胞表达骨生长因子OLN，从而促进骨形成并减少骨量流失。", "r": null, "u": "https://news.bioon.com/article/a93d9609284e.html", "d": "2026-10-30", "hm": "08:00", "c": "research", "tg": ["论文/研究", "代谢/减重"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "Advanced Science：华山医院团队解析人毳毛毛囊皮脂腺单元衰老的单细胞核转录组图谱", "s": "复旦大学附属华山医院团队在 Advanced Science 发表研究，通过单细胞核转录组测序对比年轻与老年男性背部皮肤样本，绘制人毳毛毛囊皮脂腺单元细胞图谱，鉴定出12种主要细胞类型。衰老驱动上皮、皮脂腺、黑素细胞及免疫细胞多维度转录重塑：隆突毛囊干细胞占比下降、皮脂腺细胞雄激素应答与脂质合成增强、免疫微环境促炎信号增强，诱发皮肤低度慢性炎症。该图谱为筛选抗皮肤衰老靶点提供组学参考。", "r": null, "u": "https://news.bioon.com/article/13d99554e5e7.html", "d": "2026-10-30", "hm": "08:00", "c": "research", "tg": ["论文/研究", "其他"], "src": "生物谷", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "公益赋能终端 渠道聚力共赢｜广州白云山明兴制药有限公司双线并举绘就呼吸健康产业新蓝图", "s": "", "r": null, "u": "https://www.menet.com.cn/info/202610/20261030210410410_151367.shtml", "d": "2026-10-30", "hm": "08:00", "c": null, "tg": ["其他"], "src": "米内网·企业", "sc": 8.0, "sel": false, "fp": false, "ok": false}, {"t": "Nature Aging研究揭示男性中年免疫衰退更快：淋巴结收缩致初始CD8⁺ T细胞减少、肿瘤抗原识别受损", "s": "一项发表于Nature Aging的研究结合小鼠模型与人类队列数据，揭示雄性中年阶段初始CD8⁺ T细胞加速损耗与淋巴结萎缩收缩相关，进而削弱对黑色素瘤的抗原识别与免疫检查点阻断应答。机制涉及抗原非依赖性分化为T VM细胞及胸腺更早退化双重叠加；雄激素消融可促进中年雄性小鼠治疗性胸腺再生并恢复抗原识别能力，但老年个体效果有限。", "r": null, "u": "https://news.bioon.com/article/7a8b9549e653.html", "d": "2026-10-30", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "JCIM：MML-DTI用双曲几何捕捉分子层级结构，药物靶点预测更准、泛化更稳", "s": "研究搭建MML-DTI多流形学习框架，引入双曲图神经网络融合分子拓扑、化学指纹、预训练化学模型语义与ESM-2蛋白序列特征，预测药物靶点相互作用。在DrugBank、Davis、KIBA三个数据集上，MML-DTI的准确率、精确率、召回率、AUROC、AUPRC、F1分数达到最优或次优水平；靶点冷启动测试中仍保持较好预测效果。", "r": null, "u": "https://news.bioon.com/article/b79496030084.html", "d": "2026-10-30", "hm": "08:00", "c": "research", "tg": ["论文/研究"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "国家药监局副局长杨胜赴广东调研大湾区药物创新研发与监管工作", "s": "国家药监局党组成员、副局长杨胜带队赴广东调研部分药物研发企业及药品、医疗器械大湾区分中心，并召开座谈会了解大湾区医药产业创新成果转化和药品监管工作情况。杨胜强调要主动服务国家发展战略，聚焦重点品种、完善服务方式方法，并加强人才培养、落实\"三统一\"工作目标。广东省药监局和深圳市市场监管局有关负责同志参加调研和座谈。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-30/1109735.shtml", "d": "2026-10-30", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 12.0, "sel": false, "fp": true, "ok": true}, {"t": "2026年10月Cell期刊亮点研究盘点：免疫治疗副作用机制、左旋肉碱炎症新通路与运动多组学图谱等", "s": "2026年10月Cell期刊多项研究集中发布：匹兹堡大学团队建立免疫相关不良事件小鼠模型，锁定可致高达40%免疫检查点抑制剂患者出现严重副作用的不稳定免疫细胞，并证明饮食与肠道菌群影响其严重程度。耶鲁大学发现左旋肉碱激活炎症小体的新机制，为脓毒症治疗提供线索；另有研究构建22种组织、超100万细胞的运动与胚胎发育多组学图谱。", "r": null, "u": "https://news.bioon.com/article/130996014308.html", "d": "2026-10-30", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤", "代谢/减重", "AI 制药"], "src": "生物谷", "sc": 10.0, "sel": false, "fp": false, "ok": true}, {"t": "CDE公开征求《新生抗原药品关键问题的技术考虑（征求意见稿）》意见", "s": "CDE于10月30日就《新生抗原药品关键问题的技术考虑（征求意见稿）》公开征求意见，旨在规范和指导新生抗原（Neoantigens）药品的研发和注册申报。征求意见时限为自发布之日起1个月，反馈意见可发送至指定邮箱。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-30/1109711.shtml", "d": "2026-10-30", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "肿瘤", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 30.0, "sel": false, "fp": true, "ok": true}, {"t": "《Cell》多模态MERFISH研究：亨廷顿病神经元死亡由超大CAG重复扩增标定，核内包涵体并非终点", "s": "加利福尼亚大学圣地亚哥分校Don W. Cleveland团队在《Cell》发表研究，用多模态MERFISH分析人亨廷顿病皮层超42.8万个细胞，发现第5-6层投射神经元和L6b深部兴奋性神经元丢失率超过50%，这些细胞普遍携带超过450个CAG的体细胞扩增。核内包涵体在约250-350个CAG时最多见，扩增更高时包涵体未必更多但细胞死亡风险显著上升，提示包涵体是应激阶段性产物而非死亡判决。", "r": null, "u": "https://news.bioon.com/article/11b996092e24.html", "d": "2026-10-30", "hm": "08:00", "c": "research", "tg": ["论文/研究", "神经/精神", "罕见病"], "src": "生物谷", "sc": 10.0, "sel": false, "fp": false, "ok": true}, {"t": "广州医科大学合作《Nature》：产气荚膜梭菌δ毒素靶向CD9驱动坏死性小肠结肠炎与脑损伤", "s": "广州国家实验室、广州医科大学熊小哲团队与哈佛医学院/波士顿儿童医院董民团队等在 Nature 发表研究，发现携带δ毒素的产气荚膜梭菌在重症坏死性小肠结肠炎（NEC）患儿肠道中显著富集，δ毒素经全基因组CRISPR筛选确定以CD9为宿主受体。小鼠实验显示，δ毒素主要作用于巨噬细胞，激活炎症小体引发细胞焦亡和炎症风暴，进而破坏血脑屏障导致脑损伤；一款中和性抗δ毒素单克隆抗体在小鼠中能有效阻止疾病进展。", "r": null, "u": "https://news.bioon.com/article/9bb99609489a.html", "d": "2026-10-30", "hm": "08:00", "c": "research", "tg": ["论文/研究", "感染/疫苗", "耐药与院感", "其他", "抗感染", "循证指南"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "复旦大学丁晶/邵志成/汪昕 Nature Communications 发文：类器官揭示GATOR1相关局灶性癫痫MAFB不足机制，独立于mTOR过度激活", "s": "复旦大学丁晶、邵志成、汪昕团队在 Nature Communications 发表研究，利用GATOR1突变患者iPSCs构建腹侧GABA能类器官（VGOs），发现GABA能中间神经元分化、迁移及功能性GABA释放存在缺陷，且不依赖经典mTOR过度激活，而由MAFB表达不足驱动。敲低MAFB可诱发类似缺陷，过表达MAFB能部分挽救患者VGOs异常表型，揭示GATOR1相关局灶性癫痫的非经典分子轴。", "r": null, "u": "https://news.bioon.com/article/eaee960950b7.html", "d": "2026-10-30", "hm": "08:00", "c": "research", "tg": ["论文/研究", "神经/精神", "罕见病"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "复旦大学黄胜林/胡夕春/朱晓东在Mol Cell发表研究：转座元件剪接产生的TEtrans既是致癌驱动因子也是肿瘤抗原来源", "s": "复旦大学黄胜林、胡夕春、朱晓东团队在Molecular Cell发表研究，基于连接点为中心的分析（ASJA）对泛癌RNA-seq数据进行分析，在9581个肿瘤中鉴定出5361个肿瘤富集、基因非依赖性的TE衍生转录本TEtrans。", "r": null, "u": "https://news.bioon.com/article/b99c960949fa.html", "d": "2026-10-30", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤", "核酸药物"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "上海医药2026年前三季度营收2229.64亿元，扣非净利润增长25.02%", "s": "上海医药公布2026年前三季度业绩，实现营业收入2229.64亿元，同比增长3.67%，扣非归母净利润33.74亿元，同比增长25.02%。工业板块收入189.89亿元、同比增长4.54%，商业板块收入2039.75亿元、同比增长3.59%，占总营收比重超过90%。报告期内研发费用15.16亿元，占医药工业收入比重7.98%，新药管线共60项，1类新药苹果酸司妥吉仑片已获批上市并在多个省份挂网。", "r": "原文拆解上海医药前三季度工业与商业两大板块的收入结构，可看其创新药服务与CSO业务的增长位置。", "u": "https://www.menet.com.cn/info/202610/202610301622512251_151366.shtml", "d": "2026-10-30", "hm": "08:00", "c": "industry", "tg": ["公司动态", "市场/销售", "研发管线", "上海医药", "中药", "抗体/双抗", "小分子", "entity:shpharma"], "src": "米内网·企业", "sc": 60.0, "sel": true, "fp": false, "ok": true}, {"t": "上海科技大学程冰冰等开发HaMBO平台：3D打印全息声场按需开放血脑屏障，实现卒中后多靶点递送", "s": "上海科技大学程冰冰等构建全息辅助多靶点BBB开放平台HaMBO，将低成本3D打印全息片与单阵元超声换能器结合，沿梗死边界实现局灶性血脑屏障开放。在MCAO小鼠模型中，单次2分钟、0.5MPa处理可递送EVs与MSCs至梗死周边区，脑萎缩降低约56%，血管新生提升约2倍，神经前体细胞增殖提升约4倍，并改善长期行为功能。人颅骨模型仿真提示该平台可适配多种临床卒中场景。", "r": null, "u": "https://news.bioon.com/article/bb1a9609295b.html", "d": "2026-10-30", "hm": "08:00", "c": "research", "tg": ["论文/研究", "神经/精神", "医疗器械/IVD"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "美敦力一次性使用磁定位标测双能量消融导管等4个创新产品获NMPA批准上市", "s": "国家药监局批准美敦力公司“一次性使用磁定位标测双能量消融导管”“心脏双能量消融系统”“三维心脏电生理标测系统”“一次性使用体表参考电极”4个创新产品注册申请。该导管与消融系统配合可在一次手术中对心脏不同部位分别输出射频或脉冲电场能量，用于治疗药物难治性、复发性、症状性持续性房颤（发作持续时间少于1年）。上述产品组合在提高消融效率、减少心房食管瘘等严重并发症方面具有临床应用价值。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-30/1109709.shtml", "d": "2026-10-30", "hm": "08:00", "c": "approval", "tg": ["获批上市", "医疗器械/IVD", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 12.0, "sel": false, "fp": true, "ok": true}, {"t": "GlueFinder计算平台可批量挖掘EGFR、HER2、KRAS分子胶候选物", "s": "研究团队开发GlueFinder数据驱动计算平台，通过扫描蛋白互作界面邻近可成药口袋预测分子胶候选物，并已用沙利度胺验证其可还原经典分子胶结合模式。用于EGFR、HER2、KRAS三个肿瘤靶点时，分别筛选出可招募24种、111种、148种不同E3泛素连接酶的候选分子。平台还给出分层筛选方案，可将上百个初筛候选压缩至5-15个重点分子供实验验证。", "r": null, "u": "https://news.bioon.com/article/38cf96033413.html", "d": "2026-10-30", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤", "小分子"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "盐野义将南京长澳与深圳联诚100%股权转让给浙江高跖医药", "s": "10月29日，盐野义制药与浙江高跖医药同时宣布，盐野义中国仿制药业务主体南京长澳制药与深圳联诚医药各100%股权转让给成立仅五年的高跖医药。南京长澳拥有冻干粉针、固体制剂、软膏乳膏凝胶三条产线及注射用雷贝拉唑钠、匹伐他汀钙片、克拉霉素分散片等50件注册证，深圳联诚负责长澳产品全国营销并持有阿莫西林胶囊“阿莫灵”中国大陆独家经销权。", "r": "文章把盐野义出售中国仿制药资产放进外企在华腾笼换鸟的脉络里，并点出整合成败的关键。", "u": "https://mp.weixin.qq.com/s?__biz=MjM5NDEwMDQ2Mg==&mid=2658699438&idx=1&sn=d8a05345c615dbe60194bc6bd1b95960&chksm=bca78c1fafdf1d6222d48e9285e10f59379583882e5082125711d0c0bdf37d3087ca30d21d27&scene=126&sessionid=1793415858#rd", "d": "2026-10-30", "hm": "07:50", "c": "industry", "tg": ["交易/授权", "公司动态", "行业趋势", "抗菌药物", "抗感染", "企业竞争", "对市场"], "src": "医药云端工作室", "sc": 65.0, "sel": true, "fp": false, "ok": true}, {"t": "荣昌生物前三季度营收67.6亿元增293%，国内商业化销售21.5亿元", "s": "荣昌生物2026年三季报显示，前三季度总收入67.6亿元，同比增长293%，第三季度单季营收9.1亿元，同比增长46.41%；剔除技术授权收入、BD咨询费和认股权证公允价值变动影响后，前三季度和Q3单季均实现盈利。", "r": "材料拆分了荣昌生物三季报中授权收益与产品销售收入的构成，读者可据此判断其商业化盈利的可持续性。", "u": "https://mp.weixin.qq.com/s?__biz=MjM5NDEwMDQ2Mg==&mid=2658699438&idx=2&sn=60f28fde9acc13ceb551aeb69573e9be&chksm=bc7bb8fa5f63b56f7abe4f6d104e49be2f091b72930d6763c61aae9e071006a82f68ac86410a&scene=126&sessionid=1793415858#rd", "d": "2026-10-30", "hm": "07:50", "c": "industry", "tg": ["公司动态", "市场/销售", "ADC", "自免", "辉瑞", "艾伯维", "entity:pfizer", "entity:abbvie"], "src": "医药云端工作室", "sc": 71.0, "sel": true, "fp": false, "ok": true}, {"t": "美国劳工部敲定PBM全面信息披露规则，预计十年为雇主节省220亿美元药费", "s": "美国劳工部周四敲定PBM信息披露最终规则，要求药房福利管理机构向自保雇主客户披露返点、\"价差\"等报酬数据，监管机构预计十年可为雇主及其员工降低药费220亿美元。规则2027年7月生效，PBM须在合同谈判或续约时及每半年披露一次，雇主每年可审计一次，违规将面临罚款乃至合同失效。PBM行业组织PCMA强烈反对，称规则与2026年《综合拨款法案》中的PBM改革重复且越权。", "r": null, "u": "https://www.biopharmadive.com/news/pbm-transparency-final-rule-labor-department-employer/873254/", "d": "2026-10-30", "hm": "04:30", "c": "policy", "tg": ["政策/监管"], "src": "BioPharma Dive", "sc": 15.0, "sel": false, "fp": false, "ok": true}, {"t": "大脑质量控制机制在发育期选择性清除携带异常变异神经元", "s": "哈佛医学院、波士顿儿童医院等机构的研究者通过单细胞全基因组测序发现，发育中胎儿大脑内平均近26%的神经元携带广泛拷贝数变异，出生后降至平均6.2%，这些异常神经元在围产期被选择性清除。对逾44,000个单细胞的分析显示，广泛拷贝数变异神经元突触相关基因表达异常，因无法形成关键突触连接而死亡。研究发表于Nature，提示该质量控制机制若被破坏可能与自闭症等神经发育障碍相关。", "r": null, "u": "https://www.genengnews.com/topics/translational-medicine/brain-quality-control-selectively-eliminates-neurons-with-abnormal-variants-in-development/", "d": "2026-10-30", "hm": "03:17", "c": "research", "tg": ["论文/研究", "神经/精神"], "src": "GEN Genetic Engineering & Biotechnology News", "sc": 10.0, "sel": false, "fp": false, "ok": true}, {"t": "联邦法官否决 Medicaid 工作要求的\"医疗虚弱\"新定义", "s": "美国马萨诸塞州联邦地区法院法官 Richard D. Stearns 裁定，联邦政府关于\"医疗虚弱\"（medically frail）的新定义过于严苛，否决该定义。由二十多个州提起的诉讼成功证明，按现有文本实施 Medicaid 工作要求将造成\"不可弥补的损害\"。法官在命令中表示，执行这一不合法定义可能导致原本符合条件的弱势参保人失去保障、中断治疗。", "r": null, "u": "https://www.statnews.com/2026/10/29/medicaid-work-requirements-judge-blocks-new-limits-medical-frailty/?utm_campaign=rss", "d": "2026-10-30", "hm": "02:57", "c": "policy", "tg": ["政策/监管", "医保/集采"], "src": "STAT", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "Whitehead Institute 在 Danionella cerebrum 中构建首个成年脊椎动物全身单细胞图谱", "s": "Whitehead Institute 研究人员在体长约 12 mm 的透明硬骨鱼 Danionella cerebrum 中构建了首个成年脊椎动物全身单细胞转录组图谱，覆盖全身逾 60 万个细胞，并结合 scRNA-seq 与 MERFISH、HCR-FISH 空间转录组学方法定位细胞类型与基因活动。", "r": null, "u": "https://www.genengnews.com/topics/omics/first-whole-body-single-cell-atlas-of-adult-vertebrate-generated-in-danionella-cerebrum/", "d": "2026-10-30", "hm": "02:28", "c": "research", "tg": ["论文/研究"], "src": "GEN Genetic Engineering & Biotechnology News", "sc": 10.0, "sel": false, "fp": false, "ok": true}, {"t": "特朗普政府新规要求 PBM 向雇主披露返点与价差等全部报酬数据", "s": "特朗普政府最终确定一项法规，要求 PBM 向雇佣它们的雇主披露从药企、咨询公司及其他机构获得的全部费用与报酬，包括药品返点、价差定价及与经纪商、顾问之间可能产生利益冲突的财务关系。披露自 2027 年 7 月 1 日起强制执行，联邦官员估计适用于 70 多家 PBM 和 13 万家雇主，每年可通过降低药价节省逾 8 亿美元。PBM 与游说方此前曾警告可能就该提案采取法律行动。", "r": null, "u": "https://www.statnews.com/2026/10/29/prescription-drug-price-reform-pbm-disclosure-rules-face-challenge/?utm_campaign=rss", "d": "2026-10-30", "hm": "00:44", "c": "policy", "tg": ["政策/监管"], "src": "STAT", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "STAT+：EPIC 调查与 Teladoc 的意外消息", "s": "STAT 健康科技通讯报道了 EPIC 调查以及 Teladoc 的一则意外消息。STAT 将于 11 月 18 日上午在拉斯维加斯 HLTH 大会登台。该文为 STAT+ 订阅专属内容。", "r": null, "u": "https://www.statnews.com/2026/10/29/epic-investigation-teladoc-surprise-ai DC首次披露人体数据，其中12款来自中国Biotech。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MjM5NDEwMDQ2Mg==&mid=2658699399&idx=2&sn=5bd5fb50fad6e7bb97da1b71299edcc6&chksm=bcfe3a93f058f77309c0a5e9c77852a62af0a88410fc7df447ab060d26d8f7cdd0f862975bfb&scene=126&sessionid=1793627945#rd", "d": "2026-10-29", "hm": "08:05", "c": "opinion", "tg": ["观点/解读", "肿瘤", "ADC", "抗体/双抗", "行业趋势", "康方生物", "恒瑞医药", "科伦博泰", "信达生物"], "src": "医药云端工作室", "sc": 42.0, "sel": false, "fp": false, "ok": true}, {"t": "欧康维视氟轻松玻璃体内植入剂优施莹地产化获 NMPA 批准", "s": "10月27日，欧康维视宣布氟轻松玻璃体内植入剂（优施莹）地产化注册申请获国家药监局批准，未来可在境内商业化生产供应。该药2022年6月以进口5.1类获批，用于累及眼后段的慢性非感染性葡萄膜炎，2023年通过国谈进入医保目录；此次由苏州欧康维视以化学药品4类仿制路径申报（受理号CYHS2502987，2025年8月承办，国药准字H20266424），分子、剂型、适应症未变。", "r": "从进口独家到苏州地产化，材料拆解了眼科缓释植入剂的制剂工程门槛与后续供应、医保放量逻辑。", "u": "https://mp.weixin.qq.com/s?__biz=MjM5NDEwMDQ2Mg==&mid=2658699399&idx=1&sn=e0811786e89c50f3f9847b723fd3e713&chksm=bc67fa6cc8bcce733b02d5ad289936c41fca9622657f75fc4a07ad8025c8f940f49f8487a271&scene=126&sessionid=1793415858#rd", "d": "2026-10-29", "hm": "08:05", "c": "approval", "tg": ["获批上市", "眼科", "医疗器械/IVD", "NMPA", "entity:nmpa"], "src": "医药云端工作室", "sc": 58.0, "sel": true, "fp": false, "ok": true}, {"t": "从ESMO主席论坛到FDA递交：和黄医药赛沃替尼联合奥希替尼的全球进阶", "s": "和黄医药在ESMO 2026主席论坛公布赛沃替尼联合奥希替尼全球Ⅲ期SAFFRON研究，PFS与OS双重突破，数据同步发表于《新英格兰医学杂志》；今年9月阿斯利康已向FDA递交该联合疗法的新药上市申请。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=Mzg2OTY4MTEzMA==&mid=2247654911&idx=1&sn=9e88501838958f1b92e98970acca8586&chksm=cfa083e1d970b7b872f39f97cc41fff0181df4aa07f301575674d28057b5ecced6b65e11a347&scene=126&sessionid=1793282443#rd", "d": "2026-10-29", "hm": "08:02", "c": "opinion", "tg": ["观点/解读", "肿瘤", "ADC", "行业趋势"], "src": "医药魔方", "sc": 42.0, "sel": false, "fp": false, "ok": true}, {"t": "BMS中国总裁钱江当选PhRMA中国执委会主席，并入选《福布斯》2026最具影响力华人精英Top 100", "s": "百时美施贵宝（BMS）中国总裁钱江当选PhRMA中国执行委员会主席，任期两年，他表示将携手中国成员企业提升创新生物医药行业在中国的影响力。同时，钱江入选《福布斯》中国2026最具影响力华人精英Top 100，该榜单表彰其在推动产业创新、深化全球连接等方面的卓越影响力。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=Mzg2OTY4MTEzMA==&mid=2 书范本一并发布。相关药品上市许可持有人须于2027年7月26日前就修订说明书事项向省级药品监督管理部门备案，并通知相关医疗机构、药品经营企业等单位。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-29/1109677.shtml", "d": "2026-10-29", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "NMPA", "中药", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 36.0, "sel": false, "fp": true, "ok": true}, {"t": "洛克菲勒大学TrUDI三光子显微平台实现小鼠脑深部2 mm神经元活动成像", "s": "洛克菲勒大学Alipasha Vaziri团队开发出三光子超深成像平台TrUDI，在活体小鼠约2 mm深度的皮层与海马实现单细胞分辨率神经元群体活动记录，无需手术切除上层皮层。该系统在相同激光功率下检测到的荧光光子数约为既往方法的250倍，可在约230×230 µm²视野、8.6 Hz下成像。研究发表于Nature Methods，但纹状体部分区域及更深的脑核团仍需侵入性方法。", "r": null, "u": "https://www.genengnews.com/topics/translational-medicine/three-photon-microscopy-reveals-neural-activity-deep-in-the-mouse-brain/", "d": "2026-10-29", "hm": "06:17", "c": "research", "tg": ["论文/研究", "神经/精神"], "src": "GEN Genetic Engineering & Biotechnology News", "sc": 5.0, "sel": false, "fp": false, "ok": true}, {"t": "美众议员要求GAO审查TrumpRx平台700亿美元药品节省说法", "s": "美国众议院能源与商业委员会资深成员Frank Pallone致函政府问责局（GAO），要求审查TrumpRx平台是否真的为美国人节省了费用。白宫声称该平台自2月上线以来已帮助美国人节省7亿美元，但Pallone指出政府未披露关键信息，尤其是与20多家药企达成的最惠国协议细节，无法评估该平台是否带来实质性经济收益。TrumpRx本身不销售或调配药品，仅向消费者提供优惠券或折扣链接。", "r": null, "u": "https://www.statnews.com/pharmalot/2026/10/28/lawmaker-wants-gao-probe-trumprx-drug-pricing/?utm_campaign=rss", "d": "2026-10-29", "hm": "04:51", "c": "policy", "tg": ["政策/监管", "市场/销售"], "src": "STAT", "sc": 18.0, "sel": false, "fp": false, "ok": true}, {"t": "心脏如何借助MCT1依赖的线粒体乳酸输入维持强健", "s": "犹他大学团队在小鼠实验中发现，心脏可在细胞质中燃烧葡萄糖、同时在线粒体内氧化乳酸，这种空间分隔依赖MCT1将乳酸转运至线粒体内膜。遗传敲除MCT1会阻断线粒体乳酸氧化，削弱心脏对神经激素、血流动力学或缺血应激的适应，加速心力衰竭并增加死亡。该结果提示可靶向心肌乳酸利用以改善心衰和心梗后的心脏功能。", "r": null, "u": "https://www.genengnews.com/topics/translational-medicine/how-the-heart-stays-strong-with-mct1-dependent-mitochondrial-lactate-import/", "d": "2026-10-29", "hm": "04:42", "c": "research", "tg": ["论文/研究", "心血管"], "src": "GEN Genetic Engineering & Biotechnology News", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "人登革热I期攻毒试验揭示既往免疫如何塑造二次感染", "s": "一项纳入45名健康成人的I期登革热病毒人体攻毒试验显示，既往感染过0次、1次或多次DENV1-DENV4的受试者接种减毒DENV3活病毒后，二次感染导致更高的病毒血症、中和抗体和保护性T细胞应答。", "r": null, "u": "https://www.genengnews.com/topics/infectious-diseases/human-dengue-study-reveals-how-preexisting-immunity-shapes-secondary-infections/", "d": "2026-10-29", "hm": "02:00", "c": "research", "tg": ["论文/研究", "感染/疫苗"], "src": "GEN Genetic Engineering & Biotechnology News", "sc": 15.0, "sel": false, "fp": false, "ok": true}, {"t": "利默里克大学团队提出基于风险的数字验证工作流，弥合GMP与先进控制策略间的数字验证鸿沟", "s": "爱尔兰利默里克大学制药制造技术中心研究人员提出一套统一的、基于风险的数字验证工作流，将工艺理解与基于模型的设计同质量风险管理和生命周期验证原则相结合，以弥合GMP与先进控制策略之间的数字验证鸿沟。团队以pH调节的模型预测控制器为例，采用数据驱动的Hammerstein-Wiener模型整定控制器，并证明该控制器可在工业PLC环境中部署。研究者称该工作流为实用性概念验证，而非可直接部署的预验证方案。", "r": null, "u": "https://www.genengnews.com/topics/bioprocessing/crossing-the-digital-validation-chasm/", "d": "2026-10-29", "hm": "00:00", "c": "research", "tg": ["论文/研究", "AI 制药"], "src": "GEN Genetic Engineering & Biotechnology News", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "去中心化、AI与基因编辑为CGT合同制造商带来机遇", "s": "去中心化生产、AI工艺建模与基因编辑进展正在拓展细胞与基因治疗（CGT）的生产工具箱，并为第三方合同制造商创造机会。CGT行业约66%至90%的生产外包给CDMO，质量控制专长是主要外包驱动因素。Rose Biosolutions的Alan Smith与Jeff Mocny指出，CDMO可凭借生产与快速放行经验支持去中心化模式下的床旁生产，体内基因编辑与基因递送在早期研究中显现潜力。", "r": null, "u": "https://www.genengnews.com/topics/bioprocessing/decentralization-ai-and-gene-editing-are-opportunities-for-cgt-contractors/", "d": "2026-10-29", "hm": "00:00", "c": "opinion", "tg": ["观点/解读", "细胞与基因治疗", "CXO", "行业趋势"], "src": "GEN Genetic Engineering & Biotechnology News", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "综述：微生物暗物质能否重振抗生素研发", "s": "昆士兰大学Ahmed Hamed与Zeinab Khalil的综述指出，微生物暗物质（不可常规培养的微生物）及已知微生物中的沉默生物合成通路，可能编码未发现的天然产物。", "r": null, "u": "https://www.genengnews.com/topics/bioprocessing/microbial-dark-matter-could-revive-antibiotics/", "d": "2026-10-29", "hm": "00:00", "c": "research", "tg": ["论文/研究", "抗菌药物", "耐药与院感", "抗感染", "管线上新", "对市场"], "src": "GEN Genetic Engineering & Biotechnology News", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "恒瑞 harm"], "src": "赛柏蓝", "sc": 58.0, "sel": true, "fp": false, "ok": true}, {"t": "赛柏蓝统计：今年以来129位药企高管离职，副总经理离任最多", "s": "赛柏蓝统计显示，今年以来已有129位药企高管发生职位变动，涉及董事长、总裁、副总裁等职务，卸任副总经理的人数最多，其次为总经理、董事长。国资药企多为集团内部调配，如新华制药刘雪松卸任副总经理后转任鲁抗；老牌民营药企聚焦退休接班，创新药企则围绕研发与BD重新分工。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653668532&idx=1&sn=7af74099cef00a43cf5712eba4182d55&chksm=bc48e01550b27945cba926a11463264238b02eeac57bb480c72bd06f899878a2c0d6f336503d&scene=126&sessionid=1793202325#rd", "d": "2026-10-28", "hm": "20:15", "c": "industry", "tg": ["公司动态", "行业趋势", "恒瑞医药"], "src": "赛柏蓝", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "总局文件开复方保健食品备案试点，天麻新增保健食品企业买家", "s": "总局答复明确36种传统中药材进入复方配伍保健食品备案试点，天麻在列，符合条件的保健食品企业可按组方逻辑使用天麻。此类买家更看重能否全年稳定供货、批次检测报告是否齐全及原料可追溯，而非片型外观。已批准注册的保健食品中，含中药原料的占一半以上。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653668532&idx=6&sn=0c157ccd357d23333163362233145055&chksm=bcfc96d4b947f7022e8027d8473445e95661aea4fa498f4f1339435966c5a64abe965680bbbe&scene=126&sessionid=1793202325#rd", "d": "2026-10-28", "hm": "20:15", "c": "policy", "tg": ["政策/监管", "中药"], "src": "赛柏蓝", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "美国药物过量死亡人数下降的真正原因是什么？", "s": "美国2024年药物过量死亡人数下降27%，2025年初步数据进一步下降，HHS发布新闻稿将下降归功于两届特朗普政府并引用其内部官员撰写的两份报告。流行病学家Nabarun Dasgupta指出，下降始于数年前，多州在新冠疫情期间达峰，毒品供应变化、用药者行为转变及公共卫生与减害干预均可能起作用，专家认为关闭边境并未真正起作用。", "r": null, "u": "https://www.statnews.com/2026/10/28/health-news-why-are-overdose-deaths-declining/?utm_campaign=rss", "d": "2026-10-28", "hm": "20:01", "c": "opinion", "tg": ["观点/解读", "安全/质量", "细胞与基因治疗", "自免"], "src": "STAT", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "6家医院124万份病历对比：AI感控预警系统使院感发生率降近三分之一", "s": "上海市徐汇区中心医院联合6家三级医院开展多中心对照研究，3家使用AI感染实时监测与预警系统、3家采用传统人工监测，两年共纳入124万份住院患者数据。结果显示，AI系统组医院感染发生率下降近三分之一，多耐药发生率明显下降，聚集性事件预警排查由约3天缩短至约1天。该系统与HIS、LIS对接，可提醒医生护士及时防控，二级和基层医院同样具备应用可能。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MzAxNDYzMDM4MA==&mid=2650200251&idx=1&sn=05acd6acac4bb40aee272f25c4a83b74&chksm=8248808896229f26dde03b3950cf7829aa571b89aae31814f172d82730caec1f8fbdc4ad6440&scene=126&sessionid=1793202279#rd", "d": "2026-10-28", "hm": "19:50", "c": "research", "tg": ["论文/研究", "耐药与院感", "抗感染", "循证指南", "对市场", "对数字化"], "src": "SIFIC 感染视界", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "詹庆元教授等：重症肺炎所致ARDS病死率高达56.2%，高度异质性下如何精准个体化评估？", "s": "重症肺炎所致ARDS国内病死率高达56.2%，因病原体、炎症免疫状态、遗传与共病等因素呈现高度异质性。詹庆元教授等从呼吸生理功能（气体交换、呼吸力学、呼吸驱动与吸气努力）、肺组织形态学（胸部CT、LUS、EIT及肺泡可复张性）和炎症免疫状态与生物学亚型三个层面梳理精准个体化评估路径。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MzU3NjA5MTM2OQ==&mid=2247604092&idx=2&sn=9c62d1716f4e0e4d56fc9fcb964f0803&chksm=fcaffa3d1c5681d4efc8cbb04fc1ecf6ad55e80885719b7988dbb47283bc8a676061124caa4d&scene=126&sessionid=1793627912#rd", "d": "2026-10-28", "hm": "19:28", "c": "research", "tg": ["论文/研究", "呼吸", "感染/疫苗"], "src": "呼吸界", "sc": 18.0, "sel": false, "fp": false, "ok": true}, {"t": "流感、新冠核酸均阴性仍不能排除病毒性肺炎：40岁女性高热黄痰、CRP 125.6 mg/L、双肺斑片影，mNGS检出人偏肺病毒", "s": "40岁女性高热咳嗽咳黄痰4天，甲型流感、乙型流感及新冠病毒核酸均阴性，CRP 125.6 mg/L、PCT 0.03 ng/mL，胸部CT示双肺多发斑片灶，经验性抗细菌治疗无好转。支气管肺泡灌洗液DNA+RNA mNGS检出大量人偏肺病毒核酸序列（28576条），最终诊断人偏肺病毒肺炎。人偏肺病毒感染尚无特异性抗病毒治疗，以支持治疗为主，检出病毒后仍需复评经验性抗菌用药的必要性。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MzU3NjA5MTM2OQ==&mid=2247604092&idx=1&sn=663f1b08a9d28d4cb1a3ec67bd28eddb&chksm=fcaa2c983770a402ef2b632f7b104aeb6b7f618ad91988d78a7a1dcb72c4ee44d54e3e133924&scene=126&sessionid=1793627912#rd", "d": "2026-10-28", "hm": "19:28", "c": "clinical", "tg": ["临床进展", "感染/疫苗", "呼吸", "耐药与院感", "抗感染", "循证指南", "对销售"], "src": "呼吸界", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "破谣 | 慢阻肺病患者不能吹气球，但可以吹口琴和笛子？", "s": "中日友好医院呼吸中心物理治疗师王思远指出，慢阻肺病患者不适合把吹气球作为锻炼方式，因高阻力呼气易致过度疲劳、加重呼吸困难，还可能使肺泡过度膨胀、增加肺气肿和气胸风险。吹口琴或笛子不会像吹气球那样给气道施加很大压力，可增强呼吸肌肉力量和耐力、帮助控制呼吸，并缓解焦虑紧张情绪。开始吹奏前最好先咨询医生建议，过程中注意呼吸控制，出现不适立即停止并及时就医。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MzU3NjA5MTM2OQ==&mid=2247604092&idx=3&sn=5170999b99f14bccefdfe9aea5cfab31&chksm=fc64f16f7834c2a85bf18d36d3e952d75b016e36ae7d9ca7879b068867e45c3fe5efb9839133&scene=126&sessionid=1793719798#rd", "d": "2026-10-28", "hm": "19:28", "c": "opinion", "tg": ["观点/解读", "呼吸"], "src": "呼吸界", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "礼来称\"三重G\"药物retatrutide在糖尿病研究中优于诺和诺德Ozempic", "s": "礼来周三公布，其在研药物retatrutide在一项大型糖尿病头对头研究中，降糖与减重效果均优于诺和诺德Ozempic。最高剂量组治疗80周后A1c降低2.2个百分点，Ozempic组降低1.8个百分点；retatrutide组体重下降20.9%，Ozempic组为9.4%。上述结果基于仅分析持续用药参与者的数据。", "r": null, "u": "https://www.statnews.com/2026/10/28/retatrutide-vs-ozempic-lilly-diabetes-study/?utm_campaign=rss", "d": "2026-10-28", "hm": "18:45", "c": "clinical", "tg": ["临床进展", "代谢/减重", "礼来", "诺和诺德", "GLP-1", "entity:lilly", "entity:novonordisk"], "src": "STAT", "sc": 43.0, "sel": false, "fp": false, "ok": true}, {"t": "石藥集團｜石藥創新製藥股份有限公司截至2026 年9 月30日止九個月之未經審核財務資料", "s": "", "r": null, "u": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/1028/2026102800857_c.pdf", "d": "2026-10-28", "hm": "18:23", "c": "industry", "tg": ["公司动态", "石药集团", "entity:cspc"], "src": "石药集团·港交所公告", "sc": 42.0, "sel": false, "fp": true, "ok": true}, {"t": "石药集团 SYS6077 注射液治疗晚期恶性肿瘤 I 期临床试验在中国首家研究中心启动", "s": "石药集团宣布，SYS6077 注射液用于治疗晚期恶性肿瘤的 I 期临床试验已在中国首家研究中心正式启动。该公告为港交所自愿公告，披露业务发展最新情况。", "r": null, "u": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/1028/2026102800853_c.pdf", "d": "2026-10-28", "hm": "18:22", "c": "clinical", "tg": ["临床进展", "肿瘤", "石药集团", "entity:cspc"], "src": "石药集团·港交所公告", "sc": 12.0, "sel": false, "fp": true, "ok": true}, {"t": "从波士顿到北京、上海：拜耳全球首席商业运营官谷思远谈全球创新坐标", "s": "拜耳处方药事业部全球首席商业运营官谷思远表示，中国是其近期出差到访最多的国家，拜耳正从“Global for China”走向“China for China”，再奔赴“China for Global”。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=Mzg2OTY4MTEzMA==&mid=2247654909&idx=1&sn=5914d8a12a6b7f27ef183d0517e056a3&chksm=cfe6f429e1fc5e4c53f3fa4bec63654820e145542e6c30897284a77561c4bf9fc883ae006559&scene=126&sessionid=1793202325#rd", "d": "2026-10-28", "hm": "17:49", "c": "opinion", "tg": ["观点/解读", "行业趋势", "肿瘤", "细胞与基因治疗", "拜耳", "entity:bayer"], "s  "安徽省医保局10月28日发布《关于明确药品挂网与医保结算联动有关事项的通知（征求意见稿）》，拟自2027年1月1日起对定点医疗机构采购的未挂网药品费用原则上不予医保结算，撤网药品给1个月过渡期，意见征集截止11月10日。", "r": "安徽拟将挂网与医保结算绑定，文中对比江苏、河北的执行节奏与覆盖范围差异，可看清各省准入收紧的推进路径。", "u": "https://mp.weixin.qq.com/s?__biz=MjM5NDEwMDQ2Mg==&mid=2658699395&idx=1&sn=e73eaf0e5c9063d11153b2f78c85a1fa&chksm=bc85d57267dcd99b7283433eea43e35f7e771505b0cea413385596b390dadb5adaaae4c70a75&scene=126&sessionid=1793627945#rd", "d": "2026-10-28", "hm": "16:45", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "抗感染", "市场准入", "entity:nhsa"], "src": "医药云端工作室", "sc": 72.0, "sel": true, "fp": false, "ok": true}, {"t": "STAT调查：Epic 主导地位扩大，其铁腕正扼杀健康技术创新", "s": "STAT调查发现，美国最大电子健康记录（EHR）厂商 Epic 选择性限制数据接口访问，使竞争对手软件工具处于劣势、自家产品不受挑战。12家被 Epic 应用市场展示的公司高管称，Epic 通过拒绝提供关键数据接口与技术规格、散布产品负面传言或收取高额访问费打压其业务。Epic 年收入超 65 亿美元，掌握约八成美国人的数据。", "r": null, "u": "https://www.statnews.com/2026/10/28/epic-systems-ehr-dominance-health-tech-antitrust-scrutiny/?utm_campaign=rss", "d": "2026-10-28", "hm": "16:30", "c": "industry", "tg": ["公司动态", "医疗器械/IVD", "行业趋势"], "src": "STAT", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "你是否受到过 Epic 行为的影响？", "s": "Epic 是美国最大的电子健康记录供应商，其数据系统被多数大型医疗系统使用，覆盖约八成美国人的健康信息。随着其市场主导地位上升，有投诉称该公司的做法使医院难以部署非 Epic 的技术工具。STAT 希望向有直接了解的人士征集有关 Epic 商业行为及其对医院技术选择与创新影响的线索。", "r": null, "u": "https://www.statnews.com/2026/10/28/epic-systems-electronic-health-records-reader-callout/?utm_campaign=rss", "d": "2026-10-28", "hm": "16:30", "c": null, "tg": ["其他"], "src": "STAT", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "儿科医生如何帮助家庭在麻疹疫情中保持冷静与知情", "s": "美国宾夕法尼亚州一名初级保健儿科医生撰文介绍，当地麻疹报告病例已超过1300例，其中33%为儿童，儿科医生正帮助家庭在疫情中保持冷静并获取准确信息。文章援引CDC数据说明麻疹住院风险为1/5、死亡风险为1-3/1000，并提及耳部感染（1/10）、腹泻（1/10）、肺炎（1/20）和脑肿胀（1/1000）等并发症。", "r": null, "u": "https://www.statnews.com/2026/10/28/measles-parents-panic-pennsylvania-vaccines-education/?utm_campaign=rss", "d": "2026-10-28", "hm": "16:30", "c": "opinion", "tg": ["观点/解读", "感染/疫苗"], "src": "STAT", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "观点： 等高频业务，点击可跳转对应专属办理指南。", "r": null, "u": "http://www.nhsa.gov.cn/art/2026/10/19/art_14_23151.html", "d": "2026-10-28", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "entity:nhsa"], "src": "国家医保局", "sc": 8.0, "sel": false, "fp": true, "ok": true}, {"t": "山东大学齐鲁医院医保码实现全院一码通用，结算提速至秒级", "s": "山东大学齐鲁医院打通医院管理、医保、银行交易等系统，推动医保码覆盖挂号、就诊、结算全流程，实现\"一码通用\"。医院将门诊慢特病病种知识库和3万余条医保支付范围规则嵌入系统，结算时自动完成合规校验，单次结算时间从数分钟压缩到秒级，住院患者床旁结算率超过90%。", "r": null, "u": "http://www.nhsa.gov.cn/art/2026/9/28/art_14_22381.html", "d": "2026-10-28", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "entity:nhsa"], "src": "国家医保局", "sc": 12.0, "sel": false, "fp": true, "ok": true}, {"t": "Quantoom Biosciences 正式进入中国市场：N-Force 平台覆盖 mRNA/saRNA 从序列设计到 RNA-LNP 制剂全工艺链", "s": "Quantoom Biosciences 正式进入中国市场，以 N-Force 统一 RNA 平台提供 Ncode 序列设计、Ntensify® RNA 生产与 Ncapsulate® LNP 制剂的全工艺链，覆盖微克级研发到商业化 GMP 生产。", "r": null, "u": "https://news.bioon.com/article/2eb4960e6701.html", "d": "2026-10-28", "hm": "08:00", "c": "industry", "tg": ["公司动态", "核酸药物"], "src": "生物谷", "sc": 15.0, "sel": false, "fp": false, "ok": true}, {"t": "Cell子刊：武汉大学张军杰/钟波发现释放HK2的小肽HK-TAT或可缓解STING介导的自身免疫病", "s": "武汉大学张军杰、钟波团队在Cell Reports发表研究，发现糖酵解限速酶HK2可不依赖酶活性抑制STING介导的固有免疫：STING激活后ROS促使HK2从线粒体转位至胞质，与STING结合阻碍其寡聚化及向高尔基体转运。", "r": null, "u": "https://news.bioon.com/article/44a9960404f1.html", "d": "2026-10-28", "hm": "08:00", "c": "research", "tg": ["论文/研究", "自免", "小分子"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "烟台市医保局用激光雷达与北斗+GPS电子工牌赋能长护险监管", "s": "烟台市医保局将激光雷达、北斗+GPS双模电子工牌等技术融入长护险失能等级评估与护理服务经办全流程，以严控基金运行风险。全市定点长护服务机构169家，已累计为1.98万名参保失能人员提供专业化护理保障；激光雷达对存疑评估对象实施3至7天无接触式三维数据采集，电子工牌定位精度≤10米，参保人双重人脸识别核验成功率稳定在84%以上。", "r": null, "u": "http://www.nhsa.gov.cn/art/2026/9/25/art_14_22357.html", "d": "2026-10-28", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "entity:nhsa"], "src": "国家医保局", "sc": 10.0, "sel": false, "fp": true, "ok": true}, {"t": "Dev Cell：隋鹏飞/李锋/何文新合作揭示间皮细胞可塑性调控肺再生与纤维化中的机械稳态", "s": "中国科学院分子细胞科学卓越创新中心隋鹏飞、上海市胸科医院李锋与上海市肺科医院何文新共同通讯在Developmental Cell发表研究，揭示肺间皮细胞通过YAP激活进入短暂的成纤维细胞样状态（F-LMC），重塑胸膜细胞外基质以维持再生中的机械稳态。", "r": null, "u": "https://news.bioon.com/article/daec960401e9.html", "d": "2026-10-28", "hm": "08:00", "c": "research", "tg": ["论文/研究", "呼吸", "细胞与基因治疗"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "复旦团队CAFE-MPP框架：子结构预训练提升AI分子性质预测，11套数据集中7项最优", "s": "复旦大学研究团队开发CAFE-MPP框架，基于化学规则拆分分子片段并构建片段分子图，通过硬负样本对比学习预训练后依托Graphormer预测分子性质。在MoleculeNet的11套基准数据集上，该方案在7个数据集取得最优性能、3个位列第二，仅含642个分子的FreeSolv数据集提升尤为显著。该片段级预训练可缓解图神经网络过平滑问题，模型表征与拓扑极性表面积、脂水分配系数等经典描述符显著相关。", "r": null, "u": "https://news.bioon.com/article/c2b496056185.html", "d": "2026-10-28", "hm": "08:00", "c": "research", "tg": ["论文/研究", "小分子"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "彭传会/吴健/郑树森合作在GUT发表研究：WTAP经m⁶A-IGF2BP1调控FXR抵抗胆汁淤积性肝损伤", "s": "浙江大学彭传会、吴健、郑树森团队在GUT发表研究，揭示胆汁淤积时胆汁酸经STAT3上调肝细胞WTAP，WTAP通过m⁶A修饰FXR mRNA并招募阅读器IGF2BP1增强FXR稳定性，维持胆汁酸稳态。肝特异性WTAP缺失会降低FXR、加重胆汁酸蓄积与肝损伤，过表达WTAP或恢复FXR/使用FXR激动剂可缓解损伤；WTAP缺陷还伴MAPK通路过度激活。", "r": null, "u": "https://news.bioon.com/article/49f49603e1e3.html", "d": "2026-10-28", "hm": "08:00", "c": "research", "tg": ["论文/研究", "代谢/减重"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "湖南省医保局公示部分医疗机构美容整形类医疗服务项目市场调节价备案", "s": "湖南省医保局对接国家医保局美容整形类医疗服务价格项目立项指南，统一规范美容整形项目并公示长沙市部、省属医疗机构备案价格及执业许可证载明的医疗美容整形诊疗科目。美容整形医疗服务不属于基本医疗服务，实行市场调节价管理，不纳入医保支付范围，由具备相应资质的医疗机构自主合理定价并按规定备案、向社会公开。", "r": null, "u": "http://www.nhsa.gov.cn/art/2026/9/27/art_14_22362.html", "d": "2026-10-28", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "国家医保局", "entity:nhsa"], "src": "国家医保局", "sc": 12.0, "sel": false, "fp": true, "ok": true}, {"t": "Lancet Oncology：华中科技大学张涛团队发表UNION Ⅲ期中期分析，短程放疗后卡瑞利珠单抗联合CAPOX改善局部晚期直肠癌EFS", "s": "华中科技大学张涛团队在The Lancet Oncology发表UNION Ⅲ期试验预设中期分析，局部晚期直肠癌患者接受短程放疗后卡瑞利珠单抗联合CAPOX，3年无事件生存率为91.3%，优于标准长程放化疗后CAPOX的77.4%（HR 0.33）。3年总生存率96.3% vs 89.8%，无病生存率亦更优，安全性相似，≥3级不良事件以可逆性血液学毒性为主。", "r": null, alse, "fp": false, "ok": true}, {"t": "中国流感监测周报第932期：第43周报告145起流感样病例暴发疫情", "s": "截至2026年10月25日的一周，南方省份流感病毒检测阳性率略有下降、北方省份略有上升，全国共报告145起流感样病例暴发疫情。全国检出阳性样本中甲型占67.6%、乙型占32.4%，甲型中A(H3N2)占67.2%、A(H1N1)pdm09占32.8%，乙型均为B（Victoria）系。", "r": "周报给出南北阳性率分化、暴发疫情数与毒株耐药比例，可用于判断当季流感用药与疫苗匹配情况。", "u": "https://www.chinacdc.cn/jksj/jksj04_14249/202610/t20261028_1842545.html", "d": "2026-10-28", "hm": "08:00", "c": "research", "tg": ["论文/研究", "感染/疫苗"], "src": "中国疾控·流感监测周报", "sc": 47.0, "sel": true, "fp": true, "ok": true}, {"t": "Neuron：倪金飞/戴薇/段树民等揭示迷走肠-脑轴调控进食诱导胃分泌", "s": "倪金飞、戴薇、Li Kai共同通讯在Neuron发表小鼠研究，定义了一条介导进食诱导胃分泌的迷走神经肠-脑-肠回路。支配胃的迷走传入神经对分泌必要且充分，其中Glp1r⁺和Sst⁺神经元驱动酸、胃蛋白酶和胃泌素分泌，Piezo2条件性敲除减弱扩张诱发的分泌。传出支Cck⁺神经元广泛增加酸、胃蛋白酶和胃泌素，Grp⁺神经元优先影响酸分泌。", "r": null, "u": "https://news.bioon.com/article/1e55960248e8.html", "d": "2026-10-28", "hm": "08:00", "c": "research", "tg": ["论文/研究", "神经/精神"], "src": "生物谷", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "上海阳光医药采购网公示2026年8月部分短缺药全国平均价", "s": "上海市医药集中招标采购事务管理所公示2026年8月部分短缺药全国平均价，要求各医疗机构根据市场供需情况，在保供稳价基础上采购质量可靠、价格适宜的药品。此次公示依据国家医保局相关文件及国办发〔2019〕47号文精神开展。", "r": null, "u": "https://www.smpaa.cn/xxgk/gggs/2026/10/28/25533.shtml", "d": "2026-10-28", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "entity:nhsa"], "src": "上海阳光医药采购网（国家集采）", "sc": 42.0, "sel": false, "fp": true, "ok": true}, {"t": "新荷花通过港交所主板上市聆讯，广发证券、农银国际联席保荐", "s": "四川新荷花中药饮片股份有限公司通过港交所主板上市聆讯，广发证券、农银国际担任联席保荐人。按2025年中药饮片产品收入计，新荷花在中国排名第2位，市场份额0.4%，前五大参与者合计持有2.7%。公司2023年度、2024年度、2025年度收入分别约11.46亿元、12.49亿元、13.35亿元。", "r": null, "u": "https://www.menet.com.cn/info/202610/202610280922292229_151354.shtml", "d": "2026-10-28", "hm": "08:00", "c": "industry", "tg": ["公司动态", "中药"], "src": "米内网·企业", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "首届嘉会国际细胞治疗高峰论坛举办，嘉会国际细胞治疗中心正式揭牌", "s": "首届嘉会国际细胞治疗高峰论坛于10月23日举行，嘉会国际细胞治疗中心同期正式揭牌。中心将立足中国境内已获批上市的细胞治疗方案，依托多学科平台提供从患者评估、细胞采集、会输管理到治疗后随访的全流程服务。2026年6月全球首款实体瘤CAR-T药物在上海获批上市后，嘉会成为首批开展相关临床应用的医疗机构之一。", "r": null, "u": "https://ne t": "奇正藏药红花如意丸、六味能消胶囊独家/医保品种全国招商", "s": "奇正藏药面向全国招募红花如意丸与六味能消胶囊的各级医疗终端渠道伙伴，提供全国总代理与省级代理两种合作模式。红花如意丸为独家品种、国家医保品种，功能主治为祛风镇痛、调经血、祛斑；六味能消胶囊为国家二级中药保护品种、全国独家剂型、国家医保乙类，功能为宽中理气、润肠通便、调节血脂。合作配套合规资质、区域保护、学术支持与物料物流扶持。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653668434&idx=6&sn=9aefb43a13cc7b365c7b4028ba7248bb&chksm=bcf9c6a3b02ad824dd6556cbaad80164c3b6c20aeb9d83b8fcb36f9c30100eb5736cfe35e1c6&scene=126&sessionid=1793108417#rd", "d": "2026-10-27", "hm": "20:15", "c": "industry", "tg": ["公司动态", "中药", "市场/销售"], "src": "赛柏蓝", "sc": 15.0, "sel": false, "fp": false, "ok": true}, {"t": "药企线上营销为何白花钱？蓝亭叙2026第15届医药健康互联网大会拆解打法", "s": "赛柏蓝将于11月28-29日在杭州召开蓝亭叙2026-第15届医药健康互联网大会，聚焦药企线上营销“看着热闹却不赚钱”的问题。大会覆盖政策形势与行业洞察、AI时代医药互联网新生态与品类机会，以及B2C、O2O全渠道搭建、全域营销、抖音京东小红书新玩法、私域与复购一体化经营、电商合规与降本增效等关键环节。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653668434&idx=7&sn=7fcacb78bad16cfd284761cb066bee8c&chksm=bc4a85171d70a811a5ed9df2cbbeca02c06128049610d07f38c031bde50f2a9d05ef8770f0de&scene=126&sessionid=1793108417#rd", "d": "2026-10-27", "hm": "20:15", "c": "industry", "tg": ["其他", "行业趋势"], "src": "赛柏蓝", "sc": 10.0, "sel": false, "fp": false, "ok": true}, {"t": "梯瓦奥氮平长效注射剂Weltruza获FDA批准，全球首款每月一次皮下注射治疗精神分裂症", "s": "梯瓦制药的奥氮平长效注射剂Weltruza获FDA批准，用于治疗成人精神分裂症，成为全球首款每月一次皮下注射的奥氮平长效制剂。获批基于Ⅲ期SOLARIS研究，该研究纳入675名患者，治疗8周后高、中、低三个剂量组PANSS总分改善幅度均显著优于安慰剂组，组间差异分别为9.71分、11.27分和9.71分，达到主要终点。该剂型无需常规注射后留观，有望降低医疗机构给药管理负担。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653668434&idx=4&sn=eb23f36866d72a98e00f512756aa79d1&chksm=bc839ae2dd65f0f4408e3e0055d0214350790f498932d49b3c579fe72fe8b0a5c9969e80f7f2&scene=126&sessionid=1793108380#rd", "d": "2026-10-27", "hm": "20:15", "c": "approval", "tg": ["获批上市", "神经/精神", "FDA", "行业趋势", "entity:fda"], "src": "赛柏蓝", "sc": 40.0, "sel": false, "fp": false, "ok": true}, {"t": "石药系总投资12亿元的三级肿瘤医院石家庄爱迪森肿瘤医院执业登记前公示", "s": "石家庄市行政审批局公示石家庄爱迪森肿瘤医院执业登记前信息，这家总投资12亿元的三级营利性肿瘤医院设置床位400张，由石药恩必普持股64%的合资公司间接控股。医院已启动肿瘤内科医生等岗位招聘，后续有望与石药集团抗肿瘤、心血管等成药业务形成协同。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653668434&idx=2&sn=fa1b36d3c52bb0f351c2e035390e3302&chksm=bc451d2a1ba455d91f18ed49d96f357ad970aae2230d6a4af0656d572326339deaeea97a221c&scene=126&sessionid=1793108380#rd", "d": "2026-10-27", "hm": "20:15", "c": "industry", "tg": ["公司动态", "肿瘤", "医疗器械/IVD", "石药集团", "华润医药", "复星医药", "entity:cspc", "entity:crpharma", "entity:fosun"], "src": "赛柏蓝", "sc": 42.0, "sel": false, "fp": false, "ok": true}, {"t": "多家大三甲细化医药代表进院接待规则，备案代表约11.6万人", "s": "牡丹江医科大学附属红旗医院、江苏省人民医院宿迁医院、南宁市第三人民医院等多家医院细化医药代表接待要求，规定统一接待日、指定接待室、双人在场，接待结束后须直接离开、不得在其他区域逗留，常规单次接待含学术交流不超过120分钟，非接待时间或诊疗区域私下拜访即属违规，严重违规者列入永久黑名单。", "r": "多家医院细化医药代表接待规则，叠加管理办法对学历与考核的要求，呈现代表工作方式正在被改变的具体约束。", "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653668434&idx=1&sn=c30d6aa3f95152a3815a4922a2cdf190&chksm=bcd8a3a1ca6c01574b8c676a04be41dca14c95951c494af4ee438ca4ac37756a7bc2d756284a&scene=126&sessionid=1793108380#rd", "d": "2026-10-27", "hm": "20:15", "c": "policy", "tg": ["政策/监管", "其他"], "src": "赛柏蓝", "sc": 63.0, "sel": true, "fp": false, "ok": true}, {"t": "恒瑞医药2026年三季度营收89.53亿元同比增20.55%，净利24.58亿元同比增88.92%", "s": "恒瑞医药发布2026年第三季度报告，单季营业收入89.53亿元、同比增长20.55%，归母净利润24.58亿元、同比增长88.92%；前三季度营收244.09亿元、同比增长5.26%，归母净利润69.23亿元、同比增长20.38%。", "r": "恒瑞三季报把创新药收入占比、非肿瘤产品增速和对外许可确认收入放在一起，可看出收入结构变化的实际幅度。", "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653668434&idx=3&sn=9e47e5bad2ceb1020c62cce2451c142d&chksm=bc4c0713361648bf44be2f9f4341dc65b9c975a149e1e678cd7db62f935bb983d164c70f5e6b&scene=126&sessionid=1793108380#rd", "d": "2026-10-27", "hm": "20:15", "c": "industry", "tg": ["公司动态", "恒瑞医药", "肿瘤", "代谢/减重", "GLP-1", "ADC", "交易/授权", "研发管线", "GSK", "BMS", "诺和诺德", "entity:hengrui", "entity:gsk", "entity:bms", "entity:novonordisk"], "src": "赛柏蓝", "sc": 75.0, "sel": true, "fp": false, "ok": true}, {"t": "大感控·大家谈 第05期丨俞云松：看清耐药菌传播轨迹，把诊断、治疗与防控连起来", "s": "浙江大学医学院附属邵逸夫医院俞云松教授在“大感控·大家谈”第05期访谈中提出，感染诊疗与感控应作为整体推进，并以碳青霉烯耐药肺炎克雷伯菌基因组分析、家庭环境  "观点：美国儿科急诊已进入永久危机状态", "s": "美国儿科急诊容量持续崩溃，2022年“三重疫情”期间加州一名婴儿因找不到儿科ICU床位在转诊途中死亡。2026年这种拥挤已成常态，社区医院因儿科业务亏损而纷纷削减儿科服务，常见病患儿也被迫转诊。作者呼吁提高Medicaid儿科支付、将区域转诊协调中心（RMOCC）纳入灾害规划并给予资金支持，以及支持儿童医院向基层提供远程会诊与培训。", "r": null, "u": "https://www.statnews.com/2026/10/27/pediatric-emergency-care-rural-hospital-closures/?utm_campaign=rss", "d": "2026-10-27", "hm": "16:30", "c": "opinion", "tg": ["观点/解读", "政策/监管"], "src": "STAT", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "宾夕法尼亚荷兰乡村等不及生物制药企业，自建药物公司", "s": "宾夕法尼亚州兰开斯特的Mennonite社区MSUD高发，研究者Kevin Strauss用携带新基因的病毒治疗患MSUD的犊牛Petunia并获得成功，该牛现已5岁、体重1500磅。但迄今Strauss的患者中无一人接受过这项基因治疗，甚至未进入临床试验。当地因等待生物制药企业无果而自建药物公司。", "r": null, "u": "https://www.statnews.com/2026/10/27/gene-therapy-cow-rare-disease-amish-mennonite-patients-waiting/?utm_campaign=rss", "d": "2026-10-27", "hm": "16:30", "c": "industry", "tg": ["其他", "罕见病", "细胞与基因治疗"], "src": "STAT", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "观点：癌症疫苗终于来了，如何让患者用上？——intismeran autogene III 期降低复发或死亡风险 42%", "s": "III 期研究显示，癌症疫苗 intismeran autogene 联合方案较 pembrolizumab（Keytruda）单药降低复发或死亡风险 42%，成为首个在肿瘤领域达到 III 期终点的新抗原 mRNA 疗法。", "r": null, "u": "https://www.statnews.com/2026/10/27/cancer-vaccines-intismeran-autogene-esmo-results-delivery-access/?utm_campaign=rss", "d": "2026-10-27", "hm": "16:30", "c": "opinion", "tg": ["观点/解读", "肿瘤", "感染/疫苗", "核酸药物"], "src": "STAT", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "振东制药总裁王锐离职，实控人之子李昆兼任总裁", "s": "振东制药10月27日公告，王锐因个人原因辞去总裁职务且不再担任公司任何职务，董事长李昆兼任总裁，任期至2027年9月10日。李昆为实控人李安平之子，1990年11月出生，曾任电商总经理、营销总经理、副总裁，2024年出任董事长。公司主要产品包括复方苦参注射液、米诺地尔搽剂等，2025年线上销售收入同比增长43.88%，线下下降10.70%。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MjM5NTA4Mzc2Mg==&mid=2653668324&idx=1&sn=dc2382524298d1be42417b1d520f57f2&chksm=bced3a64d801d94766268eca66eb3fb7fa7a926565b7d23abec4dd831c99d72b6f4e82c746e9&scene=126&sessionid=1793108417#rd", "d": "2026-10-27", "hm": "13:57", "c": "industry", "tg": ["公司动态", "其他"], "src": "赛柏蓝", "sc": 22.0, "sel": false, "f
