内首创ABI产品。湖北新聘任317名省级医疗器械注册审评专家，聘期5年。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-27/1109506.shtml", "d": "2026-10-27", "hm": "08:00", "c": "industry", "tg": ["行业趋势", "医疗器械/IVD", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 18.0, "sel": false, "fp": true, "ok": true}, {"t": "Chem Soc Rev综述：昆士兰大学团队提出肽基硬组织修复“从序列到系统”框架", "s": "澳大利亚昆士兰大学Sašo Ivanovski与Yinghong Zhou团队联合昆士兰科技大学Tim R. Dargaville，在Chemical Society Reviews 2026年55卷17期提出肽基硬组织再生的sequence-to-system框架，强调肽的价值取决于材料整合后功能能否保留。", "r": null, "u": "https://news.bioon.com/article/09db96005443.html", "d": "2026-10-27", "hm": "08:00", "c": "research", "tg": ["论文/研究", "其他"], "src": "生物谷", "sc": 14.0, "sel": false, "fp": false, "ok": true}, {"t": "Materials & Design：南方医科大学口腔医院李勤/贾搏团队揭示高改性HA水凝胶HM-HA的衰老皮肤再生潜力", "s": "南方医科大学口腔医院李勤/贾搏团队在Materials & Design发表研究，构建高改性单相透明质酸水凝胶HM-HA，经BDDE改性与均质处理形成连续均一单相网络，不额外引入蛋白质、抗氧化剂或药物等活性成分。该材料兼具较高化学改性程度、较低储能模量和短期结构保持能力，在动物实验中促进衰老皮肤胶原、毛囊及血管再生，并减轻氧化应激和细胞衰老，伴随线粒体生物能量与氧化还原状态改善。", "r": null, "u": "https://news.bioon.com/article/6fda9601427d.html", "d": "2026-10-27", "hm": "08:00", "c": "research", "tg": ["论文/研究", "医疗器械/IVD"], "src": "生物谷", "sc": 18.0, "sel": false, "fp": false, "ok": true}, {"t": "分子之心MMDesign半年三次迭代：19个项目成功率94.7%，GPCR靶点全部命中", "s": "分子之心发布AI从头设计平台MMDesign最新技术报告，在覆盖18个靶点、纳米抗体与大环肽两类模态的19个项目中，18个获得经确认的结合分子，项目成功率94.7%，单项目仅测试9—50个候选。六个GPCR靶点全部成功，NK3R的30个候选全部命中，GPR68最优KD低至12.1纳摩尔。跨轮次设计中PDGFR命中率由4.0%升至21.1%，最佳KD由150纳摩尔优化至37纳摩尔。", "r": null, "u": "https://news.bioon.com/article/94bb9605e91a.html", "d": "2026-10-27", "hm": "08:00", "c": "clinical", "tg": ["临床进展", "论文/研究"], "src": "生物谷", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "Cell Stem Cell：余佳/马艳妮合作揭示Rbpms凝聚体对造血干细胞翻译延伸的空间管控", "s": "中国医学科学院基础医学研究所余佳、马艳妮团队在Cell Stem Cell发表研究，揭示Rbpms凝聚体通过隔离翻译延伸因子与蛋白质折叠伴侣，减缓造血干细胞翻译延伸并确保蛋白正确折叠。Rbpms缺失导致蛋白合成加速、错误折叠蛋白积累、长期造血重建能力受损及静息状态异常退出。", "r": null, "u": "https://news.bioon.com/article/a2f0960056fa.html", "d": "2026-10-27", "hm": "08:00", "c": "research", "tg": ["论文/研究", "血液", "细胞与基因治疗"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "《Nature》研究揭示WEE1抑制剂毒性来源与耐药机制：WEE1通过磷酸化CDH1促进G0期细胞进入S期", "s": "伦敦帝国理工学院Alexis R. Barr团队在《Nature》发表研究，揭示WEE1通过磷酸化CDH1抑制APC/CCDH1活性，促进细胞从G0期重新进入S期，这解释了WEE1抑制剂对TP53野生型肿瘤有效及正常组织毒性大的原因。", "r": null, "u": "https://news.bioon.com/article/6075960141d4.html", "d": "2026-10-27", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤", "小分子"], "src": "生物谷", "sc": 20.0, "sel": false, "fp": false, "ok": true}, {"t": "维A醇纳米结构脂质载体透皮量达游离维A醇4.5倍，刺激性大幅降低", "s": "研究优化固液脂质6:4配比制备维A醇纳米结构脂质载体，粒径约200纳米，体外模拟皮肤渗透中维A醇回收量达游离维A醇的4.5倍。该体系在4℃、25℃存放12周无颗粒团聚，抗氧化效果优于游离维A醇、纳米乳和固体脂质纳米粒。复配乳膏在45℃、70%相对湿度加速储存30周后乳化体系完好，抗氧化活性保留。", "r": null, "u": "https://news.bioon.com/article/d2529554605a.html", "d": "2026-10-27", "hm": "08:00", "c": "research", "tg": ["论文/研究", "小分子"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "复旦大学黄荷凤/杨红波团队揭示NNMT通过H3K27me3-RARB轴驱动PMOS高雄激素", "s": "复旦大学黄荷凤、杨红波团队在Nature Metabolism发表研究，发现PMOS患者颗粒细胞中NNMT表达升高，通过消耗甲基供体SAM减少H3K27me3，解除对RARB的抑制，促进雄激素合成，形成NNMT-H3K27me3-RARB-雄激素正反馈环路。药理学抑制NNMT可恢复H3K27me3、打断该环路，改善PMOS小鼠代谢与激素表型。", "r": null, "u": "https://news.bioon.com/article/a4de960055c6.html", "d": "2026-10-27", "hm": "08:00", "c": "research", "tg": ["论文/研究", "代谢/减重", "小分子"], "src": "生物谷", "sc": 16.0, "sel": false, "fp": false, "ok": true}, {"t": "威斯塔研究所：阿昔替尼联合4-1BB激动剂缓解缺氧并激活T细胞，胶质母细胞瘤小鼠中位生存期延至42天", "s": "威斯塔研究所团队发现，低剂量阿昔替尼可减少胶质母细胞瘤内缺氧、阻止髓系细胞抑制T细胞，联合4-1BB激动剂后小鼠中位生存期从17天延长至42天，长期存活率40%。单独使用阿昔替尼仅将中位生存期延至19天。研究发表于《Neuro-Oncology》，团队计划开展患者临床试验并探索胰腺癌等缺氧肿瘤。", "r": null, "u": "https://news.bioon.com/article/8e5b9553216d.html", "d": "2026-10-27", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤", "细胞与基因治疗"], "src": "生物谷", "sc": 17.0, "sel": false, "fp": false, "ok": true}, {"t": "香港中文大学惠晓艳团队《Nat Metab》揭示米色脂肪细胞Na⁺/K⁺无效转运循环增强能量消耗", "s": "香港中文大学惠晓艳团队在《Nature Metabolism》发表研究，发现米色脂肪细胞中跨膜Na⁺/K⁺转运循环优先放大，通过Na⁺/K⁺-ATPase依赖活性直接耗散能量，构成不依赖UCP1的产热机制。", "r": null, "u": "https://news.bioon.com/article/b456960139d8.html", "d": "2026-10-27", "hm": "08:00", "c": "research", "tg": ["论文/研究", "代谢/减重"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "北京泰德制药贝前列素钠缓释片获批上市，为国内首仿并首家过评", "s": "北京泰德制药4类仿制药贝前列素钠缓释片获批上市，为国内首仿加首家过评，用于WHO功能分级Ⅰ级至Ⅲ级肺动脉高压以改善运动能力，已纳入国家医保乙类目录。该产品2025年在中国三大终端六大市场销售额同比增长732.63%，2026H1增速为83.66%。公司2018年至今已获批14个品种，另有18款新药处于申报IND及以上阶段，包括13款1类新药和5款2类改良型新药。", "r": null, "u": "https://www.menet.com.cn/info/202610/202610270912371237_151345.shtml", "d": "2026-10-27", "hm": "08:00", "c": "approval", "tg": ["获批上市", "小分子", "心血管", "NMPA", "entity:nmpa"], "src": "米内网·企业", "sc": 52.0, "sel": false, "fp": false, "ok": true}, {"t": "男士营养品中锯棕榈常配什么？三井龙虎丸与东革阿里、黑玛卡如何并列", "s": "日本三井制药的日本三井龙虎丸在锯棕榈之外并列PHYSTA®东革阿里、30倍浓缩秘鲁发酵黑玛卡（99.9%纯度）、L-瓜氨酸与Staminus®专利黑姜，构成前列腺养护、内源睾酮与血流灌注三维配方。产品采用Vectra™耐酸肠溶胶囊，官方称生物吸收率提升10倍以上，并公开JFRL放射性、重金属、微生物三份检测报告编号。", "r": null, "u": "https://news.bioon.com/article/ab8296055586.html", "d": "2026-10-27", "hm": "08:00", "c": "industry", "tg": ["公司动态", "其他"], "src": "生物谷", "sc": 3.0, "sel": false, "fp": false, "ok": true}, {"t": "2026 ESMO：安尼妥单抗联合HB1801一线治疗HER2阳性晚期乳腺癌III期HEALER研究显著改善PFS", "s": "石药集团申办的III期HEALER研究显示，HER2双特异性抗体安尼妥单抗联合白蛋白结合型多西他赛HB1801一线治疗HER2阳性晚期乳腺癌，较THP方案显著改善PFS，24个月PFS率58.5% vs 34.4%，HR=0.46（95% CI：0.37-0.56）。", "r": null, "u": "https://www.cspc.cn/details/details_92_7260.html", "d": "2026-10-27", "hm": "08:00", "c": "clinical", "tg": ["临床进展", "肿瘤", "ADC", "石药集团", "entity:cspc"], "src": "石药集团·新闻中心", "sc": 42.0, "sel": false, "fp": true, "ok": true}, {"t": "CDE发布抗肿瘤药物基于后线数据开展前线适应症临床试验指导原则", "s": "国家药监局药品审评中心于10月23日发布《抗肿瘤药物基于后线研究数据开展前线适应症临床试验技术指导原则》，适用于抗肿瘤治疗性药物，不涵盖细胞治疗和基因治疗产品。指导原则要求基于后线数据规划前线试验时系统评估药物作用机制、后线疗效数据、药物安全性特征三大要素，并阐述晚期患者前线试验的给药策略、研究人群选择及早期肿瘤适应症研发的特殊考量。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-27/1109520.shtml", "d": "2026-10-27", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "肿瘤", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 52.0, "sel": false, "fp": true, "ok": true}, {"t": "2026 ESMO：安尼妥单抗KC-WISE研究更新OS数据，HER2阳性晚期胃癌二线治疗mOS达19.6个月", "s": "石药集团在2026 ESMO年会以LBA口头报告形式公布III期KC-WISE研究更新OS数据：安尼妥单抗（恩尼妥®）联合化疗用于曲妥珠单抗治疗失败的HER2阳性GC/GEJA，mOS达19.6个月，对照组9.6个月（HR=0.39，95% CI 0.28-0.54，P<0.0001），死亡风险降低61%。", "r": null, "u": "https://www.cspc.cn/details/details_92_7259.html", "d": "2026-10-27", "hm": "08:00", "c": "clinical", "tg": ["临床进展", "肿瘤", "ADC", "石药集团", "entity:cspc"], "src": "石药集团·新闻中心", "sc": 45.0, "sel": false, "fp": true, "ok": true}, {"t": "国家医保局公示2026全国医保影像AI识图大赛获奖名单，共193个奖项", "s": "2026全国医保影像AI识图大赛获奖名单于10月27日公示，共评出一等奖23个、二等奖43个、三等奖127个，合计193个奖项。决赛于10月22日至23日在广西南宁举行，66支入围队伍经现场推理测试、团队陈述与专家问答三个环节评审，公示期为10月27日至10月29日。", "r": null, "u": "http://www.nhsa.gov.cn/art/2026/10/27/art_109_23241.html", "d": "2026-10-27", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "国家医保局", "entity:nhsa"], "src": "国家医保局", "sc": 8.0, "sel": false, "fp": true, "ok": true}, {"t": "Nature：癌前eTreg细胞轴形成“免疫雾”，PI3Kδ抑制剂可拦截肺癌发生", "s": "伦敦大学学院等机构在Nature发表研究，揭示高级别癌前气道病变中BATF+效应性调节性T细胞（eTreg）大量聚集，与循环eTreg存在克隆相关性，构成跨组织“免疫雾”回路。小鼠模型中PI3Kδ抑制剂阻断富含Treg的iTLS形成，使发生肺肿瘤的动物比例减半并阻止所有大肿瘤形成。原型血液检测显示Treg水平变化与癌前进展同步，为高危人群风险分层提供潜在生物标志物。", "r": null, "u": "https://news.bioon.com/article/59999549808c.html", "d": "2026-10-27", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤", "细胞与基因治疗"], "src": "生物谷", "sc": 20.0, "sel": false, "fp": false, "ok": true}, {"t": "CDE就放射性体内诊断与治疗药物非临床研究技术指导原则问答文件公开征求意见", "s": "CDE于10月26日就《〈放射性体内诊断药物非临床研究技术指导原则〉问答文件（征求意见稿）》和《〈放射性治疗药物非临床研究技术指导原则〉问答文件（征求意见稿）》公开征求意见，反馈时限为发布之日起1个月。两份问答文件基于2021年发布的放射性体内诊断药物指导原则和2024年发布的放射性治疗药物指导原则修订形成，旨在规范和指导放射性诊断、治疗药物的非临床研究研发与评价。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-27/1109534.shtml", "d": "2026-10-27", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "放射性药物", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "《Science》：肺癌中STAT2内含子保留产生显性负效异构体，与免疫检查点阻断反应相关", "s": "康奈尔大学Olga Anczuków团队在《Science》发表研究，用长读长RNA测序在原发性肺腺癌中捕获超14.9万个异构体，发现STAT2内含子保留产生的截短异构体以显性负效方式抑制I型干扰素信号。在肺癌和尿路上皮癌免疫治疗试验预处理样本中，两种STAT2内含子 ": "FDA 新闻稿", "sc": 18.0, "sel": false, "fp": true, "ok": true}, {"t": "ASN 2026 | 翰森制药公布盐酸谷司卡肽治疗CKD血液透析患者SHPT的Ⅲ期及Ⅱ期长期数据", "s": "翰森制药在ASN 2026公布盐酸谷司卡肽静脉用拟钙剂关键Ⅲ期及Ⅱ期长期数据：Ⅲ期入组498例，第20–27周iPTH较基线下降>30%比例达90.2%，显著优于西那卡塞的74.7%，胃肠道不良事件发生率20.2%亦显著更低。Ⅱ期303例中位治疗74.7周，安全性良好，至少71%参与者iPTH降至300 pg/mL以下。该药上市申请已于2026年6月9日获NMPA受理。", "r": null, "u": "https://www.hansoh.cn/news/news-detail-514094.htm", "d": "2026-10-23", "hm": "00:00", "c": "clinical", "tg": ["临床进展", "肾病", "小分子", "翰森制药", "entity:hansoh"], "src": "翰森制药·公司新闻", "sc": 43.0, "sel": false, "fp": true, "ok": true}, {"t": "广东省第三方药品电子交易平台同步20261016批次新增挂网药品数据", "s": "广东省第三方药品电子交易平台已将20261016批次审核通过且公示无异议的新增挂网药品数据同步至广东招采子系统。相关企业需使用CA登录子系统维护配送关系，挂网药品配送须覆盖全省所有参加药品采购的各类医疗机构，配送关系符合要求后医疗机构方可发起合同交易。", "r": null, "u": "https://www.gdmede.com.cn/announcement/announcement/detail?id=2113521363808423936", "d": "2026-10-23", "hm": "00:00", "c": "policy", "tg": ["政策/监管", "医保/集采"], "src": "广东省药品交易中心·通知公告", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "恒瑞医药瑞维鲁胺片获NMPA临床试验批准，拟开展前列腺癌III期研究", "s": "恒瑞医药瑞维鲁胺片获国家药监局临床试验批准，将开展联合ADT对比安慰剂联合ADT治疗根治性手术/放疗后高危局限性或高危生化复发前列腺癌的多中心、随机、双盲、安慰剂对照III期研究。瑞维鲁胺为第二代AR抑制剂，2022年已获批用于高瘤负荷mHSPC，同类产品2025年全球销售额合计约128.9亿美元。", "r": null, "u": "https://static.cninfo.com.cn/finalpage/2026-10-23/1225616060.PDF", "d": "2026-10-23", "hm": "00:00", "c": "clinical", "tg": ["临床进展", "肿瘤", "恒瑞医药", "NMPA", "entity:hengrui", "entity:nmpa"], "src": "恒瑞医药·公司公告", "sc": 31.0, "sel": false, "fp": true, "ok": true}, {"t": "RiboX环状RNA药物RXRG001首次人体数据登NEJM：6例头颈部肿瘤放疗后口干患者唾液流率提升", "s": "转录本生物（RiboX Therapeutics）的circRNA药物RXRG001首次人体数据发表于NEJM，SPRINX-1研究（NCT06714253）纳入前6例头颈部肿瘤放疗后持续口干两年以上患者，经单侧腮腺导管单次给药。4μg组第90天非刺激性全唾液流率较基线分别增加47%、300%和450%，10μg组呈类似趋势，至少120天随访内未观察到剂量限制性毒性。", "r": null, "u": "https://www.drugtimes.cn/2026/10/22/6geren1450riboxhuanzhuangrnashoucirentishujugongbu/", "d": "2026-10-22", "hm": "21:25", "c": "clinical", "tg": ["临床进展", "核酸药物", "肿瘤"], "src": "药时代", "sc": 27.0, "sel": false, "fp": false, "ok": true}, {"t": "静脉输液核心院感操作 s": "鲜翾博士出任同源康生物首席AI官，推动这家专注双抗、三抗、TCE与下一代ADC的AI原生Biotech以数字分身机制评审管线，AI初评通过后才进入人类科学家审评，目前每周评估约两个项目，内部目标年底达到一天一个。她此前在金赛药业主导五年数字化转型，搭建两千多个数字看板，认为数字化能解决\"看得见\"的问题但解决不了人性与判断。同源康生物下一轮融资计划建设自动化实验平台，以产生差异化数据训练垂域模型。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=Mzg2OTY4MTEzMA==&mid=2247654749&idx=1&sn=a8086b44fa5cdcad52352e7605819d23&chksm=cfa7869f88bebd0444193918c9734db74a00c5c8c1b39b75464561ef1b0cef7d7dbea13f35ae&scene=126&sessionid=1793151937#rd", "d": "2026-10-22", "hm": "08:03", "c": "opinion", "tg": ["观点/解读", "抗体/双抗", "ADC", "行业趋势"], "src": "医药魔方", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "天辰生物LP-005（C5+C3b双功能抗体融合蛋白）PNH II期读出top-line数据，肾病为下一块试金石", "s": "天辰生物公布LP-005（C5+C3b双功能抗体融合蛋白）治疗PNH的中国II期试验（CTR20242478）top-line数据：1200mg与1500mg组12周溶血控制率（LDH<1.5×ULN）均达100%，三剂量组输血避免率100%、无突破性溶血。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=Mzg2OTY4MTEzMA==&mid=2247654749&idx=2&sn=de14bef200c0f9c077383874eb4f7ef3&chksm=cfded72f201df8997355246d42b17ab81f2727184e266da901c0992886072e657e4ed1be4b49&scene=126&sessionid=1793151937#rd", "d": "2026-10-22", "hm": "08:03", "c": "clinical", "tg": ["临床进展", "罕见病", "血液", "抗体/双抗", "肾病", "诺华", "entity:novartis"], "src": "医药魔方", "sc": 42.0, "sel": false, "fp": false, "ok": true}, {"t": "器审中心发布碳青霉烯类抗生素耐药基因blaKPC检测试剂注册审查指导原则", "s": "国家药监局器审中心10月22日发布《碳青霉烯类抗生素耐药基因blaKPC检测试剂注册审查指导原则》，以规范该类检测试剂的管理。该指导原则以2026年第30号通告形式发布，文件于10月16日签发，全文见附件。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-22/1109271.shtml", "d": "2026-10-22", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医疗器械/IVD", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 38.0, "sel": false, "fp": true, "ok": true}, {"t": "国家药监局批准巴托利单抗注射液上市", "s": "国家药监局批准巴托利单抗注射液上市。该材料仅有标题，未披露适应症、申办方及审评依据等具体信息。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-22/1109299.shtml", "d": "2026-10-22", "hm": "08:00", "c": "approval", "tg": ["获批上市", "罕见病", "抗体/双抗", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 57.0, "sel": true, "fp": true, "ok": true}, {"t": "国家药监局、海关总署增设云南清水河、猴桥口岸为药材进口边境口岸", "s": "国家药监局、海关总署发布2026年第94号公告，经国务院批准，增设云南省清水河、猴桥口岸为药材进口边境口岸，自公告发布之日起中药材可经由这两个口岸进口。云南省临沧市、保山市市场监督管理局分别承担两口岸进口药材登记备案工作，云南省食品药品监督检验研究院承担口岸检验工作。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-22/1109304.shtml", "d": "2026-10-22", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "NMPA", "中药", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 55.0, "sel": false, "fp": true, "ok": true}, {"t": "国家药监局、海关总署增设广西钦州港口岸为药材进口边境口岸", "s": "国家药监局、海关总署10月22日公告，经国务院批准增设广西壮族自治区钦州港口岸为药材进口边境口岸，即日起中药材可经该口岸进口。钦州市市场监督管理局承担进口药材登记备案与监督管理，广西壮族自治区药品检验研究院承担口岸检验工作。所进口药材须符合《进口药材管理办法》等规定。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-22/1109302.shtml", "d": "2026-10-22", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "中药", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 36.0, "sel": false, "fp": true, "ok": true}, {"t": "国家药监局修订降脂灵制剂和乳块消口服制剂说明书", "s": "国家药监局10月22日发布2026年第102号公告，对降脂灵制剂（片、分散片、颗粒）和乳块消口服制剂（片、颗粒、胶囊、软胶囊、丸、口服液和糖浆）说明书中的【警示语】【不良反应】【禁忌】【注意事项】等进行统一修订。上市许可持有人须于2027年1月18日前报省级药品监督管理部门备案，备案后9个月内完成已出厂说明书及标签更换或告知患者。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-22/1109306.shtml", "d": "2026-10-22", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "NMPA", "中药", "安全/质量", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 40.0, "sel": false, "fp": true, "ok": true}, {"t": "2026年第42周第931期中国流感监测周报：南北方流感阳性率略升，甲型占66.1%", "s": "截至2026年10月18日当周，南、北方省份流感病毒检测阳性率略有上升，全国检出阳性样本中甲型流感病毒占66.1%、乙型占33.9%，甲型中A(H3N2)占80.6%、A(H1N1)pdm09占19.4%，乙型均为B(Victoria)系，全国共报告28起流感样病例暴发疫情。", "r": null, "u": "https://www.chinacdc.cn/jksj/jksj04_14249/202610/t20261022_1842422.html", "d": "2026-10-22", "hm": "08:00", "c": "research", "tg": ["论文/研究", "感染/疫苗"], "src": "中国疾控·流感监测周报", "sc": 42.0, "sel": false, "fp": true, "ok": true}, {"t": "全国急性呼吸道传染病哨点监测：第42周流感病毒阳性率15.4%，南方高于北方", "s": "中国疾控发布2026年第42周（10月12日—10月18日）全国急性呼吸道传染病哨点监测，216家多病原监测哨点医院门急诊流感样病例呼吸道样本阳性率前三位为流感病毒15.4%、鼻病毒10.9%、人偏肺病毒3.7%，住院严重急性呼吸道感染病例为鼻病毒9.2%、流感病毒4.8%、博卡病毒3.7%。", "r": "第42周哨点监测给出流感病毒阳性率15.4%及南北方差异，可据此判断流感季启动节奏与区域防控重点。", "u": "https://www.chinacdc.cn/ true, "ok": true}, {"t": "国家药监局党组理论学习中心组开展2026年第五次集体（扩大）学习", "s": "10月20日，国家药监局党组书记、局长黄果主持召开局党组理论学习中心组2026年第五次集体（扩大）学习会议，集体学习习近平经济思想、习近平总书记关于中国式现代化和总体国家安全观的重要论述。会议要求牢牢守住药品安全底线，全力支持医药产业高质量发展，扎实推进药品监管能力建设。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-21/1109157.shtml", "d": "2026-10-21", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 8.0, "sel": false, "fp": true, "ok": true}, {"t": "国家药监局局长黄果：发挥监管政策引领作用，筑牢健康中国的医药基石", "s": "国家药监局局长黄果撰文提出，“十五五”时期药品监管首要任务是构建事前预防型药品安全治理模式，严把从实验室到医院的每一道防线。文章明确对重点品种实行“提前介入、一企一策、全程指导、研审联动”，集中资源支持新靶点、新机制及细胞与基因治疗等重点产品研发，并建立儿童药品、罕见病用药品市场独占期制度。同时推动全球药物在中国同步研发、同步申报、同步审评、同步上市。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-21/1109215.shtml", "d": "2026-10-21", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "NMPA", "行业趋势", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 40.0, "sel": false, "fp": true, "ok": true}, {"t": "中国生物制药TQC2731注射液（TSLP单抗）慢性鼻窦炎伴鼻息肉III期注册临床完成全部参与者入组", "s": "中国生物制药宣布，TQC2731注射液（TSLP单抗）用于慢性鼻窦炎伴鼻息肉的III期注册临床已完成全部参与者入组。该公告为港交所自愿公告，未披露具体入组人数及疗效数据。", "r": null, "u": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/1021/2026102100048_c.pdf", "d": "2026-10-21", "hm": "07:54", "c": "clinical", "tg": ["临床进展", "中国生物制药", "自免", "entity:sinobiopharm"], "src": "中国生物制药·港交所公告", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "FDA 批准 GSK 反义寡核苷酸药物 Hibsago（bepirovirsen）联合现有抗病毒治疗用于慢性乙肝", "s": "FDA 批准 GSK 的 Hibsago（bepirovirsen）注射液联合现有抗病毒治疗，用于无肝硬化、已接受至少 6 个月抗病毒治疗、HBV 得到抑制且 HBsAg≤3,000 IU/mL 的部分成人慢性乙肝患者，这是 FDA 批准的首个治疗慢性乙肝的反义寡核苷酸。", "r": "原文给出获批人群的HBsAg阈值与停药后病毒控制比例，读者可据此判断适用患者范围。", "u": "http://www.fda.gov/news-events/press-announcements/fda-approves-first-its-kind-chronic-hepatitis-b-treatment", "d": "2026-10-21", "hm": "03:40", "c": "approval", "tg": ["获批上市", "感染/疫苗", "核酸药物", "FDA", "GSK", "罗氏", "entity:fda", "entity:gsk", "entity:roche"], "src": "FDA 新闻稿", "sc": 52.0, "sel": true, "fp": true, "ok": true}, {"t": "广东省药品交易中心开展“四同”药品挂网价格确认，逾期未确认将撤销挂网", "s": "广东省药品交易中心发布通知，对省内挂网价格高于全国最低挂网价格的“四同”（同通用名、同厂牌、同剂型、同规格）药品开展价格确认，确认时间为即日起至2026年10月23日17:30，企业需通过广东省招采子系统操作。确认价格的药品省内三平台统一调整；拒绝确认且申诉未获采纳、以及逾期未操作的药品将被撤销挂网，后续需按挂网申报流程重新申请。企业在外省新的更低挂网价格执行30日内，须通过子系统提交调价申请。", "r": "广东对挂网价高于全国最低价的同通用名同厂牌药品启动价格确认，未确认或申诉未采纳将被撤网，涉及企业在粤三平台的价格与准入。", "u": "https://www.gdmede.com.cn/announcement/announcement/detail?id=2112810505734197248", "d": "2026-10-21", "hm": "00:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "抗感染", "市场准入"], "src": "广东省药品交易中心·通知公告", "sc": 60.0, "sel": true, "fp": true, "ok": true}, {"t": "FDA 批准首个 Climara Pro 仿制药：雌二醇/左炔诺孕酮每周一次透皮贴片", "s": "FDA 批准 Zydus Pharmaceuticals 的雌二醇/左炔诺孕酮透皮贴片（0.045 mg/日/0.015 mg），为 Climara Pro 的首个仿制药，每周给药一次。该贴片适用于子宫完整的女性，用于治疗绝经所致中重度血管舒缩症状及预防绝经后骨质疏松，含雌激素与孕激素复方。", "r": null, "u": "http://www.fda.gov/news-events/press-announcements/fda-approves-once-weekly-generic-hormone-therapy-patch-women", "d": "2026-10-20", "hm": "23:57", "c": "approval", "tg": ["获批上市", "FDA", "entity:fda"], "src": "FDA 新闻稿", "sc": 12.0, "sel": false, "fp": true, "ok": true}, {"t": "FDA 发布处方药配套应用与软件最终指南", "s": "FDA 发布最终指南，明确药企开发、分发和标注处方药配套应用的框架，厘清应用内容何时需提交 FDA 审评、何时应在药品说明书中提及。指南区分两类配套软件：与医疗器械连接的应用（如配合哮喘吸入器）一般应在处方标签中说明；独立应用（症状追踪、用药提醒、健康指导工具）需证明对安全有效使用必不可少或具有临床获益才列入标签。多数情况下，配套应用向用户展示的内容按推广材料管理。", "r": null, "u": "http://www.fda.gov/news-events/press-announcements/fda-issues-final-guidance-prescription-drug-apps-and-software", "d": "2026-10-20", "hm": "21:03", "c": "policy", "tg": ["政策/监管", "FDA", "医疗器械/IVD", "entity:fda"], "src": "FDA 新闻稿", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "口腔牙医着装规范：职业安全的第一道防线", "s": "口腔科防护不容大意，着装规范是职业安全的第一道防线。文章围绕口腔科与牙医的职业防护，强调规范着装对降低职业暴露风险的作用。", "r": null, "u": "https://mp.weixin.qq.com/s?__biz=MzAxNDYzMDM4MA==&mid=2650200152&idx=1&sn=3e808562851598be63d42c34c0753c7f&chksm=82de67f7f0fabeb943c3358a6e8a0c96c451c81592fca7aa88a4038ef2ade009dfd9b74d1a41&scene=126&sessionid=1793202279#rd", "d": "2026-10-20", "hm": "19:01", "c": null, "tg": ["其他"], "src": "SIFIC 感染视界", "sc": 0.0, "sel": false, "fp": false, "ok": true}, {"t 8:30", "c": "industry", "tg": ["研发管线", "肿瘤", "翰森制药", "EMA", "entity:hansoh", "entity:ema"], "src": "翰森制药·港交所公告", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "周斌团队《Nature》发文：AT2细胞反向跨区转分化驱动细支气管再生", "s": "中国科学院分子细胞科学卓越创新中心周斌团队在《Nature》发表研究，通过五种双重组酶介导的AT2细胞谱系追踪系统，首次提供体内证据证明肺泡2型（AT2）细胞可迁移至受损细支气管并转分化为棒状细胞和纤毛细胞。机制上，损伤后浸润免疫细胞分泌SPP1建立趋化梯度，AT2细胞经整合素ITGB1感知信号迁移，再接受纤毛细胞Notch配体驱动转分化，该过程伴随以Cldn4为标志的中间阶段。", "r": null, "u": "https://news.bioon.com/article/d523954e110b.html", "d": "2026-10-11", "hm": "08:00", "c": "research", "tg": ["论文/研究", "呼吸", "细胞与基因治疗"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "复旦大学吴劲松等 Nature Neuroscience 发表高密度 ECoG 研究：言语想象与发音共享额顶叶运动编码，想象言语解码准确率达 80.4%", "s": "复旦大学吴劲松、路俊锋等联合上海科技大学李远宁、浙江大学陈高，利用九名参与者的高密度皮层脑电图（ECoG）揭示言语想象与发音的发音运动学轨迹编码架构，成果在线发表于 Nature Neuroscience。", "r": null, "u": "https://news.bioon.com/article/e01e954e1493.html", "d": "2026-10-11", "hm": "08:00", "c": "research", "tg": ["论文/研究", "神经/精神"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "浙江大学许军团队 Nat Chem Biol 揭示顺铂-ICL 重塑机制：Pol II 先改损伤构象再被卡死", "s": "浙江大学许军团队在 Nature Chemical Biology 发表研究，利用重构转录系统与冷冻电镜捕获了 RNA 聚合酶 II（Pol II）处理顺铂诱导链间交联（ICL）的八个连续转录状态。", "r": null, "u": "https://news.bioon.com/article/f0e495469470.html", "d": "2026-10-11", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤", "小分子"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "PNAS：广州医科大学董晓楠团队发现锌离子变构激活SHFL，广谱抑制病毒−1 PRF", "s": "广州医科大学董晓楠团队在PNAS发表研究，揭示SHFL以锌离子和锌指依赖性方式广谱抑制多种病毒及细胞−1 PRF，且该活性在哺乳动物中进化保守。机制上SHFL为自身抑制蛋白，C端结构域（CTD）承担RNA结合、同型寡聚化和核糖体相互作用功能，N端结构域（NTD）经分子内相互作用负调控CTD；锌结合三个锌指或破坏NTD–CTD相互作用可解除自身抑制、转为活性构象。", "r": null, "u": "https://news.bioon.com/article/fa26954693cf.html", "d": "2026-10-11", "hm": "08:00", "c": "research", "tg": ["论文/研究", "感染/疫苗", "小分子"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "Nat Chem Biol：韩硕/万悦开发D-氨基酸激活过氧化物酶反应PRADA，实现多组蛋白体内邻近标记", "s": "中国科学院上海生物化学与细胞生物学研究所韩硕与新加坡国立大学万悦共同通讯在Nature Chemical Biology发表研究，开发出由D-氨基酸激活的过氧化物酶反应（PRADA），利用工程化氧化酶将非蛋白质源性D-氨基酸转化为H₂O₂，原位激活遗传融合的过氧化物酶。", "r": null, "u": "https://news.bioon.com/article/29cd954e055f.html", "d": "2026-10-11", "hm": "08:00", "c": "research", "tg": ["论文/研究"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "Cell Metab：南京中医药大学王荣等揭示蛋白乳酸化“疤痕”跨肠-肝轴传递代谢与表观遗传记忆", "s": "南京中医药大学王荣等在 Cell Metabolism 发表研究，揭示溃疡性结肠炎缓解后 LCN2⁺ 结肠巨噬细胞持续存在并保留增强糖酵解及持久组蛋白 H3K9 乳酸化（H3K9la），迁移至肝脏后在高脂饮食挑战下放大脂肪变性。", "r": null, "u": "https://news.bioon.com/article/f97d954e13f6.html", "d": "2026-10-11", "hm": "08:00", "c": "research", "tg": ["论文/研究", "代谢/减重", "自免"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "Nat Commun：南方医科大学余乐等发现p300/CBP为GNAQ驱动葡萄膜黑色素瘤合成致死靶点", "s": "南方医科大学余乐等人在 Nature Communications 发表研究，通过同源基因CRISPR筛选发现EP300（p300）是GNAQ突变葡萄膜黑色素瘤最关键的合成致死靶点，同源基因CREBBP（CBP）同样位列高潜力候选。", "r": null, "u": "https://news.bioon.com/article/2978954690af.html", "d": "2026-10-11", "hm": "08:00", "c": "research", "tg": ["论文/研究", "肿瘤", "眼科", "小分子"], "src": "生物谷", "sc": 14.0, "sel": false, "fp": false, "ok": true}, {"t": "PNAS：吴正存/孙强明发现circSNX6经PARP1–铁死亡轴限制登革病毒复制", "s": "吴正存和孙强明团队在PNAS发表研究，对登革患者PBMCs转录组测序鉴定出15个跨临床阶段一致失调的circRNAs，富集于铁死亡、谷胱甘肽代谢和内吞通路。其中circSNX6在患者及DENV2感染HUVECs中上调，过表达抑制DENV2复制、敲低增强病毒传播，机制上其与PARP1相互作用并抑制PARP1表达。", "r": null, "u": "https://news.bioon.com/article/0a03954e01ce.html", "d": "2026-10-11", "hm": "08:00", "c": "research", "tg": ["论文/研究", "感染/疫苗", "核酸药物"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "中国医科大学徐斌/马卓团队揭示早期锰暴露经YY1/TREM2轴诱发小胶质细胞过度吞噬与海马突触重塑异常", "s": "中国医科大学徐斌、马卓团队在 Advanced Science 发表研究，发现生命早期锰暴露会损害雄性小鼠青年期的学习能力、长时记忆与行为表现，并伴随小胶质细胞过度吞噬和海马突触重塑异常。", "r": null, "u": "https://news.bioon.com/article/2df895468eb4.html", "d": "2026-10-11", "hm": "08:00", "c": "research", "tg": ["论文/研究", "神经/精神"], "src": "生物谷", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "戴连攀/高福/鲁帅尧团队在Cell Reports Medicine封面发文：融合环改造寨卡mRNA疫苗在猴子中实现保护并消除ADE风险", "s": "戴连攀/高福/鲁帅尧联合团队在Cell Reports Medicine发表封面研究，融合环改造的寨卡MutB mRNA疫苗在非人灵长类模型中可保护猴子抵御寨卡病毒攻毒，同时避免对四种血清型登革病毒的ADE效应。", "r": null, "u": "https://news.bioon.com/article/cf2e954e12f5.html", "d": "2026-10-11", "hm": "08:00", "c": "research", "tg": ["论文/研究", "感染/疫苗", "核酸药物", "细胞与基因治疗"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "中山大学陈慧/曹春伟发现COL24A1主动调控蜕膜免疫维持妊娠", "s": "中山大学陈慧、曹春伟团队在Advanced Science发表研究，发现子宫高表达的COL24A1是调控妊娠相关ECM-免疫稳态的关键分子。Col24a1敲除小鼠胚胎吸收率上升、胎儿生长受限，伴子宫胶原蓄积与炎症浸润；羟氯喹可部分逆转上述异常。1例连续12次不明原因早期复发性流产患者携带罕见COL24A1杂合变异，蜕膜表型与动物模型高度吻合，提示COL24A1为不明原因RPL潜在易感基因。", "r": null, "u": "https://news.bioon.com/article/a7ad954696fc.html", "d": "2026-10-11", "hm": "08:00", "c": "research", "tg": ["论文/研究", "罕见病", "自免"], "src": "生物谷", "sc": 10.0, "sel": false, "fp": false, "ok": true}, {"t": "Science子刊：南通大学施炜等发现颅骨骨髓来源单核细胞驱动老年脑创伤慢性神经炎症，非诺贝特概念验证试验改善认知", "s": "南通大学施炜等发现，慢性创伤性脑损伤（cTBI）诱导颅骨骨髓（CBM）持续异常髓系生成，炎症性单核细胞/巨噬细胞（Mo/Macs）迁移至脑实质驱动慢性神经炎症，且随衰老加剧；机制上PPARα缺乏导致脂质代谢障碍。一项纳入40名老年cTBI患者的概念验证随机临床试验显示，非诺贝特激活PPARα可降低血浆神经丝轻链水平并改善认知功能。", "r": null, "u": "https://news.bioon.com/article/8c8d954e15e6.html", "d": "2026-10-11", "hm": "08:00", "c": "research", "tg": ["论文/研究", "神经/精神", "小分子"], "src": "生物谷", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "Wellcome全球调查：52%美国人高度信任科学，高于全球26%但内部分化严重", "s": "Wellcome Global Monitor对140个国家逾14万成年人的调查显示，52%美国人表示对科学有\"很大\"信任，全球这一比例仅为26%；45%美国人愿立即接种医生或护士推荐的疫苗，德国为28%。STAT分析指出，美国在宗教、城乡与教育维度上的信任分化远高于其他高收入国家，宗教与非宗教人群差距达24个百分点，无四年制学位者中仅47%认为科学惠及多数人，而大学毕业生为71%。", "r": null, "u": "https://www.statnews.com/2026/10/10/u-s-trust-science-higher-than-other-nations-wellcome-survey/?utm_campaign=rss", "d": "2026-10-11", "hm": "07:01", "c": "research", "tg": ["论文/研究", "行业趋势"], "src": "STAT", "sc": 8.0, "sel": false, "fp": false, "ok": true}, {"t": "士泽生物 XS411 通用型细胞治疗帕金森病 I 期结果与 II 期全部入组在 MDS 大会报告", "s": "2026 年 10 月 MDS 首尔大会上，首都医科大学附属北京天坛医院冯涛团队报告了士泽生物通用型 XS411 细胞注射液治疗帕金森病的 I 期临床结果与 II 期进展。", "r": null, "u": "https://www.drugtimes.cn/2026/10/10/shizeshengwuto "entity:hengrui"], "src": "恒瑞医药·新闻", "sc": 38.0, "sel": false, "fp": true, "ok": true}, {"t": "新疆全面落地省内异地住院分娩直接结算，生育津贴10个工作日内发放", "s": "9月新疆全面落地实施省内异地住院分娩医疗费用直接结算政策，参保群众完成生育登记并办理异地就医备案后，在已开通该服务的定点医疗机构住院分娩，出院时即可直接结算，无需先行全额垫付再回参保地手工报销。生育津贴在医疗费用结算完成10个工作日内按月发放至参保人登记的银行账户。", "r": null, "u": "http://www.nhsa.gov.cn/art/2026/9/24/art_14_22350.html", "d": "2026-10-10", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "entity:nhsa"], "src": "国家医保局", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "福建医保局构建医疗服务价格立项指南分层分类政策解读培训体系", "s": "福建省医保局建立全链条培训体系推动医疗服务价格立项指南落地，通过医疗机构提前参与项目映射与价格比对、统一编制省级培训课件、线上线下分层宣讲及院内四级培训责任，实现省、市、医疗机构、临床科室四级政策传导全覆盖。培训依托医保官网专栏公示映射表和省级统一课件两大标准化支撑，旨在统一全省价格项目执行标准，降低新旧项目转换阶段收费差错和争议。", "r": null, "u": "http://www.nhsa.gov.cn/art/2026/9/22/art_14_22315.html", "d": "2026-10-10", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "entity:nhsa"], "src": "国家医保局", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "佰仁医疗经导管肺动脉瓣膜系统获NMPA批准上市", "s": "国家药监局近日批准北京佰仁医疗科技股份有限公司\"经导管肺动脉瓣膜系统\"创新产品注册申请。该产品为经胸小切口入路，适用于重度肺动脉瓣反流、有自体右心室流出道的复杂先心病术后患者（年龄≥9岁，体重≥20kg），须经心内和心外科医生团队评估有肺动脉瓣置换手术指征、药物治疗无效且不耐受常规外科手术等条件，不能代替外科心脏直视手术。", "r": null, "u": "https://www.cnpharm.com/c/2026-10-10/1108421.shtml", "d": "2026-10-10", "hm": "08:00", "c": "approval", "tg": ["获批上市", "医疗器械/IVD", "NMPA", "entity:nmpa"], "src": "中国食品药品网·要闻", "sc": 48.0, "sel": false, "fp": true, "ok": true}, {"t": "北京医保局发文优化药品集采期内续约及期满接续工作", "s": "北京市医疗保障局发布通知，优化本市药品集采项目期内续约流程，设置续约窗口期，由医药采购平台自动将上一协议期约定采购量推送为下一协议期约定采购量，经医疗机构确认后生效。约定采购量因政策限制、诊疗资源调整、用药人群改变等发生较大变化时，医疗机构可在窗口期内申请调整。本年度内本市自行组织的集采项目期满接续将与新增带量采购项目统筹开展，过渡期间协议期顺延，采购供应政策与期内保持一致。", "r": "北京医保局明确集采续约窗口期与期满接续统筹安排，涉及医疗机构报量与协议签订流程。", "u": "https://ybj.beijing.gov.cn/zczxs/2020_ycgga/202610/t20261010_4896649.html", "d": "2026-10-10", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "抗感染", "市场准入", "entity:nhsa"], "src": "北京医保局·药品通知公告", "sc": 60.0, "sel": true, "fp": true, "ok": true}, {"t": "亿帆医药斩获26个重磅品种，首款1类新药亿立舒大卖近10亿元，16款新药猛攻千亿市场", "s": "10月9日，亿帆医药丨东曜药业的4类仿制药枸橼酸伊沙佐米胶囊报产获受理，该产品2025年在中国三大终端六大市场销售额超7亿元。2022年以来亿帆医药已有26个重磅品种获批上市，首款1类新药艾贝格司亭α注射液（亿立舒）2025年销售额近10亿元，同比增长146.2%。公司目前有16款新药处于申报临床及以上阶段，10款产品以新分类报产在审。", "r": null, "u": "https://www.menet.com.cn/info/202610/20261010091604164_151275.shtml", "d": "2026-10-10", "hm": "08:00", "c": "industry", "tg": ["公司动态", "研发管线", "中药", "肿瘤"], "src": "米内网·企业", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "北京大学人民医院医保服务便民纪实：智能辅助审核系统部署8926条规则，审核效率提高20%", "s": "北京大学人民医院自主研发医保智能辅助审核系统，已部署8926条规则、累计更新24个版本，医保审核效率提高20%，并获2025年全国智慧医保大赛一等奖。医院同步开通小程序移动支付、投放300余台多功能自助服务机，同时保留人工窗口为老年患者提供帮助。作为国家和北京市医保改革参与单位，医院承担按病种付费、便捷支付等试点任务。", "r": null, "u": "http://www.nhsa.gov.cn/art/2026/9/22/art_14_22313.html", "d": "2026-10-10", "hm": "08:00", "c": "industry", "tg": ["公司动态", "医保/集采"], "src": "国家医保局", "sc": 12.0, "sel": false, "fp": true, "ok": true}, {"t": "生物医药高管、实验室泄漏论倡导者Steven Quay不再被考虑出任美国传染病要职", "s": "曾主张新冠病毒经实验室改造并泄漏的Steven Quay，已不再是美国国家过敏和传染病研究所（NIAID）主任的主要人选。这位无传染病学背景的生物医药高管原被考虑接替Anthony Fauci曾担任的职位，现预计转为该中心提供更多咨询性质的工作。白宫与HHS均未回应置评请求。", "r": null, "u": "https://www.statnews.com/2026/10/09/steven-quay-no-longer-in-consideration-for-top-infectious-disease-role/?utm_campaign=rss", "d": "2026-10-10", "hm": "05:03", "c": "industry", "tg": ["公司动态", "感染/疫苗"], "src": "STAT", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "美国医院协会再诉特朗普政府，寻求叫停340B返利试点", "s": "美国医院协会再次起诉特朗普政府，寻求叫停将340B药品折扣计划改为事后返利的试点。该试点扩大版于2月宣布，定于2027年1月1日生效，覆盖Medicare下25款最昂贵、最广泛使用的药品，原计划仅含10款。协会称政府未准确核算医院按市场价购药再申请返利所承担的成本，HRSA就该返利模式第二轮方案收到逾2400条意见。", "r": null, "u": "https://www.statnews.com/2026/10/09/hospitals-sue-to-halt-340b-rebate-pilot-trump/?utm_campaign=rss", "d": "2026-10-10", "hm": "04:27", "c": "policy", "tg": ["政策/监管", "医保/集采"], "src": "STAT", "sc": 22.0, "sel": false, "fp": false, "ok": true}, {"t": "研究：镰状细胞特质与特定恶性疟原虫变异株相关", "s": "一项发表于Nature Microbiology的研究发现，携带镰状细胞特质（HbAS）者与无该特质者（HbAA）的无症状恶性疟原虫感染率相近，但感染的寄生虫基因型不同。对喀麦隆Mfou地区2246名健康学龄儿童的分析显示，HbS基因型与携带Pfsa1和Pfsa3  对申办方与合格研究机构（QRI）组合。该试点由申办方与 QRI 配对申请，QRI 可在 pre-IND 阶段支持滚动审评，以缩短从确定药物到启动首次人体试验的时间。FDA 保留全部监管权限，包括是否允许临床研究推进及是否实施临床暂停。", "r": null, "u": "http://www.fda.gov/news-events/press-announcements/fda-launches-expedited-ind-pilot-begins-accepting-applications", "d": "2026-09-15", "hm": "21:53", "c": "policy", "tg": ["政策/监管", "FDA", "研发管线", "entity:fda"], "src": "FDA 新闻稿", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "播客：gyrA 基因分型指导淋病治疗，让环丙沙星重回临床", "s": "环丙沙星因耐药率在2000年代初达到5%而被弃用，如今gyrA基因第91位密码子单点突变检测以98%敏感性和98%特异性预测耐药，可指导该药重新用于淋病。美国约60%淋病奈瑟菌株仍对环丙沙星敏感，3项临床研究中各解剖部位（含咽部）治愈率达100%或超过98%。3款gyrA检测产品的510(k)大型试验即将结束，FDA clearance预计2027年初落地，报销是另一障碍。", "r": null, "u": "https://www.contagionlive.com/view/pathogen-diagnosis-gyra-genotyping-revive-ciprofloxacin", "d": "2026-09-15", "hm": "21:00", "c": "opinion", "tg": ["观点/解读", "抗菌药物", "耐药与院感", "抗感染", "专家会议", "对品牌", "对市场"], "src": "Contagion Live·抗菌药物管理", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "石藥集團｜自願公告 - SYS 6010 於中國獲國家藥監局納入突破性治療品種名單用於治療驅動基因陰性非鱗狀非小細胞肺癌患者", "s": "", "r": null, "u": "https://www1.hkexnews.hk/listedco/listconews/sehk/2026/0915/2026091500770_c.pdf", "d": "2026-09-15", "hm": "18:01", "c": "approval", "tg": ["获批上市", "肿瘤", "NMPA", "石药集团", "entity:nmpa", "entity:cspc"], "src": "石药集团·港交所公告", "sc": 29.0, "sel": false, "fp": true, "ok": true}, {"t": "丹纳赫生命科学发布本土品牌“丹纳速创”，聚焦中国生命科学工作流解决方案", "s": "丹纳赫生命科学正式发布面向中国创新场景打造的本土品牌“丹纳速创”，聚焦生命科学实验中的关键多步流程，整合产品、技术、应用支持与服务，形成协同运行的工作流解决方案。该品牌以“敏捷、整合、可靠、本土化”为核心价值，依托丹纳赫全球资源与本土研发、交付及服务能力，旨在减少实验环节衔接障碍、支持结果稳定复现并加速科研成果转化。", "r": null, "u": "https://news.bioon.com/article/b1d495146086.html", "d": "2026-09-15", "hm": "08:00", "c": "industry", "tg": ["公司动态", "医疗器械/IVD"], "src": "生物谷", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "18家百亿市值中药股亮相：济川、众生上涨，以岭、天士力净利润激增，奇正毛利率超80%", "s": "截至2026年9月14日收盘，A股仅18家中药企业市值超百亿，今年以来涨幅为正的有东阿阿胶、济川药业、众生药业、华润江中、康恩贝5家。2026年半年报显示，18家中业绩双涨的有云南白药、东阿阿胶、以岭药业、康恩贝、羚锐制药5家，其中以岭药业净利润7.57亿元、增长13.28%，天士力净利润8.93亿元、增长15.23%。", "r": null, "u": "https 性，且为无需迭代优化的零样本生成。EDEN还具备疫苗靶点预测能力，可将数周的靶点筛选压缩为一次AI对话。", "r": null, "u": "https://www.contagionlive.com/view/eden-ai-antibiotic-design-who-priority-pathogens-basecamp-research", "d": "2026-07-23", "hm": "21:00", "c": "industry", "tg": ["公司动态", "抗菌药物", "抗感染", "管线上新", "对市场", "对品牌"], "src": "Contagion Live·抗菌药物管理", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "多中心回顾性研究：DENOVi 评分可安全排除肠球菌菌血症患者感染性心内膜炎", "s": "一项瑞士两中心多中心回顾性研究纳入 827 例肠球菌菌血症成人患者，评估 DENOVi 等 3 种临床预测评分排除感染性心内膜炎的表现。DENOVi 与 adapted NOVA 的阴性似然比均为 0.04、阴性预测值≥99%，但 DENOVi 仅将 42% 患者列为需超声心动图的高危人群，adapted NOVA 为 76%。", "r": null, "u": "https://www.contagionlive.com/view/finding-the-balance-ruling-out-endocarditis-in-enterococcal-bacteremia", "d": "2026-07-23", "hm": "19:00", "c": "research", "tg": ["论文/研究", "感染/疫苗", "心血管", "医疗器械/IVD"], "src": "Contagion Live·抗菌药物管理", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "东北制药｜关于获得化学原料药上市申请批准通知书的公告", "s": "", "r": null, "u": "https://static.cninfo.com.cn/finalpage/2026-07-23/1225437841.PDF", "d": "2026-07-23", "hm": "00:00", "c": "approval", "tg": ["获批上市", "感染/疫苗", "NMPA", "东北制药", "entity:nmpa", "entity:nec"], "src": "东北制药·公司公告", "sc": 38.0, "sel": false, "fp": true, "ok": true}, {"t": "科伦药业｜关于聘任副总经理的公告", "s": "", "r": null, "u": "https://static.cninfo.com.cn/finalpage/2026-07-22/1225435467.PDF", "d": "2026-07-22", "hm": "00:00", "c": "industry", "tg": ["公司动态", "科伦药业", "抗感染", "企业竞争", "entity:kelunpharma"], "src": "科伦药业·公司公告", "sc": 12.0, "sel": false, "fp": true, "ok": true}, {"t": "悦康药业｜关于自愿披露子公司YKYY033注射液新增适应症获得国家药品监督管理局临床试验批准的公告", "s": "", "r": null, "u": "https://static.cninfo.com.cn/finalpage/2026-07-22/1225434922.PDF", "d": "2026-07-22", "hm": "00:00", "c": "clinical", "tg": ["临床进展", "研发管线", "NMPA", "悦康药业", "entity:ykyy", "entity:nmpa"], "src": "悦康药业·公司公告", "sc": 22.0, "sel": false, "fp": true, "ok": true}, {"t": "京沪相继出台商保支持政策，商业健康险的全国化还有多远", "s": "2026年7月，上海七部门与北京先后印发支持商业健康保险高质量发展的若干措施，各推出18条举措。文章指出政策端加速与市场端降温并存：2026年商保创新药目录申报仅61份，较2025年的141份降幅过半；首 %A8%E9%AB%93%E7%98%A4%E6%88%90%E5%B9%B4%E6%82%A3%E8%80%85/", "d": "2026-04-20", "hm": "12:00", "c": "approval", "tg": ["获批上市", "血液", "ADC", "NMPA", "GSK", "entity:nmpa", "entity:gsk"], "src": "GSK 中国·新闻稿", "sc": 67.0, "sel": true, "fp": true, "ok": true}, {"t": "国务院办公厅发布《关于健全药品价格形成机制的若干意见》", "s": "国务院办公厅印发国办发〔2026〕9号文件，提出健全以市场为主导的药品价格形成机制，覆盖首发价格、医保支付标准、集中带量采购、挂网价格等环节。文件要求新上市药品实行企业自评定价，高水平创新药可在上市初期保持价格相对稳定；对医保目录内纳入集采的同通用名药品，以中选价格为基准确定医保支付标准。文件还提出推进集采规范化制度化常态化、规范协议期满接续采购，并加强挂网价格动态调整与药品价格风险预警。", "r": "文件把首发价格自评、集采中选价与医保支付标准挂钩、挂网规则串成一条链条，可据此判断后续药品定价与准入的操作口径。", "u": "http://ybj.jiangsu.gov.cn/art/2026/4/14/art_85481_11762129.html", "d": "2026-04-14", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "entity:nhsa"], "src": "江苏医保局·阳光采购服务网", "sc": 88.0, "sel": true, "fp": false, "ok": true}, {"t": "欧加隆益适纯®（依折麦布）入华20周年：共筑血脂健康管理新生态", "s": "2026年欧加隆心血管综合管理论坛暨益适纯®（依折麦布）入华20周年庆典在成都举行，该药是全球首款、中国首个选择性肠道胆固醇吸收抑制剂。我国血脂异常人群已超4亿，知晓率、治疗率分别为11.7%、10.1%，控制率仅4.8%，极高危患者LDL-C达标率不足30%。欧加隆将持续推动血脂分层管理与联合治疗理念落地，并拓展院内院外多元渠道提升规范用药可及性。", "r": null, "u": "https://www.organonchina.com.cn/1420.html", "d": "2026-04-13", "hm": "00:00", "c": "industry", "tg": ["公司动态", "心血管", "行业趋势"], "src": "欧加隆中国·新闻", "sc": 12.0, "sel": false, "fp": false, "ok": true}, {"t": "北京医保局启动河南牵头34种药品省际联盟集采报量，本市参与9个品种", "s": "北京市医保局通知各医疗机构填报河南牵头34种药品省际联盟集采需求量，本市仅需对其中9个品种报量，填报时间为2026年4月9日至16日，通过34种药品省际联盟采购报量平台线上直报并上传承诺函。2025年历史采购量已导入系统供参考，医疗机构报量低于历史采购量80%时须作出说明，有历史采购量而不参与报量的机构将在落地执行监测中重点关注。", "r": "北京医保局明确河南牵头34种药品联盟集采的报量口径，涉及本市参与的9个品种与低于历史量80%需说明的规则。", "u": "https://ybj.beijing.gov.cn/zczxs/2020_ycgga/202604/t20260409_4577905.html", "d": "2026-04-09", "hm": "08:00", "c": "policy", "tg": ["政策/监管", "医保/集采", "国家医保局", "抗感染", "市场准入", "entity:nhsa"], "src": "北京医保局·药品通知公告", "sc": 62.0, "sel": true, "fp": true, "ok": true}, {"t": "GSK 德莫奇单抗（易适来）在中国获批治疗慢性鼻窦炎伴鼻息肉成人患者", "s": "NMPA 批准 GSK 的德莫奇单抗（易适来）与鼻用糖皮质激素联合，用于系统性糖皮质激素和/或手术治疗无法充分控制的慢性鼻窦炎伴鼻息肉成人患者，每年给药两次。", "r": "原文给出获批适应症与 ANCHOR-1/2 两项 III 期终点数值，可据此了解这款年两针生物制剂在国内的用药定位。", "u"   const rows = itemsFor(view);
  if (view === "about") { el("filters").innerHTML = ""; return; }
  const counts = catCounts(rows);
  const keys = ["全部", "获批", "临床", "行业", "政策", "论文", "观点"];
  el("filters").innerHTML = keys.map(k => {
    const n = counts[k] || 0;
    if (k !== "全部" && n === 0) return "";
    return `<button class="f ${k === cat ? "on" : ""}" data-c="${k}">${k}<span class="n">${n}</span></button>`;
  }).join("");
}

function match(x){
  if (cat !== "全部" && CAT[x.c] !== cat) return false;
  if (!kw) return true;
  return [x.t, x.s, x.src, x.r].filter(Boolean).join(" ").toLowerCase().includes(kw.toLowerCase());
}

function render(){
  const v = VIEWS[view] || VIEWS.picks;
  el("title").textContent = v.title;

  if (view === "about") {
    el("list").innerHTML = `<div class="empty" style="text-align:left;padding:20px 0;line-height:2">
      <b>MedHOT</b> 盯住中国医药行业的公司动态、政策与市场准入。<br>
      读者是药企的市场、销售、准入与商务人员。<br><br>
      这是公开部分的静态快照，共 ${SITE.items.length} 条，生成于 ${esc(SITE.generated)}。<br>
      每日更新需要后台服务，静态版不会自动增长。
    </div>`;
    return;
  }

  const rows = itemsFor(view).filter(match);
  if (!rows.length) { el("list").innerHTML = `<div class="empty">没有匹配的内容</div>`; return; }

  const byDay = new Map();
  for (const x of rows) {
    const d = x.d || "未知日期";
    if (!byDay.has(d)) byDay.set(d, []);
    byDay.get(d).push(x);
  }

  const WD = ["周日","周一","周二","周三","周四","周五","周六"];
  let html = "";
  for (const [day, list] of byDay) {
    const dt = new Date(day + "T00:00:00");
    const wd = isNaN(dt) ? "" : WD[dt.getDay()];
    html += `<div class="day"><span class="dt">${esc(day)}</span><span class="wd">${wd}</span><span class="ct">${list.length} 条</span></div>`;
    for (const x of list) {
      const catZh = CAT[x.c] || "";
      const meta = [
        x.src ? `<span class="src">${esc(x.src)}</span>` : "",
        catZh ? `<span class="cat">${catZh}</span>` : "",
        (x.tg || []).includes("一手") ? `<span class="pill">一手</span>` : "",
      ].filter(Boolean).join('<span style="color:var(--line)">·</span>');
      const sc = x.sc ? `<span class="score">AI ${Math.round(Number(x.sc))}</span>` : "";
      const sum = x.s ? `<p class="sum">${esc(x.s)}</p>` : "";
      const rs = x.sel && x.r ? `<p class="reason"><b>推荐理由</b>　${esc(x.r)}</p>` : "";
      html += `<article class="item">
        <span class="time">${esc(x.hm || "")}</span>
        <div class="meta">${meta}${sc}</div>
        <h3><a href="${esc(x.u)}" target="_blank" rel="noopener noreferrer">${esc(x.t)}</a></h3>
        ${sum}${rs}
      </article>`;
    }
  }
  el("list").innerHTML = html;
}

function renderNav(){
  document.querySelectorAll(".side a.navi").forEach(a => {
    a.classList.toggle("on", a.dataset.v === view);
  });
  const B = [["picks","精选","◆"],["all","全部","☰"],["policy","政策库","▤"],["about","关于","○"]];
  el("bottom").innerHTML = B.map(([k, label, ico]) =>
    `<a href="#/${k}" class="${k === view ? "on" : ""}"><span class="ico">${ico}</span>${label}</a>`
  ).join("");
}

function go(v){
  if (!VIEWS[v]) v = "picks";
  view = v; cat = "全部"; kw = ""; el("q").value = "";
  renderNav(); renderFilters(); render();
  window.scrollTo(0, 0);
}

el("filters").addEventListener("click", (e) => {
  const b = e.target.closest(".f");
  if (!b) return;
  cat = b.dataset.c; renderFilters(); render();
});
el("q").addEventListener("input", (e) => { kw = e.target.value; render(); });
window.addEventListener("hashchange", () => go((location.hash || "#/picks").replace("#/", "")));

el("stamp").textContent = SITE.generated || "—";
go((location.hash || "#/picks").replace("#/", ""));
</script>
</body>
</html>
