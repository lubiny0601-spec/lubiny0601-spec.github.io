<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>搜索 · MedHOT</title>
<link rel="stylesheet" href="/assets/root-DKJ5Tqes.css"/>
<link rel="icon" href="/favicon.ico"/>
<style>
  html{background:var(--color-bg)}
  body{margin:0;font-family:var(--font-sans);color:var(--color-ink);background:var(--color-bg);-webkit-font-smoothing:antialiased}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px}
  .top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .back{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;border:1px solid var(--color-line-soft);background:var(--color-surface);color:var(--color-ink);text-decoration:none;flex:0 0 auto}
  .brand{font-size:15px;font-weight:600;letter-spacing:-.01em}
  .kicker{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--color-ink-4);margin:0 0 6px}
  h1{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:0 0 18px}
  .field{position:relative;margin-bottom:10px}
  .field input{width:100%;box-sizing:border-box;height:50px;border-radius:999px;background:var(--color-bg-sunk);border:1px solid var(--color-line-soft);padding:0 18px 0 46px;font-size:16px;color:var(--color-ink);outline:none;font-family:var(--font-sans)}
  .field input:focus{background:var(--color-surface);border-color:var(--color-accent);box-shadow:0 0 0 3px var(--color-accent-soft)}
  .field svg{position:absolute;left:17px;top:16px;width:18px;height:18px;stroke:var(--color-ink-4);fill:none;stroke-width:1.8;stroke-linecap:round}
  .meta{font-size:12.5px;color:var(--color-ink-4);margin:0 0 18px;min-height:18px}
  .card{display:block;text-decoration:none;background:var(--color-surface);border:1px solid var(--color-line-soft);border-radius:12px;padding:16px 18px;margin-bottom:10px;transition:border-color .15s ease}
  .card:hover{border-color:var(--color-line-strong)}
  .card h3{margin:0 0 6px;font-size:16.5px;font-weight:650;line-height:1.5;color:var(--color-ink)}
  .card p{margin:0;font-size:14px;line-height:1.7;color:var(--color-ink-3);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .foot{margin-top:8px;font-size:12px;color:var(--color-ink-4);display:flex;gap:8px}
  .empty{text-align:center;padding:60px 20px;color:var(--color-ink-4);font-size:14px;line-height:1.8}
  mark{background:var(--color-amber-soft);color:var(--color-ink);border-radius:3px;padding:0 1px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="/" aria-label="返回首页">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg>
    </a>
    <span class="brand">MedHOT</span>
  </div>
  <p class="kicker">快照版全文检索</p>
  <h1>搜索</h1>
  <div class="field">
    <svg viewBox="0 0 20 20"><circle cx="9" cy="9" r="5.5"/><path d="M13.2 13.2L17 17"/></svg>
    <input id="q" type="search" autocomplete="off" placeholder="搜标题或摘要，如：集采、医保、恒瑞" />
  </div>
  <p class="meta" id="meta"></p>
  <div id="list"></div>
  <div class="empty" id="empty" style="display:none">没有匹配的内容。<br/>换个词试试，比如「集采」「医保」「ADC」。</div>
</div>
<script>
var DATA = null, INPUT = document.getElementById('q'), LIST = document.getElementById('list'),
    META = document.getElementById('meta'), EMPTY = document.getElementById('empty');
var initial = new URLSearchParams(location.search).get('q') || '';
INPUT.value = initial;

function esc(s){ return s.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function hi(text, q){
  if(!q) return esc(text);
  var i = text.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(text.slice(i,i+q.length)) + '</mark>' + esc(text.slice(i+q.length));
}
function render(){
  var q = INPUT.value.trim();
  if(!q){ LIST.innerHTML=''; META.textContent=''; EMPTY.style.display='none'; return; }
  var ql = q.toLowerCase(), out = [];
  for(var i=0;i<DATA.length;i++){
    var r = DATA[i];
    var inT = r.t.toLowerCase().indexOf(ql) >= 0, inS = r.s.toLowerCase().indexOf(ql) >= 0;
    if(inT || inS) out.push({r:r, rank: inT?0:1});
  }
  out.sort(function(a,b){ return a.rank-b.rank || (a.r.d < b.r.d ? 1 : -1); });
  META.textContent = out.length ? '找到 ' + out.length + ' 条' : '';
  EMPTY.style.display = out.length ? 'none' : 'block';
  var html = '';
  for(var k=0;k<Math.min(out.length,60);k++){
    var r = out[k].r;
    html += '<a class="card" href="/items/' + r.i + '/"><h3>' + hi(r.t,q) + '</h3>'
         + (r.s ? '<p>' + hi(r.s,q) + '</p>' : '')
         + '<div class="foot"><span>' + esc(r.d) + '</span>' + (r.c ? '<span>· ' + esc(r.c) + '</span>' : '') + '</div></a>';
  }
  if(out.length > 60) html += '<p class="meta" style="text-align:center">只显示前 60 条，输入更具体的关键词可缩小范围。</p>';
  LIST.innerHTML = html;
}
var timer;
INPUT.addEventListener('input', function(){ clearTimeout(timer); timer = setTimeout(render, 120); });
INPUT.addEventListener('keydown', function(e){ if(e.key === 'Enter'){ e.preventDefault(); render(); history.replaceState(null,'','/search/?q='+encodeURIComponent(INPUT.value.trim())); } });

fetch('/search-index.json').then(function(r){ return r.json(); }).then(function(d){
  DATA = d; META.textContent = d.length + ' 篇内容已索引';
  if(initial) render();
}).catch(function(){ META.textContent = '索引加载失败'; });
</script>
</body>
</html>
